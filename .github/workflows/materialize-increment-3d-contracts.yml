name: Materialize Increment 3D contracts

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3d-signal-lead-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 3D branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3d-signal-lead-authority
          fetch-depth: 0
          show-progress: false

      - name: Verify and apply exact contract patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path
          import subprocess

          expected_parent = 'dd6e5ed943c08494612859464047adde682f40bb'
          parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^'], text=True
          ).strip()
          if parent != expected_parent:
              raise SystemExit(
                  f'staging parent {parent} differs from {expected_parent}'
              )

          payload_root = Path('.github/increment-3d-contracts-payload')
          expected = tuple(
              payload_root / f'part-{index:02d}.b64'
              for index in range(6)
          )
          actual = tuple(sorted(payload_root.glob('part-*.b64')))
          if actual != expected:
              raise SystemExit('contract payload chunk inventory differs')
          expected_hashes = (
              '62cf6b141dec6dfb6812c6c45ace6edb53f52a3a0cfb53482cabf71876c227b0',
              'a67bab6efdaae047682079ba55c41008a6b627873df2292810cb53fb5aa85a8c',
              '59d09129ab96f52d56a7f6b6cb71fea0f2731416e3e6cc1033b83582d0d00abb',
              'fe31ccfc46433113ad79d9ec93ba09a05494506d71cad73b62731f29959992f7',
              '269adb6996b8c80c74ce638215de8a9a34c07f30b4b9c91f5e5e27c4f065f3d2',
              'ddc8dcbc9e0f0a85d8e9e5713d1e0191063f26b13aab02ae1dcd6e730824ff29',
          )
          for path, expected_hash in zip(expected, expected_hashes, strict=True):
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit(f'contract payload chunk digest differs: {path.name}')
          encoded = b''.join(path.read_bytes() for path in expected)
          if len(encoded) != 17872:
              raise SystemExit('contract payload base64 size differs')
          if hashlib.sha256(encoded).hexdigest() != (
              'a5aa1e1751b056d9e379139d921b6d4491b8e26891f0fd515a1f128885921602'
          ):
              raise SystemExit('contract payload base64 digest differs')
          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != 13403:
              raise SystemExit('contract payload gzip size differs')
          if hashlib.sha256(compressed).hexdigest() != (
              '0cdad8f1fd623ec3fa61bcc0e914373091fea64ae34315f4c32294438e29373b'
          ):
              raise SystemExit('contract payload gzip digest differs')
          patch = gzip.decompress(compressed)
          if len(patch) != 86151:
              raise SystemExit('contract patch size differs')
          if hashlib.sha256(patch).hexdigest() != (
              '1f1d00c64d97b915b4125bf37e45469872e74cb148d81dd0d3f38b219f8523da'
          ):
              raise SystemExit('contract patch digest differs')
          Path('/tmp/increment-3d-contracts.patch').write_bytes(patch)
          PY
          git apply --check /tmp/increment-3d-contracts.patch
          git apply /tmp/increment-3d-contracts.patch
          rm -rf \
            .github/increment-3d-contracts-payload \
            .github/workflows/materialize-increment-3d-contracts.yml
          python -m compileall -q newsroom/discovery newsroom/tests
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_3d_contracts.py

      - name: Commit verified clean contract slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(discovery): add Signal Gate Lead contracts'
          git push origin HEAD:agent/increment-3d-signal-lead-authority
