name: Temporary Increment 5A review hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/temp_increment5a_review_hardening.py
      - .github/workflows/temp-increment5a-review-hardening.yml
      - scripts/temp_increment5a_finalize.py
      - .github/workflows/temp-increment5a-finalize.yml

permissions:
  contents: write

concurrency:
  group: temporary-increment5a-review-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 5A branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Generate the permanent authenticated contract
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/temp_increment5a_finalize.py

      - name: Align strengthened fixture regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          path = Path("newsroom/tests/test_increment5a_contracts.py")
          text = path.read_text(encoding="utf-8")

          proposal_import = (
              "    PROPOSAL_FIXTURE_REPLAY_PROFILE_SCHEMA_DIGEST,\n"
          )
          if proposal_import not in text:
              start_marker = "from newsroom.increment5 import (\n"
              end_marker = ")\nfrom newsroom.increment5.decision import "
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("proposal fixture test import block differs")
              block = text[start:end]
              if proposal_import in block:
                  raise SystemExit("proposal fixture import state is ambiguous")
              text = text[:end] + proposal_import + text[end:]

          old_assert = (
              "    assert packet.bundle.fixture_replay_profile_schema_digest == (\n"
              "        FIXTURE_REPLAY_PROFILE_SCHEMA_DIGEST\n"
              "    )\n"
          )
          new_assert = (
              "    assert packet.bundle.fixture_replay_profile_schema_digest == (\n"
              "        PROPOSAL_FIXTURE_REPLAY_PROFILE_SCHEMA_DIGEST\n"
              "    )\n"
          )
          if old_assert in text:
              text = text.replace(old_assert, new_assert, 1)
          elif new_assert not in text:
              raise SystemExit("proposal fixture test assertion differs")

          old_error = (
              "    with pytest.raises(Increment5ProfileError, match=\"local, zero-spend\"):\n"
              "        validate_profile_manifest(\n"
              "            tampered,\n"
              "            packet=INCREMENT_5A_DECISION_PACKET,\n"
              "        )\n"
          )
          new_error = (
              "    with pytest.raises(\n"
              "        Increment5ProfileError,\n"
              "        match=\"schema validation failed\",\n"
              "    ):\n"
              "        validate_profile_manifest(\n"
              "            tampered,\n"
              "            packet=INCREMENT_5A_DECISION_PACKET,\n"
              "        )\n"
          )
          if old_error in text:
              text = text.replace(old_error, new_error, 1)
          elif new_error not in text:
              raise SystemExit("fixture schema rejection expectation differs")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Verify focused adversarial coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m compileall -q \
            newsroom/increment5 \
            scripts/sdlc/github_transport.py \
            newsroom/tests/test_increment5a_github_attempts.py \
            newsroom/tests/test_increment5a_main_qualification.py \
            newsroom/tests/test_increment5a_traceability.py \
            newsroom/tests/test_increment5a_zero_budget_schema.py
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment5a_github_attempts.py \
            newsroom/tests/test_increment5a_main_qualification.py \
            newsroom/tests/test_increment5a_approval.py \
            newsroom/tests/test_increment5a_contracts.py \
            newsroom/tests/test_increment5a_traceability.py \
            newsroom/tests/test_increment5a_zero_budget_schema.py \
            newsroom/tests/test_sdlc_github_transport.py \
            newsroom/tests/test_sdlc_shadow_decision.py
          test ! -e newsroom/increment5/data/increment5a_owner_approval_record_v1.json
          test ! -e newsroom/increment5/data/increment5a_main_qualification_record_v2.json
          git diff --check

      - name: Verify complete deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q -n 4 --dist=worksteal

      - name: Remove temporary machinery and push permanent result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-increment5a-review-hardening.yml
          rm scripts/temp_increment5a_review_hardening.py
          rm .github/workflows/temp-increment5a-finalize.yml
          rm scripts/temp_increment5a_finalize.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f \
            newsroom/increment5/data/increment5_fixture_replay_profile_v2.schema.json
          git commit -m "fix(increment5): authenticate admission evidence"
          if git diff --name-only origin/main...HEAD | grep -E '(^|/)(temp|diagnostic|publisher|installer|patch-transport|evidence-reader)' ; then
            echo "temporary or diagnostic material remains in the PR tree" >&2
            exit 1
          fi
          git push origin HEAD:agent/increment-5a-retrieval-contract
