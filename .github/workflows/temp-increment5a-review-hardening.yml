name: Temporary Increment 5A review hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/temp_increment5a_review_hardening.py
      - .github/workflows/temp-increment5a-review-hardening.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-increment5a-review-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Increment 5A branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Make staging-script matching indentation-aware
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          path = Path("scripts/temp_increment5a_review_hardening.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)
          '''
          new = '''def _indent_block(value: str, width: int) -> str:
              prefix = " " * width
              return "\\n".join(
                  prefix + line if line else line
                  for line in value.splitlines()
              )


          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              candidates = [(old, new)] + [
                  (_indent_block(old, width), _indent_block(new, width))
                  for width in (4, 8, 12, 16, 20)
              ]
              observed = []
              for old_value, new_value in candidates:
                  count = text.count(old_value)
                  observed.append(count)
                  if count == 1:
                      return text.replace(old_value, new_value, 1)
                  if count > 1:
                      raise RuntimeError(
                          f"{label}: ambiguous match count {count}"
                      )
              raise RuntimeError(
                  f"{label}: expected one match, observed {observed}"
              )
          '''
          if text.count(old) != 1:
              raise SystemExit("replace_once helper source differs")
          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Apply authenticated admission and fixture hardening
        shell: bash
        run: uv run --no-sync python scripts/temp_increment5a_review_hardening.py

      - name: Verify focused and adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m compileall -q \
            newsroom/increment5 \
            scripts/sdlc/github_transport.py \
            newsroom/tests/test_increment5a_github_attempts.py \
            newsroom/tests/test_increment5a_main_qualification.py \
            newsroom/tests/test_increment5a_traceability.py \
            newsroom/tests/test_increment5a_zero_budget_schema.py
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment5a_github_attempts.py \
            newsroom/tests/test_increment5a_main_qualification.py \
            newsroom/tests/test_increment5a_approval.py \
            newsroom/tests/test_increment5a_contracts.py \
            newsroom/tests/test_increment5a_traceability.py \
            newsroom/tests/test_increment5a_zero_budget_schema.py \
            newsroom/tests/test_sdlc_github_transport.py \
            newsroom/tests/test_sdlc_shadow_decision.py
          test ! -e newsroom/increment5/data/increment5a_owner_approval_record_v1.json
          test ! -e newsroom/increment5/data/increment5a_main_qualification_record_v2.json
          git diff --check

      - name: Verify complete deterministic suite
        shell: bash
        run: uv run --no-sync python -m pytest -q -n 4 --dist=worksteal

      - name: Commit tested hardening and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-increment5a-review-hardening.yml
          rm scripts/temp_increment5a_review_hardening.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f \
            newsroom/increment5/data/increment5_fixture_replay_profile_v2.schema.json
          git commit -m "fix(increment5): authenticate admission evidence"
          git push origin HEAD:agent/increment-5a-retrieval-contract
