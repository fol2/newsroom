name: Publish verified Increment 5C2 authority tools

on:
  push:
    branches: [support/publish-increment5c2-authority-tools-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-verified-increment5c2-authority-tools
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/publish-increment5c2-authority-tools-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Recover, verify and publish exact authority atom
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/support/publish_increment5c2_authority_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5c2-authority-publication-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5c2-authority-focused.log
            /tmp/increment5c2-authority-full.log
            /tmp/increment5c2-authority-publication.json
            /tmp/increment5c2-authority.patch
