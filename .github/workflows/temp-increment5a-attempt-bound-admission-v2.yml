name: Temporary Increment 5A attempt-bound admission v2 migration

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/temp_increment5a_attempt_bound_admission.py
      - .github/workflows/temp-increment5a-attempt-bound-admission-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Increment 5A branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Materialise qualification-only approval and attempt-bound admission
        run: uv run --no-sync python scripts/temp_increment5a_attempt_bound_admission.py

      - name: Verify focused contract
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m compileall -q \
            newsroom/increment5 \
            newsroom/tests/test_increment5a_approval.py \
            newsroom/tests/test_increment5a_main_qualification.py
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment5a_approval.py \
            newsroom/tests/test_increment5a_contracts.py \
            newsroom/tests/test_increment5a_traceability.py \
            newsroom/tests/test_increment5a_zero_budget_schema.py \
            newsroom/tests/test_increment5a_main_qualification.py
          git diff --check

      - name: Commit tested migration and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-increment5a-attempt-bound-admission-v2.yml
          rm scripts/temp_increment5a_attempt_bound_admission.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f \
            newsroom/increment5/data/increment5a_owner_approval_attestation_v1.schema.json \
            newsroom/increment5/data/increment5a_main_qualification_record_v2.schema.json
          git commit -m "fix(increment5): bind admission to successful main attempts"
          git push origin HEAD:agent/increment-5a-retrieval-contract
