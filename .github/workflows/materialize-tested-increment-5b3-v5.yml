name: Materialize tested Increment 5B3 product checkpoint v5

on:
  push:
    branches:
      - support/publish-increment-5b3-v3-20260806
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-tested-increment-5b3-v5
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCT_SOURCE_BRANCH: support/materialize-increment-5b3-20260806
      EXPECTED_BASE: 7a4164f0a0b7c7c70cd68b2a5485110e7ca576f3
      STAGING_BRANCH: staging/increment-5b3-vector-replay-tested-20260806
      CHECKPOINT_BRANCH: checkpoint/increment-5b3-vector-replay-tested-20260806
      FOCUSED_LOG: /tmp/increment5b3-focused-v5.log
      FULL_LOG: /tmp/increment5b3-full-v5.log
      RECEIPT_PATH: /tmp/increment5b3-materialization-v5.json
    steps:
      - name: Check out the product source carrier in isolation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE_BRANCH }}
          fetch-depth: 0
          path: source

      - name: Check out the exact post-5B2 base in isolation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BASE }}
          fetch-depth: 0
          path: product

      - name: Apply reviewed corrections and copy only product bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("source")
          module = source / "newsroom/increment5/vector_retriever.py"
          text = module.read_text(encoding="utf-8")
          old_pattern = "[A-Za-z0-9._:-]{0,127}"
          new_pattern = r"[A-Za-z0-9._:\-]{0,127}"
          if old_pattern in text:
              text = text.replace(old_pattern, new_pattern, 1)
          elif new_pattern not in text:
              raise SystemExit("reviewed token-regex boundary is absent")
          module.write_text(text, encoding="utf-8")

          tests = source / "newsroom/tests/test_increment5b3_vector_retriever.py"
          test_text = tests.read_text(encoding="utf-8")
          disposable = '''    assert receipt.exclusions == (\n        pytest.helpers.anything\n        if hasattr(pytest, "helpers")\n        else receipt.exclusions\n    )\n'''
          if disposable in test_text:
              test_text = test_text.replace(disposable, "", 1)

          old_deterministic = '''    first = make_retriever(\n        tmp_path,\n        catalog,\n        view,\n        journal_name="first.sqlite",\n    ).retrieve(request)\n    second = make_retriever(\n        tmp_path,\n        catalog,\n        view,\n        journal_name="second.sqlite",\n    ).retrieve(request)\n'''
          new_deterministic = '''    first = make_retriever(\n        tmp_path,\n        catalog,\n        view,\n        journal_name="first.sqlite",\n        clock=lambda: 0,\n    ).retrieve(request)\n    second = make_retriever(\n        tmp_path,\n        catalog,\n        view,\n        journal_name="second.sqlite",\n        clock=lambda: 0,\n    ).retrieve(request)\n'''
          if old_deterministic in test_text:
              test_text = test_text.replace(
                  old_deterministic,
                  new_deterministic,
                  1,
              )
          elif new_deterministic not in test_text:
              raise SystemExit("reviewed deterministic-clock boundary is absent")
          tests.write_text(test_text, encoding="utf-8")

          product = Path("product")
          relative_paths = [
              Path("docs/operations/increment-5b3-vector-fixture-retriever.md"),
              Path("docs/traceability/increment-5b3-vector-fixture-retriever.md"),
              Path("newsroom/increment5/data/increment5b3_vector_fixture_v1.json"),
              Path("newsroom/increment5/vector_retriever.py"),
              Path("newsroom/tests/test_increment5b3_vector_retriever.py"),
          ]
          for relative in relative_paths:
              destination = product / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes((source / relative).read_bytes())
          PY
          python -m compileall -q \
            product/newsroom/increment5/vector_retriever.py \
            product/newsroom/tests/test_increment5b3_vector_retriever.py

      - name: Verify the locked base is still current
        shell: bash
        run: |
          set -euo pipefail
          cd product
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_BASE" ]]; then
            echo "isolated checkout is not the locked base" >&2
            exit 1
          fi
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_main" != "$EXPECTED_BASE" ]]; then
            echo "main moved: expected=$EXPECTED_BASE actual=$remote_main" >&2
            exit 1
          fi

      - name: Install the exact locked test environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run focused Increment 5B3 tests
        shell: bash
        run: |
          set -euo pipefail
          cd product
          uv sync --frozen
          uv run pytest -q newsroom/tests/test_increment5b3_vector_retriever.py \
            | tee "$FOCUSED_LOG"

      - name: Run the complete deterministic repository suite
        shell: bash
        run: |
          set -euo pipefail
          cd product
          uv run pytest -q | tee "$FULL_LOG"

      - name: Commit one product atom and push durable checkpoints
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "James To"
          git config user.email "105634418+fol2@users.noreply.github.com"
          git add \
            docs/operations/increment-5b3-vector-fixture-retriever.md \
            docs/traceability/increment-5b3-vector-fixture-retriever.md \
            newsroom/increment5/data/increment5b3_vector_fixture_v1.json \
            newsroom/increment5/vector_retriever.py \
            newsroom/tests/test_increment5b3_vector_retriever.py
          git diff --cached --check
          git commit -m "Increment 5B3: deterministic vector fixture replay retriever"
          python - <<'PY'
          import os
          import subprocess

          expected = [
              "docs/operations/increment-5b3-vector-fixture-retriever.md",
              "docs/traceability/increment-5b3-vector-fixture-retriever.md",
              "newsroom/increment5/data/increment5b3_vector_fixture_v1.json",
              "newsroom/increment5/vector_retriever.py",
              "newsroom/tests/test_increment5b3_vector_retriever.py",
          ]
          base = os.environ["EXPECTED_BASE"]
          count = subprocess.check_output(
              ["git", "rev-list", "--count", f"{base}..HEAD"],
              text=True,
          ).strip()
          actual = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"],
              text=True,
          ).splitlines()
          if count != "1":
              raise SystemExit(f"expected one product commit, got {count}")
          if actual != expected:
              raise SystemExit(
                  f"product inventory mismatch: expected={expected} actual={actual}"
              )
          PY
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          git push --force origin "HEAD:refs/heads/$CHECKPOINT_BRANCH"

      - name: Emit exact materialization receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def command(*args: str) -> str | None:
              try:
                  return subprocess.check_output(
                      args,
                      text=True,
                      cwd="product",
                  ).strip()
              except Exception:
                  return None

          def digest(path: str) -> str | None:
              candidate = Path(path)
              if not candidate.exists():
                  return None
              return "sha256:" + hashlib.sha256(candidate.read_bytes()).hexdigest()

          def summary(path: str) -> str | None:
              candidate = Path(path)
              if not candidate.exists():
                  return None
              lines = candidate.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).splitlines()
              return lines[-1] if lines else None

          payload = {
              "schema_version": "newsroom.increment5b3.materialization-receipt.v5",
              "expected_base": os.environ["EXPECTED_BASE"],
              "head": command("git", "rev-parse", "HEAD"),
              "tree": command("git", "rev-parse", "HEAD^{tree}"),
              "parent": command("git", "rev-parse", "HEAD^"),
              "staging_branch": os.environ["STAGING_BRANCH"],
              "checkpoint_branch": os.environ["CHECKPOINT_BRANCH"],
              "focused_log_digest": digest(os.environ["FOCUSED_LOG"]),
              "full_log_digest": digest(os.environ["FULL_LOG"]),
              "focused_summary": summary(os.environ["FOCUSED_LOG"]),
              "full_summary": summary(os.environ["FULL_LOG"]),
              "external_call_count": 0,
              "provider_call_count": 0,
              "model_call_count": 0,
              "embedding_call_count": 0,
              "provider_spend_micros": 0,
              "production_activation_authorized": False,
          }
          receipt = Path(os.environ["RECEIPT_PATH"])
          receipt.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          print(receipt.read_text(encoding="utf-8"))
          PY

      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5b3-materialization-v5-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/increment5b3-materialization-v5.json
            /tmp/increment5b3-focused-v5.log
            /tmp/increment5b3-full-v5.log
