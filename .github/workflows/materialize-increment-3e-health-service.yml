name: Materialize Increment 3E final hardening without workflow mutation

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-discovery-projection-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact Increment 3E branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3e-discovery-projection-health
          fetch-depth: 0
          show-progress: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false
      - name: Verify and apply exact complete Increment 3E product
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path

          transport_parent = 'baa2e2c0d9f8f904ff662a7b9b24545a6e3feb8f'
          transport_parent_tree = 'dff90f3dee703e8ff69b1090fd030945953e1d62'
          product_parent = '04135a922ec4218dcad877033e2d38892f2c00d8'
          product_parent_tree = '56a663442afcc0fa0ffc46f326fe492e9a917096'
          intermediate_tree = '876745cc708516fe8e43d0ecaf6af6ccc30d7685'
          final_tree = 'bd0ba7f234a74c6f2e5546f98901495995836f1d'
          nonworkflow_tree = 'cbd670cb9908d01b4a5f55306ef34f6d02ee0691'
          payload_dir = Path('.github/increment-3e-health-service-payload')
          hardening_path = Path('.github/increment-3e-post-health-hardening.patch.b64')
          final_hardening_path = Path('.github/increment-3e-final-hardening.patch.b64')
          workflow = '.github/workflows/materialize-increment-3e-health-service.yml'

          if subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() != transport_parent:
              raise SystemExit('Increment 3E final transport parent differs')
          if subprocess.check_output(['git', 'rev-parse', f'{transport_parent}^{{tree}}'], text=True).strip() != transport_parent_tree:
              raise SystemExit('Increment 3E final transport parent tree differs')
          if subprocess.check_output(['git', 'rev-parse', f'{product_parent}^{{tree}}'], text=True).strip() != product_parent_tree:
              raise SystemExit('Increment 3E product parent tree differs')
          changed = tuple(sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{transport_parent}..HEAD', '--'], text=True
          ).splitlines()))
          expected_changes = tuple(sorted((str(final_hardening_path), workflow)))
          if changed != expected_changes:
              raise SystemExit(f'Increment 3E final transport inventory differs: {changed!r}')

          payload_paths = tuple(sorted(str(path) for path in payload_dir.glob('part-*.txt')))
          if len(payload_paths) != 8:
              raise SystemExit('Increment 3E inherited health payload count differs')
          encoded = ''.join(Path(path).read_text(encoding='ascii').strip() for path in payload_paths)
          if len(encoded) != 23260:
              raise SystemExit('Increment 3E health base64 size differs')
          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != 17443 or hashlib.sha256(compressed).hexdigest() != 'a1f5c834806fa9dd5cb993fe1504551d07ad1cc70a2a2b8d389f2e13d9c13017':
              raise SystemExit('Increment 3E health compressed payload differs')
          patch = gzip.decompress(compressed)
          if len(patch) != 76573 or hashlib.sha256(patch).hexdigest() != 'db1a02258bc7e7ad2f6127c9676b4aec13a9ef1fc0e7237e16f450d76f02d33b':
              raise SystemExit('Increment 3E health patch differs')
          Path('/tmp/increment-3e-health-service.patch').write_bytes(patch)

          hardening_encoded = hardening_path.read_text(encoding='ascii').strip()
          if len(hardening_encoded) != 8048:
              raise SystemExit('Increment 3E hardening base64 size differs')
          hardening_compressed = base64.b64decode(hardening_encoded, validate=True)
          if len(hardening_compressed) != 6035 or hashlib.sha256(hardening_compressed).hexdigest() != '997e4cd67e15caf5341e27eb86ac81f08b00736b455af318ebc906fae585f58c':
              raise SystemExit('Increment 3E hardening compressed payload differs')
          hardening_patch = gzip.decompress(hardening_compressed)
          if len(hardening_patch) != 27739 or hashlib.sha256(hardening_patch).hexdigest() != 'cc31eb4a6ef897f39d7ed6f39b62116909d0a324d5e08b4a727ba335a53d8d0d':
              raise SystemExit('Increment 3E hardening patch differs')
          Path('/tmp/increment-3e-hardening.patch').write_bytes(hardening_patch)

          final_encoded = final_hardening_path.read_text(encoding='ascii').strip()
          if len(final_encoded) != 12828:
              raise SystemExit('Increment 3E final hardening base64 size differs')
          final_compressed = base64.b64decode(final_encoded, validate=True)
          if len(final_compressed) != 9621 or hashlib.sha256(final_compressed).hexdigest() != '5a899bf25ebaa02b4e183306f02a82f4cfdad2c8f12c9417561690db7ef208ef':
              raise SystemExit('Increment 3E final hardening compressed payload differs')
          final_patch = gzip.decompress(final_compressed)
          if len(final_patch) != 39852 or hashlib.sha256(final_patch).hexdigest() != 'f81fb1a22fb428e4ffc6953123bda01012bc3ca399b94f5db27fe41d856b5e8e':
              raise SystemExit('Increment 3E final hardening patch differs')
          Path('/tmp/increment-3e-final-hardening.patch').write_bytes(final_patch)
          Path('/tmp/increment-3e-intermediate-tree').write_text(intermediate_tree, encoding='ascii')
          Path('/tmp/increment-3e-final-tree').write_text(final_tree, encoding='ascii')
          Path('/tmp/increment-3e-nonworkflow-tree').write_text(nonworkflow_tree, encoding='ascii')
          PY
          git apply --check /tmp/increment-3e-health-service.patch
          git apply /tmp/increment-3e-health-service.patch
          git apply --check /tmp/increment-3e-hardening.patch
          git apply /tmp/increment-3e-hardening.patch
          rm -rf .github/increment-3e-health-service-payload
          rm -f .github/increment-3e-post-health-hardening.patch.b64
          rm -f .github/increment-3e-final-hardening.patch.b64
          rm -f .github/workflows/materialize-increment-3e-health-service.yml
          git add -A
          test "$(git write-tree)" = "$(cat /tmp/increment-3e-intermediate-tree)"
          git reset
          git apply --check /tmp/increment-3e-final-hardening.patch
          git apply /tmp/increment-3e-final-hardening.patch
          python -m compileall -q newsroom scripts
          git diff --check
          git add -A
          test "$(git write-tree)" = "$(cat /tmp/increment-3e-final-tree)"
          git reset
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_projection_3e_*.py \
            newsroom/tests/test_projection_b2_contracts.py \
            newsroom/tests/test_sdlc_classifier.py \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression
      - name: Commit verified non-workflow Increment 3E product
        shell: bash
        run: |
          set -euo pipefail
          git show 65ba31c403c84b9fbe82243912fd57612c097735:.github/workflows/projection-b2-neo4j.yml > .github/workflows/projection-b2-neo4j.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$(cat /tmp/increment-3e-nonworkflow-tree)"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(projection): complete Increment 3E product except permanent workflow'
          git push origin HEAD:agent/increment-3e-discovery-projection-health
