name: agent-increment2c-final-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2c-final-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: b8ef93a57a0c7937b182c2bab75328106aa2ca0f
      TARGET_BRANCH: agent/increment-2c-bounded-hybrid-retrieval
      EXPECTED_BASE_TREE: aab49e99c329093dd6ee34a8eaea309a6978bd32
      PATCH_SHA256: 609b8e7a482ba6634c2b104d9fbe7d0a89a37bb4061ceb1cdf801f09053620da
      EXPECTED_TREE: 9e5586256cef57a40e3f62886e0d24d507402bd4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct verified final delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/increment2c-final/READY)" = "$PATCH_SHA256"
          test "$(find .github/increment2c-final -maxdepth 1 -type f -name 'payload.part-*' | wc -l)" -eq 11
          cat .github/increment2c-final/payload.part-* \
            | base64 --decode > /tmp/increment2c-final.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2c-final.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2c-final.patch.gz \
            > /tmp/increment2c-final.patch

      - name: Apply exact final correction
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_BASE_TREE"
          git apply --check /tmp/increment2c-final.patch
          git apply --index /tmp/increment2c-final.patch
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/projection-b2-neo4j.yml
          docs/README.md
          docs/operations/increment-2c-bounded-hybrid-retrieval.md
          docs/research/2026-07-26-increment-2c-substantive-review.md
          newsroom/authority/_retrieval_store.py
          newsroom/authority/_retrieval_system.py
          newsroom/projection/neo4j/_adapter.py
          newsroom/projection/neo4j/_retrieval_adapter.py
          newsroom/retrieval/__init__.py
          newsroom/retrieval/fixture_v2.py
          newsroom/retrieval/fusion.py
          newsroom/retrieval/models.py
          newsroom/retrieval/traceability.py
          newsroom/tests/retrieval_2c_helpers.py
          newsroom/tests/test_integrated_c1_sdlc_contract.py
          newsroom/tests/test_retrieval_2c_adapter_unit.py
          newsroom/tests/test_retrieval_2c_authority.py
          newsroom/tests/test_retrieval_2c_contracts.py
          newsroom/tests/test_retrieval_2c_fusion.py
          newsroom/tests/test_retrieval_2c_neo4j_service.py
          newsroom/tests/test_retrieval_2c_traceability.py
          newsroom/tests/test_sdlc_classifier.py
          newsroom/tests/test_sdlc_watchdog.py
          newsroom/tests/test_sdlc_workflow_lane.py
          newsroom/tests/test_subprocess_json.py
          scripts/sdlc/workflow_lane.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          python -m compileall -q newsroom scripts
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked focused final gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_retrieval_2c_contracts.py \
            newsroom/tests/test_retrieval_2c_fusion.py \
            newsroom/tests/test_retrieval_2c_adapter_unit.py \
            newsroom/tests/test_retrieval_2c_authority.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_retrieval_2c_traceability.py \
            newsroom/tests/test_sdlc_watchdog.py \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_subprocess_json.py
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Create and push clean final commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2C Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(retrieval): close Increment 2C review findings' \
            'Complete bounded retrieval authority, temporal and freshness guards, authenticated actual-Neo4j evidence, live compatibility revalidation, deterministic SDLC evidence and current-head review records.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
