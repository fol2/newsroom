name: Materialize Increment 3D command contracts

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3d-signal-lead-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 3D branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3d-signal-lead-authority
          fetch-depth: 0
          show-progress: false

      - name: Verify and apply exact command-contract patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path
          import subprocess

          expected_parent = '6718f8ca7fe28afdf44fcdccf81de5da57312d11'
          parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^'], text=True
          ).strip()
          if parent != expected_parent:
              raise SystemExit(
                  f'staging parent {parent} differs from {expected_parent}'
              )

          payload_root = Path('.github/increment-3d-command-contracts-payload')
          expected = tuple(
              payload_root / f'part-{index:02d}.b64'
              for index in range(3)
          )
          actual = tuple(sorted(payload_root.glob('part-*.b64')))
          if actual != expected:
              raise SystemExit('command-contract chunk inventory differs')
          expected_hashes = (
              '2eb6423e70d0585df0f18d8d718826a1cde6f40593e6258361f6849ca40f074a',
              '8a6c855157cfa46f64091f6aff3d0809db400fb53f300921e8f79e9cd7256ef0',
              'adb17aee2d1841dcc7b51e8bb4e23212eff4525fa6b35efd5a0d64cbbf2969cb',
          )
          for path, expected_hash in zip(expected, expected_hashes, strict=True):
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit(f'command-contract chunk digest differs: {path.name}')
          encoded = b''.join(path.read_bytes() for path in expected)
          if len(encoded) != 11800:
              raise SystemExit('command-contract base64 size differs')
          if hashlib.sha256(encoded).hexdigest() != (
              'ffece09f1be88b743251f156ff9ef13f9f05fd43061fd478f508a143c665d60f'
          ):
              raise SystemExit('command-contract base64 digest differs')
          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != 8849:
              raise SystemExit('command-contract gzip size differs')
          if hashlib.sha256(compressed).hexdigest() != (
              '0d7fd300ef7b7a8e19069dd3f765206afbdb55ef6733d1aa6308fdbadb0b17e9'
          ):
              raise SystemExit('command-contract gzip digest differs')
          patch = gzip.decompress(compressed)
          if len(patch) != 53191:
              raise SystemExit('command-contract patch size differs')
          if hashlib.sha256(patch).hexdigest() != (
              'eb42c5a8ab233a3bdb65df78a6c9ea0a96e7db9b983bcf1c51b6435fc20ce001'
          ):
              raise SystemExit('command-contract patch digest differs')
          Path('/tmp/increment-3d-command-contracts.patch').write_bytes(patch)
          PY
          git apply --check /tmp/increment-3d-command-contracts.patch
          git apply /tmp/increment-3d-command-contracts.patch
          rm -rf \
            .github/increment-3d-command-contracts-payload \
            .github/workflows/materialize-increment-3d-command-contracts.yml
          python -m compileall -q newsroom/discovery newsroom/tests
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused discovery contract suites
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_3d_contracts.py \
            newsroom/tests/test_discovery_3d_payloads.py \
            newsroom/tests/test_discovery_3d_policy.py

      - name: Commit verified clean command contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(discovery): add governed command contracts'
          git push origin HEAD:agent/increment-3d-signal-lead-authority
