name: agent-increment2b-sdlc-profile-export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Upload exact Increment 2B source tree
        uses: actions/upload-artifact@v4
        with:
          name: increment2b-sdlc-profile-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
