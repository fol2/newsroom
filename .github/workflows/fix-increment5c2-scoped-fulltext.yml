name: Fix exact Increment 5C2 scoped full-text retrieval

on:
  push:
    branches: [support/fix-increment5c2-scoped-fulltext-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-exact-increment5c2-scoped-fulltext
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/fix-increment5c2-scoped-fulltext-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Apply, verify and publish exact repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/support/publish_increment5c2_scoped_fulltext.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5c2-scoped-fulltext-repair-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5c2-scoped-fulltext-focused.log
            /tmp/increment5c2-scoped-fulltext-full.log
            /tmp/increment5c2-scoped-fulltext-clustering.log
            /tmp/increment5c2-scoped-fulltext-receipt.json
