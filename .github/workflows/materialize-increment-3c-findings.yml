name: Materialize Increment 3C operational findings

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Verify and materialize exact Finding payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile
          import tempfile

          root = Path.cwd()
          archive_path = root / '.github/increment-3c-findings-payload.tar.gz'
          manifest = json.loads(
              (root / '.github/increment-3c-findings-manifest.json').read_text()
          )
          archive = archive_path.read_bytes()
          if len(archive) != manifest['archive_size']:
              raise SystemExit('Finding payload archive size differs from manifest')
          if hashlib.sha256(archive).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('Finding payload archive digest differs from manifest')
          expected_paths = tuple(manifest['paths'])
          if len(expected_paths) != len(set(expected_paths)):
              raise SystemExit('Finding manifest contains duplicate paths')

          with tempfile.TemporaryDirectory() as temporary:
              staging = Path(temporary)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
                  members = tar.getmembers()
                  names = tuple(member.name for member in members)
                  if names != tuple(sorted(expected_paths)):
                      raise SystemExit('Finding archive inventory differs from manifest')
                  for member in members:
                      path = PurePosixPath(member.name)
                      if (
                          path.is_absolute()
                          or '..' in path.parts
                          or not member.isfile()
                          or member.issym()
                          or member.islnk()
                      ):
                          raise SystemExit(f'unsafe Finding archive member: {member.name}')
                      target = staging.joinpath(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = tar.extractfile(member)
                      if source is None:
                          raise SystemExit(f'Finding member has no bytes: {member.name}')
                      target.write_bytes(source.read())
              for relative in expected_paths:
                  source = staging / relative
                  digest = hashlib.sha256(source.read_bytes()).hexdigest()
                  if digest != manifest['file_sha256'][relative]:
                      raise SystemExit(f'Finding file digest differs for {relative}')
                  target = root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          PY
          python -m compileall -q newsroom/authority newsroom/checks newsroom/tests
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused Finding and retained authority suites
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_contracts.py \
            newsroom/tests/test_check_3c_baselines.py \
            newsroom/tests/test_check_3c_transitions.py \
            newsroom/tests/test_check_3c_agenda.py \
            newsroom/tests/test_check_3c_findings.py \
            newsroom/tests/test_check_3c_traceability.py \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_check_3c_authority_store.py \
            newsroom/tests/test_check_3c_authority_integrity.py \
            newsroom/tests/test_check_3c_admission.py

      - name: Commit verified clean Finding authority
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/increment-3c-findings-payload.tar.gz \
            .github/increment-3c-findings-manifest.json \
            .github/workflows/materialize-increment-3c-findings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            newsroom/authority/_check_admission_lookup.py \
            newsroom/authority/_proposal_admission.py \
            newsroom/authority/_proposal_admission_commit.py \
            newsroom/authority/_proposal_admission_findings.py \
            newsroom/authority/_proposal_admission_models.py \
            newsroom/checks/admission_models.py \
            newsroom/tests/test_check_3c_admission.py \
            .github/increment-3c-findings-payload.tar.gz \
            .github/increment-3c-findings-manifest.json \
            .github/workflows/materialize-increment-3c-findings.yml
          git diff --cached --check
          git commit -m 'feat(checks): create operational findings from proposals'
          git push origin HEAD:agent/increment-3c-check-transition-authority
