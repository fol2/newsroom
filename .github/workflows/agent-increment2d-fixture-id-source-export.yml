name: agent-increment2d-fixture-id-source-export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Increment 2D source tree
        uses: actions/upload-artifact@v4
        with:
          name: increment2d-fixture-id-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
