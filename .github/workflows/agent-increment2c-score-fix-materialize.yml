name: agent-increment2c-score-fix-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2c-score-fix-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: ea1f49f1a3b4c2aafac1d28ed45627558751fcb2
      TARGET_BRANCH: agent/increment-2c-bounded-hybrid-retrieval
      EXPECTED_BASE_TREE: 71438225831367226fa0f7604ac1ce8697c6d4b9
      PATCH_SHA256: 44c987f48c3ef2ae262170477ca09c3e86151ed19cc863bff3e038f8069d21df
      EXPECTED_TREE: 326604b9daf20a17f393561ae363b0c07265d38c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct exact score correction
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/increment2c-score-fix/fix.patch.gz.b64 \
            > /tmp/increment2c-score-fix.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2c-score-fix.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2c-score-fix.patch.gz \
            > /tmp/increment2c-score-fix.patch

      - name: Apply exact six-file correction
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_BASE_TREE"
          git apply --check /tmp/increment2c-score-fix.patch
          git apply --index /tmp/increment2c-score-fix.patch
          cat > /tmp/expected-paths <<'EOF'
          docs/operations/increment-2c-bounded-hybrid-retrieval.md
          docs/research/2026-07-26-increment-2c-substantive-review.md
          newsroom/retrieval/models.py
          newsroom/tests/test_retrieval_2c_contracts.py
          newsroom/tests/test_retrieval_2c_neo4j_service.py
          newsroom/tests/test_retrieval_2c_traceability.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          python -m compileall -q newsroom scripts
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked affected gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_retrieval_2c_contracts.py \
            newsroom/tests/test_retrieval_2c_fusion.py \
            newsroom/tests/test_retrieval_2c_adapter_unit.py \
            newsroom/tests/test_retrieval_2c_authority.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_retrieval_2c_traceability.py \
            newsroom/tests/test_retrieval_2c_neo4j_service.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py \
            newsroom/tests/test_sdlc_classifier.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Create and push clean score-fix commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2C Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(retrieval): canonicalize live Neo4j scores' \
            'Permit the full fixed-notation shape emitted by Python .17g for finite binary64 scores while retaining exact parse/reserialize canonicality; restore substantive service tests and record the seventeenth corrected review finding.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
