name: Increment 5A cache-free validator replacement builder

on:
  pull_request:
    branches:
      - agent/increment-5a-retrieval-contract

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: staging/increment-5a-scope-expand-20260803
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Materialize cache-free exact-tree validator
        run: python scripts/sdlc/_staging_increment5_materialize_cache_free_validator.py

      - name: Verify exact generated path set
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              "docs/decisions/2026-08-02-increment-5a-production-retrieval-contract.md",
              "docs/evaluation/2026-08-02-increment-5-retrieval-evaluation-plan-v1.md",
              "docs/operations/increment-5-production-retrieval-contract.md",
              "increment5a-cache-free-validator-manifest.json",
              "newsroom/tests/test_increment5a_profile_semantic_envelope.py",
              "scripts/sdlc/increment5_profile_validator.py",
          }
          tracked = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True,
              ).splitlines()
          )
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit(
                  f"generated path set differs: missing={sorted(expected-actual)}, "
                  f"extra={sorted(actual-expected)}"
              )
          for path in actual:
              if not Path(path).is_file():
                  raise SystemExit(f"generated path is not a regular file: {path}")
          PY

      - name: Build helper-free one-commit candidate
        env:
          BASE: 3ea1874de5e1bd6c622a3760eabb74adfe75d169
          SOURCE_HEAD: 2e705938f61ba687b0c4db9f6f9aadef178d1b50
        run: |
          cp increment5a-cache-free-validator-manifest.json \
            "$RUNNER_TEMP/increment5a-cache-free-validator-manifest.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git read-tree "$SOURCE_HEAD"
          git add \
            docs/decisions/2026-08-02-increment-5a-production-retrieval-contract.md \
            docs/evaluation/2026-08-02-increment-5-retrieval-evaluation-plan-v1.md \
            docs/operations/increment-5-production-retrieval-contract.md \
            newsroom/tests/test_increment5a_profile_semantic_envelope.py \
            scripts/sdlc/increment5_profile_validator.py
          candidate_tree="$(git write-tree)"
          candidate_commit="$(printf '%s\n' 'feat(increment5): finalize production retrieval contract' | git commit-tree "$candidate_tree" -p "$BASE")"
          git checkout --detach --force "$candidate_commit"
          git clean -ffd
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE..HEAD")" = "1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$BASE" HEAD
          echo "CANDIDATE_COMMIT=$candidate_commit" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$candidate_tree" >> "$GITHUB_ENV"

      - name: Verify locked environment
        run: |
          uv lock --check
          uv sync --dev --locked

      - name: Focused Increment 5A verification
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_increment5a_contract.py \
            newsroom/tests/test_increment5a_evaluation_plan.py \
            newsroom/tests/test_increment5a_package_neutrality.py \
            newsroom/tests/test_increment5a_profiles.py \
            newsroom/tests/test_increment5a_profile_semantic_envelope.py \
            newsroom/tests/test_increment5a_traceability.py

      - name: Full deterministic verification
        run: uv run python -m pytest -q

      - name: Source integrity and replacement manifest
        env:
          BASE: 3ea1874de5e1bd6c622a3760eabb74adfe75d169
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$BASE" HEAD
          cat "$RUNNER_TEMP/increment5a-cache-free-validator-manifest.json"

      - name: Publish verified helper-free candidate
        run: |
          git push --force origin \
            "$CANDIDATE_COMMIT:refs/heads/staging/increment-5a-scope-expand-20260803"
