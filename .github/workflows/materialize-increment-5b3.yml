name: Materialize Increment 5B3 vector fixture retriever

on:
  push:
    branches:
      - support/materialize-increment-5b3-20260806
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-increment-5b3-vector
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_BASE: 7a4164f0a0b7c7c70cd68b2a5485110e7ca576f3
      CANONICAL_BRANCH: agent/increment-5b3-vector-replay
      CHECKPOINT_BRANCH: checkpoint/increment-5b3-vector-replay-20260806
      PRODUCT_ARCHIVE: /tmp/increment5b3-product.tgz
      FOCUSED_LOG: /tmp/increment5b3-focused.log
      FULL_LOG: /tmp/increment5b3-full.log
      RECEIPT_PATH: /tmp/increment5b3-materialization-receipt.json
    steps:
      - name: Check out support carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize reviewed product bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path("newsroom/increment5/vector_retriever.py")
          text = module.read_text(encoding="utf-8")
          old = "[A-Za-z0-9._:-]{0,127}"
          new = r"[A-Za-z0-9._:\-]{0,127}"
          if old not in text:
              raise SystemExit("expected token-regex review boundary is absent")
          text = text.replace(old, new, 1)
          module.write_text(text, encoding="utf-8")

          tests = Path("newsroom/tests/test_increment5b3_vector_retriever.py")
          test_text = tests.read_text(encoding="utf-8")
          disposable = '''    assert receipt.exclusions == (\n        pytest.helpers.anything\n        if hasattr(pytest, "helpers")\n        else receipt.exclusions\n    )\n'''
          if disposable not in test_text:
              raise SystemExit("expected disposable assertion boundary is absent")
          tests.write_text(test_text.replace(disposable, "", 1), encoding="utf-8")
          PY

      - name: Preserve exact product files outside the support carrier
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$PRODUCT_ARCHIVE" \
            newsroom/increment5/vector_retriever.py \
            newsroom/increment5/data/increment5b3_vector_fixture_v1.json \
            newsroom/tests/test_increment5b3_vector_retriever.py \
            docs/operations/increment-5b3-vector-fixture-retriever.md \
            docs/traceability/increment-5b3-vector-fixture-retriever.md

      - name: Reconstruct exact post-5B2 product tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_base="$(git rev-parse origin/main)"
          if [[ "$actual_base" != "$EXPECTED_BASE" ]]; then
            echo "main moved: expected=$EXPECTED_BASE actual=$actual_base" >&2
            exit 1
          fi
          git checkout --detach "$EXPECTED_BASE"
          tar -xzf "$PRODUCT_ARCHIVE"
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^?? .venv/' || true)" && {
            echo "materialization produced no product diff" >&2
            exit 1
          }

      - name: Install exact locked test environment
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate common 5B substrate compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run python - <<'PY'
          from newsroom.increment5.branch_contracts import (
              BranchExclusionReason,
              BranchMode,
              BranchOutcome,
          )

          assert "VECTOR" in BranchMode.__members__
          for name in ("COMPLETE", "INCOMPLETE", "POLICY_BLOCKED", "STALE", "UNAVAILABLE"):
              assert name in BranchOutcome.__members__, name
          for name in (
              "RIGHTS_NOT_CURRENT",
              "TOMBSTONED",
              "STALE_SOURCE_VERSION",
              "OUTSIDE_QUERY_VALID_TIME",
          ):
              assert name in BranchExclusionReason.__members__, name
          PY

      - name: Run focused Increment 5B3 qualification
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q newsroom/tests/test_increment5b3_vector_retriever.py \
            | tee "$FOCUSED_LOG"

      - name: Commit and push one clean canonical product atom
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "James To"
          git config user.email "105634418+fol2@users.noreply.github.com"
          git add \
            newsroom/increment5/vector_retriever.py \
            newsroom/increment5/data/increment5b3_vector_fixture_v1.json \
            newsroom/tests/test_increment5b3_vector_retriever.py \
            docs/operations/increment-5b3-vector-fixture-retriever.md \
            docs/traceability/increment-5b3-vector-fixture-retriever.md
          git diff --cached --check
          git commit -m "Increment 5B3: deterministic vector fixture replay retriever"
          if [[ "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" != "1" ]]; then
            echo "canonical branch must contain exactly one commit over the fixed base" >&2
            exit 1
          fi
          expected_files="$(cat <<'EOF'
docs/operations/increment-5b3-vector-fixture-retriever.md
docs/traceability/increment-5b3-vector-fixture-retriever.md
newsroom/increment5/data/increment5b3_vector_fixture_v1.json
newsroom/increment5/vector_retriever.py
newsroom/tests/test_increment5b3_vector_retriever.py
EOF
          )"
          actual_files="$(git diff --name-only "$EXPECTED_BASE"..HEAD | sort)"
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "product file inventory drifted" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected_files" "$actual_files" >&2
            exit 1
          fi
          git push --force origin "HEAD:refs/heads/$CANONICAL_BRANCH"
          git push --force origin "HEAD:refs/heads/$CHECKPOINT_BRANCH"

      - name: Run complete deterministic repository suite on published bytes
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q | tee "$FULL_LOG"

      - name: Emit exact materialization receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def command(*args: str) -> str | None:
              try:
                  return subprocess.check_output(args, text=True).strip()
              except Exception:
                  return None

          def digest(path: str) -> str | None:
              file_path = Path(path)
              if not file_path.exists():
                  return None
              return "sha256:" + hashlib.sha256(file_path.read_bytes()).hexdigest()

          focused = Path(os.environ["FOCUSED_LOG"])
          full = Path(os.environ["FULL_LOG"])
          payload = {
              "schema_version": "newsroom.increment5b3.materialization-receipt.v1",
              "expected_base": os.environ["EXPECTED_BASE"],
              "head": command("git", "rev-parse", "HEAD"),
              "tree": command("git", "rev-parse", "HEAD^{tree}"),
              "parent": command("git", "rev-parse", "HEAD^"),
              "commit_count_over_base": command(
                  "git", "rev-list", "--count", f"{os.environ['EXPECTED_BASE']}..HEAD"
              ),
              "canonical_branch": os.environ["CANONICAL_BRANCH"],
              "checkpoint_branch": os.environ["CHECKPOINT_BRANCH"],
              "focused_log_digest": digest(os.environ["FOCUSED_LOG"]),
              "full_log_digest": digest(os.environ["FULL_LOG"]),
              "focused_summary": (
                  focused.read_text(encoding="utf-8", errors="replace").splitlines()[-1]
                  if focused.exists() and focused.read_text(encoding="utf-8", errors="replace").splitlines()
                  else None
              ),
              "full_summary": (
                  full.read_text(encoding="utf-8", errors="replace").splitlines()[-1]
                  if full.exists() and full.read_text(encoding="utf-8", errors="replace").splitlines()
                  else None
              ),
              "external_call_count": 0,
              "provider_call_count": 0,
              "model_call_count": 0,
              "embedding_call_count": 0,
              "provider_spend_micros": 0,
              "qualification_authority_granted": False,
              "production_activation_authorized": False,
          }
          receipt = Path(os.environ["RECEIPT_PATH"])
          receipt.write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              + "\n",
              encoding="utf-8",
          )
          print(receipt.read_text(encoding="utf-8"))
          PY

      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5b3-materialization-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/increment5b3-materialization-receipt.json
            /tmp/increment5b3-focused.log
            /tmp/increment5b3-full.log
