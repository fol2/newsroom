name: Publish verified Increment 5C2 authority tools v2

on:
  push:
    branches: [support/publish-increment5c2-authority-tools-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-verified-increment5c2-authority-tools-v2
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/publish-increment5c2-authority-tools-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Verify and publish exact authority-tools atom
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.support.publish_increment5c2_authority_tools_v3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5c2-authority-tools-v2-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5c2-authority-tools-focused.log
            /tmp/increment5c2-authority-tools-full.log
            /tmp/increment5c2-authority-tools-receipt.json
