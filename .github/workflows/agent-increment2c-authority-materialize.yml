name: agent-increment2c-authority-materialize

on:
  push:
    branches:
      - agent/increment-2c-authority-materialize
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2c-authority-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: 2635318aa2dd87031eab5721ea90537438e1da3c
      TARGET_BRANCH: agent/increment-2c-bounded-hybrid-retrieval
      ARCHIVE_SHA256: 34dcac8231b3fedda86d403f62981ed98cde7aea9a0f2ed983b25a5841a838e1
      EXPECTED_TREE: 2bfe9772e7087aff9cec30d059bf59cf178fd1a8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct and verify authority archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/increment2c-authority/READY)" = "$ARCHIVE_SHA256"
          cat .github/increment2c-authority/part-* \
            | base64 --decode > /tmp/increment2c-authority.tar.gz
          echo "$ARCHIVE_SHA256  /tmp/increment2c-authority.tar.gz" \
            | sha256sum --check -
          cat > /tmp/expected-paths <<'EOF'
          newsroom/authority/_retrieval_security.py
          newsroom/authority/_retrieval_store.py
          newsroom/authority/_retrieval_system.py
          newsroom/authority/migrations.py
          newsroom/authority/retrieval_migrations.py
          newsroom/authority/retrieval_system.py
          newsroom/projection/neo4j/_retrieval_adapter.py
          newsroom/retrieval/__init__.py
          newsroom/retrieval/fixture_v2.py
          newsroom/retrieval/models.py
          newsroom/tests/retrieval_2c_helpers.py
          newsroom/tests/test_complete_projection_2b_migrations.py
          newsroom/tests/test_projection_b1_migrations.py
          newsroom/tests/test_relation_2a_contracts.py
          newsroom/tests/test_retrieval_2c_authority.py
          newsroom/tests/test_retrieval_2c_contracts.py
          newsroom/tests/test_retrieval_2c_migrations.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          tar -tzf /tmp/increment2c-authority.tar.gz | sort > /tmp/archive-paths
          diff -u /tmp/expected-paths /tmp/archive-paths
          python - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          with tarfile.open('/tmp/increment2c-authority.tar.gz', 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or '..' in path.parts
                      or member.issym()
                      or member.islnk()
                      or not member.isfile()
                  ):
                      raise SystemExit(f'unsafe archive member: {member.name!r}')
          PY

      - name: Apply exact authority checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$AUTHORISED_PARENT"
          git checkout --detach "$AUTHORISED_PARENT"
          tar -xzf /tmp/increment2c-authority.tar.gz -C .
          rm -rf .github/increment2c-authority
          rm -f .github/workflows/agent-increment2c-authority-materialize.yml
          git add -A
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          python -m compileall -q newsroom scripts
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked focused authority gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_retrieval_2c_contracts.py \
            newsroom/tests/test_retrieval_2c_fusion.py \
            newsroom/tests/test_retrieval_2c_adapter_unit.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_retrieval_2c_authority.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_projection_b1_migrations.py \
            newsroom/tests/test_relation_2a_contracts.py

      - name: Create and push clean authority checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2C Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'feat(retrieval): retain authoritative context v2' \
            'Add checked SQLite schema v8, single-writer retrieval authority, authenticated ACTIVE-generation reads, governed exact-passage hydration, durable idempotent Retrieval Context v2 records, lifecycle-safe replay, startup integrity and adversarial authority tests.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
