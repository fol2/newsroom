name: Materialize Increment 3E lifecycle and serving v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-discovery-projection-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3e-discovery-projection-health
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false
      - name: Verify and apply exact 3E serving and cycle correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, gzip, hashlib, subprocess
          from pathlib import Path

          parent = 'b7a7e7bac317c9369c06cb38d3d0182fc72db12e'
          parent_tree = '3c7e17033903ebbde1fcca7cc31e108593a6d131'
          expected_tree = '269e7c656bbe4a3b9d64f2b8dd37b58a1274d9fc'
          payload_dir = Path('.github/increment-3e-serving-payload')
          fix_path = Path('.github/increment-3e-serving-cycle-fix.patch.b64')
          workflow = '.github/workflows/materialize-increment-3e-serving.yml'

          if subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() != parent:
              raise SystemExit('3E serving v2 parent differs')
          if subprocess.check_output(['git','rev-parse',f'{parent}^{{tree}}'], text=True).strip() != parent_tree:
              raise SystemExit('3E serving v2 parent tree differs')
          changed = tuple(sorted(subprocess.check_output(
              ['git','diff','--name-only',f'{parent}..HEAD','--'], text=True
          ).splitlines()))
          if changed != tuple(sorted((str(fix_path), workflow))):
              raise SystemExit(f'3E serving v2 transport inventory differs: {changed!r}')

          payload_paths = tuple(sorted(str(p) for p in payload_dir.glob('part-*.txt')))
          if len(payload_paths) != 6:
              raise SystemExit('3E serving v2 inherited payload count differs')
          encoded = ''.join(Path(p).read_text(encoding='ascii').strip() for p in payload_paths)
          if len(encoded) != 16680:
              raise SystemExit('3E serving base64 size differs')
          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != 12510 or hashlib.sha256(compressed).hexdigest() != '9effe43105940bb114b3b9fd48d11846b8cf5b32670bad793b4eadc316a08eaa':
              raise SystemExit('3E serving compressed payload differs')
          patch = gzip.decompress(compressed)
          if len(patch) != 66047 or hashlib.sha256(patch).hexdigest() != '5b0917d4dda8f21659533df96fd95ac68ce25e37b2eaa461756c63bed5c95745':
              raise SystemExit('3E serving patch differs')
          Path('/tmp/increment-3e-serving.patch').write_bytes(patch)

          fix_encoded = fix_path.read_text(encoding='ascii').strip()
          if len(fix_encoded) != 672:
              raise SystemExit('3E cycle fix base64 size differs')
          fix_compressed = base64.b64decode(fix_encoded, validate=True)
          if len(fix_compressed) != 502 or hashlib.sha256(fix_compressed).hexdigest() != '9aa7519e533906987a85fbbd792814bc1e568af23bf8c183c8bf5da99c820850':
              raise SystemExit('3E cycle fix compressed payload differs')
          fix_patch = gzip.decompress(fix_compressed)
          if len(fix_patch) != 1148 or hashlib.sha256(fix_patch).hexdigest() != '096ce99f3e351724c63b2568d53a8ccf536fafa4dcba477217e86b543993ddd9':
              raise SystemExit('3E cycle fix patch differs')
          Path('/tmp/increment-3e-cycle-fix.patch').write_bytes(fix_patch)
          Path('/tmp/increment-3e-serving-tree').write_text(expected_tree, encoding='ascii')
          PY
          git apply --check /tmp/increment-3e-serving.patch
          git apply /tmp/increment-3e-serving.patch
          git apply --check /tmp/increment-3e-cycle-fix.patch
          git apply /tmp/increment-3e-cycle-fix.patch
          rm -rf .github/increment-3e-serving-payload
          rm -f .github/increment-3e-serving-cycle-fix.patch.b64
          rm -f .github/workflows/materialize-increment-3e-serving.yml
          python -m compileall -q newsroom scripts
          git diff --check
      - name: Install locked environment
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
      - name: Run focused and complete regressions
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_projection_3e_*.py \
            newsroom/tests/test_projection_b1_*.py \
            newsroom/tests/test_projection_b2_*.py \
            newsroom/tests/test_projection_b3_*.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression
      - name: Commit verified 3E lifecycle and serving
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$(cat /tmp/increment-3e-serving-tree)"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(projection): add 3E lifecycle and bounded serving'
          git push origin HEAD:agent/increment-3e-discovery-projection-health
