name: Fix exact Increment 5C1 receipt scalar types

on:
  push:
    branches: [support/fix-increment5c1-receipt-types-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-exact-increment5c1-receipt-types
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/fix-increment5c1-receipt-types-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Patch, commit locally, verify and publish exact 5C1 repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/support/fix_increment5c1_receipt_types.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5c1-receipt-types-repair-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5c1-receipt-types-focused.log
            /tmp/increment5c1-receipt-types-full.log
            /tmp/increment5c1-receipt-types-receipt.txt
