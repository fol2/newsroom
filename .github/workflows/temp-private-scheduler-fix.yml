name: Temporary private scheduler fix

on:
  push:
    branches:
      - agent/sdlc-core-worksteal-scheduler
    paths:
      - .github/workflows/temp-private-scheduler-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/sdlc-core-worksteal-scheduler
          fetch-depth: 0

      - name: Patch exact private scheduler defaults
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sdlc/_workflow_lane_impl.py")
          source = path.read_text(encoding="utf-8")
          old = '_CORE_WORKER_COUNT = 8\n_CORE_DISTRIBUTION = "loadfile"\n'
          new = '_CORE_WORKER_COUNT = 4\n_CORE_DISTRIBUTION = "worksteal"\n'
          if source.count(old) != 1:
              raise SystemExit("expected exactly one stale private scheduler block")
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
          python -m compileall -q scripts/sdlc/_workflow_lane_impl.py
          git diff --check

      - name: Commit clean fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-private-scheduler-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sdlc/_workflow_lane_impl.py .github/workflows/temp-private-scheduler-fix.yml
          git commit -m "fix(sdlc): align private scheduler defaults"
          git push origin HEAD:agent/sdlc-core-worksteal-scheduler
