name: agent-increment2b-optional-service-manifest-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      AUTHORISED_PARENT: 64c4500e449826a04e0e3d63e13bc573eaada6d6
      TARGET_BRANCH: agent/increment-2b-fulltext-vector-projection
      PATCH_SHA256: d3c33154a4487f2a3c6ff452a6a72fa35b8a9c7a4ff241f5c09ad2794c92be0f
      EXPECTED_TREE: 2ff1de5e88d403c50f01b20bfc07474dba7e42cd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reconstruct verified optional-service manifest patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/increment2b-optional-core/fix.patch.gz.b64 \
            > /tmp/increment2b-optional-core.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2b-optional-core.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2b-optional-core.patch.gz \
            > /tmp/increment2b-optional-core.patch

      - name: Apply correction to exact authorised parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          git apply --check /tmp/increment2b-optional-core.patch
          git apply /tmp/increment2b-optional-core.patch
          rm -rf .github/increment2b-optional-core
          rm -f .github/workflows/agent-increment2b-optional-service-manifest-materialize.yml
          git add -A

      - name: Verify exact correction boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-paths <<'EOF'
          docs/operations/increment-2b-complete-projection.md
          docs/research/2026-07-25-increment-2b-substantive-review.md
          newsroom/tests/test_complete_projection_2b_traceability.py
          newsroom/tests/test_integrated_c1_sdlc_contract.py
          newsroom/tests/test_sdlc_workflow_lane.py
          scripts/sdlc/workflow_lane.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          python -m compileall -q newsroom scripts
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Create and push exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2B Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(sdlc): classify complete service skips correctly' \
            'Declare the exact eight complete Neo4j cases optional only in the deterministic no-service lane, keep their service-file selection and no-skip proof mandatory, and record the ninth resolved Increment 2B review finding.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
