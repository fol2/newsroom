name: agent-increment2c-contracts-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2c-contracts-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: cc9053e80a0198af33ed862df118dbdac625f58f
      TARGET_BRANCH: agent/increment-2c-bounded-hybrid-retrieval
      ARCHIVE_SHA256: 1a9f014228488be8006808e45521d27e8ff98c8b1d24c087b19aaed51f58df61
      EXPECTED_TREE: aebbe5f5528f313b24f2d7b23f7b226acb0bdfb2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct and verify contract archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/increment2c-contracts/READY)" = "$ARCHIVE_SHA256"
          base64 --decode .github/increment2c-contracts/part-000 \
            > /tmp/increment2c-contracts.tar.gz
          echo "$ARCHIVE_SHA256  /tmp/increment2c-contracts.tar.gz" \
            | sha256sum --check -
          cat > /tmp/expected-paths <<'EOF'
          newsroom/retrieval/__init__.py
          newsroom/retrieval/fixture_v2.py
          newsroom/retrieval/fusion.py
          newsroom/retrieval/models.py
          newsroom/retrieval/policy.py
          newsroom/tests/test_retrieval_2c_contracts.py
          newsroom/tests/test_retrieval_2c_fusion.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          tar -tzf /tmp/increment2c-contracts.tar.gz | sort > /tmp/archive-paths
          diff -u /tmp/expected-paths /tmp/archive-paths
          python - <<'PY'
          from pathlib import PurePosixPath
          import tarfile
          with tarfile.open('/tmp/increment2c-contracts.tar.gz', 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or '..' in path.parts
                      or member.issym()
                      or member.islnk()
                      or not member.isfile()
                  ):
                      raise SystemExit(f'unsafe archive member: {member.name!r}')
          PY

      - name: Apply exact contract checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          tar -xzf /tmp/increment2c-contracts.tar.gz -C .
          rm -rf .github/increment2c-contracts
          rm -f .github/workflows/agent-increment2c-contracts-materialize.yml
          git add -A
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          python -m compileall -q newsroom scripts
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_retrieval_2c_contracts.py \
            newsroom/tests/test_retrieval_2c_fusion.py

      - name: Create and push clean contract checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2C Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'feat(retrieval): define bounded hybrid contracts' \
            'Add typed immutable request, branch, fusion, hydration and Retrieval Context v2 contracts; fixed server-owned policy bounds; checked integrated_fixture_v2 dependency roots; exact rational reciprocal-rank fusion; and adversarial caller-scope tests.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
