name: Recover Increment 5C2 authority patch chunks

on:
  push:
    branches: [support/publish-increment5c2-authority-tools-20260807]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/publish-increment5c2-authority-tools-20260807
          fetch-depth: 1
          persist-credentials: false
      - name: Recover available bytes
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/increment5c2-authority-recovery
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import re
          from pathlib import Path

          root = Path('/tmp/increment5c2-authority-recovery')
          parts = sorted(Path('scripts/support/data/increment5c2_authority_patch').glob('part*.b64'))
          report: list[str] = [f'parts={len(parts)}']
          texts: list[str] = []
          for part in parts:
              raw = part.read_bytes()
              text = re.sub(rb'\s+', b'', raw).decode('ascii')
              texts.append(text)
              report.extend([
                  f'{part.name}: raw_bytes={len(raw)} chars={len(text)} mod4={len(text) % 4}',
                  f'{part.name}: head={text[:32]!r}',
                  f'{part.name}: tail={text[-32:]!r}',
                  f'{part.name}: padding={len(text) - len(text.rstrip("="))}',
              ])
          stream = ''.join(texts)
          report.extend([
              f'joined_chars={len(stream)} mod4={len(stream) % 4}',
              f'joined_head={stream[:32]!r}',
              f'joined_tail={stream[-32:]!r}',
              f'joined_padding={len(stream) - len(stream.rstrip("="))}',
          ])
          padded = stream + '=' * ((-len(stream)) % 4)
          try:
              compressed = base64.b64decode(padded, validate=True)
              (root / 'patch.gz').write_bytes(compressed)
              report.extend([
                  f'decoded_bytes={len(compressed)}',
                  f'decoded_sha256={hashlib.sha256(compressed).hexdigest()}',
                  f'decoded_head={compressed[:24].hex()}',
                  f'decoded_tail={compressed[-24:].hex()}',
              ])
              try:
                  patch = gzip.decompress(compressed)
              except Exception as exc:
                  report.append(f'gzip_error={type(exc).__name__}: {exc}')
              else:
                  (root / 'patch.recovered').write_bytes(patch)
                  report.extend([
                      f'patch_bytes={len(patch)}',
                      f'patch_sha256={hashlib.sha256(patch).hexdigest()}',
                      '--- patch head ---',
                      patch[:4000].decode('utf-8', errors='replace'),
                      '--- patch tail ---',
                      patch[-4000:].decode('utf-8', errors='replace'),
                  ])
          except Exception as exc:
              report.append(f'base64_error={type(exc).__name__}: {exc}')
          (root / 'parts.txt').write_text('\n'.join(str(p) for p in parts) + '\n', encoding='utf-8')
          (root / 'report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment5c2-authority-patch-recovery-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/increment5c2-authority-recovery/
