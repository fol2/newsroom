name: Recover Increment 5C2 authority patch chunks

on:
  push:
    branches: [support/publish-increment5c2-authority-tools-20260807]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/publish-increment5c2-authority-tools-20260807
          fetch-depth: 1
          persist-credentials: false
      - name: Recover available bytes
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/increment5c2-authority-recovery
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import itertools
          import re
          import zlib
          from pathlib import Path

          root = Path('/tmp/increment5c2-authority-recovery')
          parts = sorted(Path('scripts/support/data/increment5c2_authority_patch').glob('part*.b64'))
          texts = [re.sub(rb'\s+', b'', part.read_bytes()).decode('ascii') for part in parts]
          boundary = len(texts[0])
          stream = ''.join(texts)
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def decode(candidate: str) -> bytes:
              return base64.b64decode(candidate + '=' * ((-len(candidate)) % 4), validate=True)

          def inflate(candidate: str) -> tuple[bytes, bool] | None:
              try:
                  raw = decode(candidate)
                  obj = zlib.decompressobj(16 + zlib.MAX_WBITS)
                  out = obj.decompress(raw)
                  return out, obj.eof
              except (ValueError, zlib.error):
                  return None

          candidates: list[tuple[int, bool, str, bytes]] = []
          baseline = inflate(stream)
          if baseline is not None:
              candidates.append((len(baseline[0]), baseline[1], 'baseline', baseline[0]))

          # Most likely corruption: one or two characters dropped where the tool
          # payload was split. Search a narrow boundary window deterministically.
          for position in range(boundary - 3, boundary + 4):
              for char in alphabet:
                  label = f'insert1@{position}:{char}'
                  result = inflate(stream[:position] + char + stream[position:])
                  if result is not None:
                      candidates.append((len(result[0]), result[1], label, result[0]))
              for char in alphabet:
                  label = f'replace1@{position}:{char}'
                  result = inflate(stream[:position] + char + stream[position + 1:])
                  if result is not None:
                      candidates.append((len(result[0]), result[1], label, result[0]))
              label = f'delete1@{position}'
              result = inflate(stream[:position] + stream[position + 1:])
              if result is not None:
                  candidates.append((len(result[0]), result[1], label, result[0]))

          for chars in itertools.product(alphabet, repeat=2):
              insertion = ''.join(chars)
              label = f'insert2@{boundary}:{insertion}'
              result = inflate(stream[:boundary] + insertion + stream[boundary:])
              if result is not None:
                  candidates.append((len(result[0]), result[1], label, result[0]))

          candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
          report = [
              f'parts={len(parts)}',
              f'part_lengths={[len(text) for text in texts]}',
              f'boundary={boundary}',
              f'joined_chars={len(stream)}',
              f'joined_sha256={hashlib.sha256(stream.encode()).hexdigest()}',
              f'valid_candidates={len(candidates)}',
          ]
          for index, (size, eof, label, output) in enumerate(candidates[:10]):
              report.append(f'candidate[{index}]={label} bytes={size} eof={eof}')
              path = root / f'candidate-{index:02d}.patch.partial'
              path.write_bytes(output)
              report.append(f'candidate[{index}]_sha256={hashlib.sha256(output).hexdigest()}')
              report.append(f'candidate[{index}]_head={output[:120]!r}')
              report.append(f'candidate[{index}]_tail={output[-120:]!r}')
          (root / 'report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment5c2-authority-patch-recovery-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/increment5c2-authority-recovery/
