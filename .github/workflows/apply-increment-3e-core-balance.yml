name: Apply Increment 3E core balancing correction

on:
  push:
    branches:
      - agent/increment-3e-corrective-hardening
    paths:
      - .github/increment-3e-core-balance.patch
      - .github/workflows/apply-increment-3e-core-balance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked tooling
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Apply and verify the bounded correction
        run: |
          git apply --check --recount .github/increment-3e-core-balance.patch
          git apply --recount .github/increment-3e-core-balance.patch
          uv run python -m pytest -q newsroom/tests/test_sdlc_workflow_lane.py
          git diff --check

      - name: Publish code only and remove one-shot material
        run: |
          rm .github/increment-3e-core-balance.patch
          rm .github/workflows/apply-increment-3e-core-balance.yml
          git config user.name newsroom-ci
          git config user.email newsroom-ci@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "perf(sdlc): rebalance deterministic core shards"
          git push origin HEAD:${GITHUB_REF_NAME}
