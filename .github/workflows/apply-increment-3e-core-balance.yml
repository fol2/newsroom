name: Apply Increment 3E core balancing correction

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked tooling
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Apply and verify the bounded correction
        run: |
          git apply --check --recount .github/increment-3e-core-balance.patch
          git apply --recount .github/increment-3e-core-balance.patch
          uv run python -m pytest -q newsroom/tests/test_sdlc_workflow_lane.py
          git diff --check

      - name: Publish code only and remove one-shot material
        run: |
          rm .github/increment-3e-core-balance.patch
          rm .github/workflows/apply-increment-3e-core-balance.yml
          git config user.name newsroom-ci
          git config user.email newsroom-ci@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "perf(sdlc): rebalance deterministic core shards"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
