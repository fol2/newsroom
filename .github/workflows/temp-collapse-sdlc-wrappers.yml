name: Temporary canonical scheduler materialisation

on:
  push:
    branches:
      - agent/sdlc-core-worksteal-scheduler
    paths:
      - .github/workflows/temp-collapse-sdlc-wrappers.yml

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/sdlc-core-worksteal-scheduler
          fetch-depth: 0

      - name: Restore canonical implementation and test paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          private_impl = Path("scripts/sdlc/_workflow_lane_impl.py")
          public_impl = Path("scripts/sdlc/workflow_lane.py")
          implementation = private_impl.read_text(encoding="utf-8")
          required = '_CORE_WORKER_COUNT = 4\n_CORE_DISTRIBUTION = "worksteal"\n'
          if implementation.count(required) != 1:
              raise SystemExit("canonical scheduler defaults are not exact")
          public_impl.write_text(implementation, encoding="utf-8")
          private_impl.unlink()

          private_tests = Path("newsroom/tests/_sdlc_workflow_lane_tests_impl.py")
          public_tests = Path("newsroom/tests/test_sdlc_workflow_lane.py")
          tests = private_tests.read_text(encoding="utf-8")
          replacements = (
              (
                  '    assert lane_module._CORE_WORKER_COUNT == 6\n'
                  '    assert lane_module._CORE_DISTRIBUTION == "loadfile"\n',
                  '    assert lane_module._CORE_WORKER_COUNT == 4\n'
                  '    assert lane_module._CORE_DISTRIBUTION == "worksteal"\n',
              ),
              (
                  '        "6",\n        "--dist=loadfile",\n',
                  '        "4",\n        "--dist=worksteal",\n',
              ),
              (
                  '    assert "--dist=loadfile" in command\n',
                  '    assert "--dist=worksteal" in command\n',
              ),
          )
          for old, new in replacements:
              if tests.count(old) != 1:
                  raise SystemExit(f"expected one exact test contract block: {old!r}")
              tests = tests.replace(old, new, 1)
          public_tests.write_text(tests, encoding="utf-8")
          private_tests.unlink()
          PY
          python -m compileall -q scripts/sdlc/workflow_lane.py newsroom/tests/test_sdlc_workflow_lane.py
          git diff --check

      - name: Commit clean canonical tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-collapse-sdlc-wrappers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(sdlc): restore canonical scheduler modules"
          git push origin HEAD:agent/sdlc-core-worksteal-scheduler
