name: agent-increment2a-ci-debug-export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: increment2a-final-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
