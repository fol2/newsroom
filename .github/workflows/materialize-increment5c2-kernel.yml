name: Materialize hardened Increment 5C2 branch kernel

on:
  push:
    branches: [support/materialize-increment5c2-kernel-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-hardened-increment5c2-kernel-v2
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/materialize-increment5c2-kernel-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Build, commit locally, verify and publish kernel checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.support.materialize_increment5c2_kernel_v2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5c2-kernel-checkpoint-v2-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5c2-kernel-focused.log
            /tmp/increment5c2-kernel-full.log
            /tmp/increment5c2-kernel-receipt.json
