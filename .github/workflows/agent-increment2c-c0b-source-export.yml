name: agent-increment2c-c0b-source-export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Upload exact current Increment 2C tree
        uses: actions/upload-artifact@v4
        with:
          name: increment2c-c0b-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
