name: Support Increment 5B2 full-text

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.head_ref == 'staging/increment-5b2-fulltext-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Materialize exact reviewed product tree
        run: |
          set -euo pipefail
          python scripts/support/materialize_5b2.py
          python -m py_compile \
            newsroom/authority/_neo4j_projection_system.py \
            newsroom/authority/neo4j_fulltext_reader.py \
            newsroom/increment5/fulltext_contracts.py \
            newsroom/increment5/fulltext_normalizer.py \
            newsroom/increment5/fulltext_receipts.py \
            newsroom/increment5/fulltext_journal.py \
            newsroom/increment5/fulltext_retriever.py \
            newsroom/projection/neo4j/_adapter.py \
            newsroom/tests/increment5b2_helpers.py \
            newsroom/tests/test_increment5b2_normalizer.py \
            newsroom/tests/test_increment5b2_fulltext_retriever.py \
            newsroom/tests/test_increment5b2_neo4j_authority_port.py
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              'docs/operations/increment-5b2-fulltext-retriever.md',
              'docs/traceability/increment-5b-branch-atoms.md',
              'newsroom/authority/_neo4j_projection_system.py',
              'newsroom/authority/neo4j_fulltext_reader.py',
              'newsroom/increment5/fulltext_contracts.py',
              'newsroom/increment5/fulltext_journal.py',
              'newsroom/increment5/fulltext_normalizer.py',
              'newsroom/increment5/fulltext_receipts.py',
              'newsroom/increment5/fulltext_retriever.py',
              'newsroom/projection/neo4j/_adapter.py',
              'newsroom/tests/increment5b2_helpers.py',
              'newsroom/tests/test_increment5b2_fulltext_retriever.py',
              'newsroom/tests/test_increment5b2_neo4j_authority_port.py',
              'newsroom/tests/test_increment5b2_normalizer.py',
          }
          lines = subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          actual = {line[3:] for line in lines}
          if actual != expected:
              raise SystemExit(
                  f'generated 5B2 path inventory differs: expected={sorted(expected)!r} '
                  f'actual={sorted(actual)!r}'
              )
          PY

      - name: Sync locked development environment
        run: uv sync --dev --locked

      - name: Focused Increment 5B2 evidence
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_increment5b2_normalizer.py \
            newsroom/tests/test_increment5b2_fulltext_retriever.py \
            newsroom/tests/test_increment5b2_neo4j_authority_port.py \
            newsroom/tests/test_projection_b2_boundaries.py

      - name: Commit generated product tree for clean-checkout evidence
        run: |
          set -euo pipefail
          git add \
            docs/operations/increment-5b2-fulltext-retriever.md \
            docs/traceability/increment-5b-branch-atoms.md \
            newsroom/authority/_neo4j_projection_system.py \
            newsroom/authority/neo4j_fulltext_reader.py \
            newsroom/increment5/fulltext_contracts.py \
            newsroom/increment5/fulltext_journal.py \
            newsroom/increment5/fulltext_normalizer.py \
            newsroom/increment5/fulltext_receipts.py \
            newsroom/increment5/fulltext_retriever.py \
            newsroom/projection/neo4j/_adapter.py \
            newsroom/tests/increment5b2_helpers.py \
            newsroom/tests/test_increment5b2_fulltext_retriever.py \
            newsroom/tests/test_increment5b2_neo4j_authority_port.py \
            newsroom/tests/test_increment5b2_normalizer.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'support: materialize 5B2 authority-port product tree'
          test -z "$(git status --porcelain)"

      - name: Complete deterministic repository evidence
        run: uv run python -m pytest -q

      - name: Existing clustering evaluation gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Publish product-only verified tree to support branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm \
            scripts/support/5b2_payload.* \
            scripts/support/5b2_refactor_overlay.* \
            scripts/support/materialize_5b2.py \
            .github/workflows/support-increment-5b2-fulltext.yml
          git diff --cached --check
          git commit -m 'support: retain product-only verified 5B2 tree'
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${HEAD_BRANCH}"
