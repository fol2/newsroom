name: Projection B2/B3/C1 Neo4j

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-neo4j-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEO4J_B2_IMAGE: neo4j:2026.06.0-community-trixie
      NEO4J_URI: bolt://localhost:7687
      NEO4J_ADMIN_USERNAME: neo4j
      NEWSROOM_NEO4J_DATABASE: neo4j
      NEWSROOM_NEO4J_PROJECTOR_USERNAME: newsroom_projector

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Verify locked environment
        run: |
          uv lock --check
          uv sync --dev --locked
          uv run python - <<'PY'
          import neo4j
          assert neo4j.__version__ == "6.2.0", neo4j.__version__
          PY

      - name: Generate masked disposable credentials and start Neo4j
        shell: bash
        run: |
          set -euo pipefail
          NEO4J_ADMIN_PASSWORD="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          NEWSROOM_NEO4J_PROJECTOR_PASSWORD="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "::add-mask::${NEO4J_ADMIN_PASSWORD}"
          echo "::add-mask::${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}"
          admin_file="${RUNNER_TEMP}/newsroom-b2-neo4j-admin.env"
          projector_file="${RUNNER_TEMP}/newsroom-b2-neo4j-projector.env"
          umask 077
          printf 'NEO4J_ADMIN_PASSWORD=%s\n' "${NEO4J_ADMIN_PASSWORD}" > "${admin_file}"
          printf 'NEWSROOM_NEO4J_PROJECTOR_PASSWORD=%s\n' "${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}" > "${projector_file}"
          chmod 600 "${admin_file}" "${projector_file}"
          docker run --detach \
            --name newsroom-b2-neo4j \
            --publish 127.0.0.1:7687:7687 \
            --env "NEO4J_AUTH=neo4j/${NEO4J_ADMIN_PASSWORD}" \
            "${NEO4J_B2_IMAGE}"

      - name: Wait for authenticated Neo4j and create projector identity
        run: |
          set -euo pipefail
          admin_file="${RUNNER_TEMP}/newsroom-b2-neo4j-admin.env"
          projector_file="${RUNNER_TEMP}/newsroom-b2-neo4j-projector.env"
          test -f "${admin_file}"
          test -f "${projector_file}"
          set -a
          source "${admin_file}"
          source "${projector_file}"
          set +a
          uv run python - <<'PY'
          import os
          import time

          from neo4j import GraphDatabase

          uri = os.environ["NEO4J_URI"]
          admin_auth = (
              os.environ["NEO4J_ADMIN_USERNAME"],
              os.environ["NEO4J_ADMIN_PASSWORD"],
          )
          last_error = None
          driver = None
          for _ in range(120):
              try:
                  driver = GraphDatabase.driver(uri, auth=admin_auth)
                  driver.verify_connectivity()
                  break
              except Exception as exc:
                  last_error = exc
                  if driver is not None:
                      driver.close()
                  driver = None
                  time.sleep(2)
          else:
              raise RuntimeError("authenticated Neo4j readiness timed out") from last_error

          assert driver is not None
          try:
              with driver.session(database="system") as session:
                  session.run(
                      "CREATE USER newsroom_projector IF NOT EXISTS "
                      "SET PLAINTEXT PASSWORD $password CHANGE NOT REQUIRED",
                      password=os.environ["NEWSROOM_NEO4J_PROJECTOR_PASSWORD"],
                  ).consume()
          finally:
              driver.close()

          projector = GraphDatabase.driver(
              uri,
              auth=(
                  os.environ["NEWSROOM_NEO4J_PROJECTOR_USERNAME"],
                  os.environ["NEWSROOM_NEO4J_PROJECTOR_PASSWORD"],
              ),
          )
          try:
              projector.verify_connectivity()
          finally:
              projector.close()
          PY
          rm -f "${admin_file}"

      - name: Focused B1, B2, B3, C1 and complete Increment 2 tests against actual service
        id: focused
        continue-on-error: true
        env:
          NEWSROOM_NEO4J_SERVICE_REQUIRED: "1"
          NEWSROOM_NEO4J_COMPLETE_SERVICE_REQUIRED: "1"
          NEWSROOM_NEO4J_INCREMENT_2D_SERVICE_REQUIRED: "1"
          NEWSROOM_NEO4J_RETRIEVAL_SERVICE_REQUIRED: "1"
          NEWSROOM_NEO4J_URI: ${{ env.NEO4J_URI }}
        run: |
          set -euo pipefail
          projector_file="${RUNNER_TEMP}/newsroom-b2-neo4j-projector.env"
          test -f "${projector_file}"
          test ! -e "${RUNNER_TEMP}/newsroom-b2-neo4j-admin.env"
          set -a
          source "${projector_file}"
          set +a
          export NEWSROOM_NEO4J_USER="${NEWSROOM_NEO4J_PROJECTOR_USERNAME}"
          export NEWSROOM_NEO4J_PASSWORD="${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}"
          uv run python -m pytest -q \
            newsroom/tests/test_projection_b1_*.py \
            newsroom/tests/test_projection_b2_*.py \
            newsroom/tests/test_projection_b3_*.py \
            newsroom/tests/test_integrated_c1_neo4j_service.py \
            newsroom/tests/test_complete_projection_2b_neo4j_service.py \
            newsroom/tests/test_retrieval_2c_neo4j_service.py \
            newsroom/tests/test_increment_2d_neo4j_service.py \
            newsroom/tests/test_increment4e_neo4j_service.py \
            newsroom/tests/test_increment5b4_neo4j_service.py \
            --junitxml=projection-b2-b3-c1-complete-retrieval-neo4j-results.xml

      - name: Remove disposable credential files
        if: always()
        run: |
          rm -f \
            "${RUNNER_TEMP}/newsroom-b2-neo4j-admin.env" \
            "${RUNNER_TEMP}/newsroom-b2-neo4j-projector.env"

      - name: Prove actual-service tests executed
        if: always()
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("projection-b2-b3-c1-complete-retrieval-neo4j-results.xml")
          if not report.is_file():
              raise SystemExit("actual-service JUnit report is absent")
          root = ET.parse(report).getroot()
          cases = root.findall(".//testcase")
          actual = [
              case
              for case in cases
              if "test_projection_b2_neo4j_service" in case.attrib.get("classname", "")
          ]
          if len(actual) < 4:
              raise SystemExit(f"expected at least 4 B2 actual-service tests, found {len(actual)}")
          if any(case.find("skipped") is not None for case in actual):
              raise SystemExit("B2 actual-service tests were skipped")
          if any(
              case.find("failure") is not None or case.find("error") is not None
              for case in actual
          ):
              raise SystemExit("B2 actual-service tests reported failure or error")

          rebuild = [
              case
              for case in cases
              if "test_projection_b3_neo4j_service"
              in case.attrib.get("classname", "")
          ]
          if len(rebuild) != 8:
              raise SystemExit(
                  f"expected exactly 8 B3 actual-service tests, found {len(rebuild)}"
              )
          if any(case.find("skipped") is not None for case in rebuild):
              raise SystemExit("B3 actual-service rebuild tests were skipped")
          if any(
              case.find("failure") is not None or case.find("error") is not None
              for case in rebuild
          ):
              raise SystemExit("B3 actual-service rebuild tests failed")
          required_b3_tests = {
              "test_actual_service_active_read_resolves_only_authority_promoted_generation",
              "test_actual_service_active_generation_revalidates_after_incremental_delivery",
              "test_actual_service_promotion_rejects_graph_loss_after_validation",
              "test_actual_service_graph_loss_and_process_restart_rebuild_from_authority",
              "test_actual_service_rebuild_cleanup_cannot_cross_generation_namespace",
              "test_actual_service_tombstone_does_not_resurrect_after_wipe_rebuild",
              "test_actual_service_3e_projects_complete_lineage_and_recovers_graph_loss",
              "test_actual_service_3e_replacement_generation_becomes_only_active_lineage",
          }
          executed_names = [case.attrib.get("name") for case in rebuild]
          for test_name in sorted(required_b3_tests):
              if executed_names.count(test_name) != 1:
                  raise SystemExit(
                      f"required B3 actual-service test did not execute exactly once: {test_name}"
                  )

          integrated = [
              case
              for case in cases
              if "test_integrated_c1_neo4j_service"
              in case.attrib.get("classname", "")
          ]
          required_c1_test = (
              "test_actual_service_integrated_foundation_replay_recovery_and_tombstone"
          )
          integrated_names = [case.attrib.get("name") for case in integrated]
          if len(integrated) != 1 or integrated_names.count(required_c1_test) != 1:
              raise SystemExit(
                  "required C1 actual-service proof did not execute exactly once"
              )
          if any(case.find("skipped") is not None for case in integrated):
              raise SystemExit("C1 actual-service proof was skipped")
          if any(
              case.find("failure") is not None or case.find("error") is not None
              for case in integrated
          ):
              raise SystemExit("C1 actual-service proof failed")

          complete = [
              case
              for case in cases
              if "test_complete_projection_2b_neo4j_service"
              in case.attrib.get("classname", "")
          ]
          if len(complete) != 8:
              raise SystemExit(
                  f"expected exactly 8 complete 2B actual-service cases, found {len(complete)}"
              )
          if any(case.find("skipped") is not None for case in complete):
              raise SystemExit("complete 2B actual-service cases were skipped")
          if any(
              case.find("failure") is not None or case.find("error") is not None
              for case in complete
          ):
              raise SystemExit("complete 2B actual-service cases failed")
          complete_names = [case.attrib.get("name", "") for case in complete]
          required_complete_prefixes = {
              "test_actual_service_complete_generation_queries_and_promotes_exact_state",
              "test_actual_service_partial_or_contract_mismatched_state_fails_closed",
              "test_actual_service_wrong_watermark_generation_and_vector_dimension_fail_closed",
              "test_actual_service_replacement_generation_recovers_from_authority_only",
              "test_actual_service_revocation_and_tombstone_remove_current_derivatives",
          }
          for prefix in sorted(required_complete_prefixes):
              if not any(name.startswith(prefix) for name in complete_names):
                  raise SystemExit(
                      "required complete 2B actual-service case did not execute: "
                      + prefix
                  )

          retrieval = [
              case
              for case in cases
              if "test_retrieval_2c_neo4j_service"
              in case.attrib.get("classname", "")
          ]
          required_retrieval = {
              "test_actual_service_executes_all_four_branches_and_hydrates_authority",
              "test_actual_service_missing_admitted_relation_is_incomplete_not_no_match",
              "test_actual_service_missing_fulltext_index_is_unavailable_not_no_match",
              "test_actual_service_missing_vector_index_is_unavailable_not_no_match",
          }
          retrieval_names = {case.attrib.get("name", "") for case in retrieval}
          if retrieval_names != required_retrieval:
              raise SystemExit(
                  "required Increment 2C actual-service cases differ: "
                  + repr(sorted(retrieval_names))
              )
          if any(case.find("skipped") is not None for case in retrieval):
              raise SystemExit("Increment 2C actual-service cases were skipped")
          if any(
              case.find("failure") is not None or case.find("error") is not None
              for case in retrieval
          ):
              raise SystemExit("Increment 2C actual-service cases failed")

          increment_2d = [
              case
              for case in cases
              if "test_increment_2d_neo4j_service"
              in case.attrib.get("classname", "")
          ]
          required_increment_2d = {
              "test_actual_service_complete_increment_2_proof_admits_replays_and_restarts",
              "test_actual_service_complete_proof_fails_closed_when_required_surface_is_lost[fulltext]",
              "test_actual_service_complete_proof_fails_closed_when_required_surface_is_lost[relation]",
              "test_actual_service_complete_proof_fails_closed_when_required_surface_is_lost[vector]",
              "test_actual_service_governed_deletion_purges_derivative_and_never_requalifies",
              "test_actual_service_relation_revocation_changes_later_context_without_rewrite",
              "test_actual_service_replacement_generation_deduplicates_candidate_authority",
              "test_actual_service_required_gap_blocks_complete_candidate_proof",
              "test_actual_service_dead_letter_blocks_complete_candidate_proof",
          }
          increment_2d_names = {
              case.attrib.get("name", "") for case in increment_2d
          }
          if increment_2d_names != required_increment_2d:
              raise SystemExit(
                  "required Increment 2D actual-service cases differ: "
                  + repr(sorted(increment_2d_names))
              )
          if any(case.find("skipped") is not None for case in increment_2d):
              raise SystemExit("Increment 2D actual-service cases were skipped")
          if any(
              case.find("failure") is not None or case.find("error") is not None
              for case in increment_2d
          ):
              raise SystemExit("Increment 2D actual-service cases failed")

          increment_4e = [
              case
              for case in cases
              if "test_increment4e_neo4j_service"
              in case.attrib.get("classname", "")
          ]
          required_increment_4e = {
              "test_actual_service_increment4_admitted_state_projects_exactly_and_replays",
              "test_actual_service_increment4_graph_loss_requires_isolated_replacement",
              "test_actual_service_increment4_replacement_generation_is_only_serving_state",
              "test_actual_service_increment4_tombstone_purges_and_never_resurrects",
          }
          increment_4e_names = {
              case.attrib.get("name", "") for case in increment_4e
          }
          if increment_4e_names != required_increment_4e:
              raise SystemExit(
                  "required Increment 4E actual-service cases differ: "
                  + repr(sorted(increment_4e_names))
              )
          if any(case.find("skipped") is not None for case in increment_4e):
              raise SystemExit("Increment 4E actual-service cases were skipped")
          if any(
              case.find("failure") is not None or case.find("error") is not None
              for case in increment_4e
          ):
              raise SystemExit("Increment 4E actual-service cases failed")
          PY

      - name: Build Increment 5E2 actual-service closeout receipt
        if: steps.focused.outcome == 'success'
        run: |
          uv run python -m scripts.sdlc.increment5e2_closeout_receipt actual-service \
            --repo-root . \
            --service-junit-report projection-b2-b3-c1-complete-retrieval-neo4j-results.xml \
            --output increment5e2-actual-service-closeout.json

      - name: Upload B2/B3/C1, complete 2B and retrieval 2C actual-service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-b2-b3-c1-complete-retrieval-neo4j-evidence
          path: |
            projection-b2-b3-c1-complete-retrieval-neo4j-results.xml
            increment5e2-actual-service-closeout.json
          if-no-files-found: error

      - name: Upload complete 2B actual-service evidence alias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-b2-b3-c1-complete-neo4j-evidence
          path: projection-b2-b3-c1-complete-retrieval-neo4j-results.xml
          if-no-files-found: error

      - name: Upload legacy B2/B3/C1 actual-service evidence alias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-b2-b3-c1-neo4j-evidence
          path: projection-b2-b3-c1-complete-retrieval-neo4j-results.xml
          if-no-files-found: error

      - name: Remove disposable Neo4j state
        if: always()
        run: docker rm --force newsroom-b2-neo4j || true

      - name: Enforce B2/B3/C1, complete 2B and retrieval 2C actual-service gate
        if: steps.focused.outcome != 'success'
        run: exit 1
