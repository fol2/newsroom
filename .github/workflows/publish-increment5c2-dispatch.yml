name: Publish verified Increment 5C2 six-tool dispatcher

on:
  push:
    branches: [support/publish-increment5c2-dispatch-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-increment5c2-six-tool-dispatcher
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/publish-increment5c2-dispatch-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Verify and publish exact dispatcher atom
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/support/publish_increment5c2_dispatch.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5c2-dispatch-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5c2-dispatch-focused.log
            /tmp/increment5c2-dispatch-full.log
            /tmp/increment5c2-dispatch-clustering.log
            /tmp/increment5c2-dispatch-receipt.json
