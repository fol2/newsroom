name: Materialize Increment 3C replay-state correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Verify and apply exact replay-state patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import gzip
          import hashlib
          from pathlib import Path
          import subprocess

          expected_parent = 'e517319f105e757fb425409ee3d5d678c86db7b8'
          parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^'], text=True
          ).strip()
          if parent != expected_parent:
              raise SystemExit(
                  f'staging parent {parent} differs from reviewed {expected_parent}'
              )

          payload_path = Path('.github/increment-3c-replay-state.patch.gz')
          payload = payload_path.read_bytes()
          if len(payload) != 3191:
              raise SystemExit('replay-state gzip size differs')
          if hashlib.sha256(payload).hexdigest() != (
              'ce0629004140fb9dd6373d21415db69feca1eb9961307e5f04ee9b3e1dcb08f0'
          ):
              raise SystemExit('replay-state gzip digest differs')

          patch = gzip.decompress(payload)
          if len(patch) != 17210:
              raise SystemExit('replay-state patch size differs')
          if hashlib.sha256(patch).hexdigest() != (
              '9589f09e0b17eb44e9b45e9cd9fac0470cef58c5d68c333b805556e2baa4e0b5'
          ):
              raise SystemExit('replay-state patch digest differs')
          Path('/tmp/increment-3c-replay-state.patch').write_bytes(patch)
          PY
          git apply --check /tmp/increment-3c-replay-state.patch
          git apply /tmp/increment-3c-replay-state.patch
          rm -f \
            .github/increment-3c-replay-state.patch.gz \
            .github/workflows/materialize-increment-3c-replay-state.yml
          python -m compileall -q newsroom
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_contracts.py \
            newsroom/tests/test_check_3c_baselines.py \
            newsroom/tests/test_check_3c_transitions.py \
            newsroom/tests/test_check_3c_agenda.py \
            newsroom/tests/test_check_3c_findings.py \
            newsroom/tests/test_check_3c_transition_planning.py \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_check_3c_authority_store.py \
            newsroom/tests/test_check_3c_authority_integrity.py \
            newsroom/tests/test_check_3c_admission.py \
            newsroom/tests/test_check_3c_admission_findings.py \
            newsroom/tests/test_check_3c_model_policies.py \
            newsroom/tests/test_check_3c_concurrency.py \
            newsroom/tests/test_check_3c_traceability.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified clean replay-state correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(checks): report resumed admission completion state'
          git push origin HEAD:agent/increment-3c-check-transition-authority
