name: agent-increment2d-final-review-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2d-final-review-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: e762663e04108655d3eff110baabaaab0749f250
      EXPECTED_BASE_TREE: d5414ef645078d7fa464b93b5000de49a7ee7b0a
      EXPECTED_TREE: 7ed0cef7c911d8f495d03fc1025ae2b2403c018c
      PATCH_SHA256: eee28b650286d0f77d00fc5fbc97aebf5a82ca8bd19bdea903d2ddf60021a493
      TARGET_BRANCH: agent/increment-2d-complete-actual-neo4j-proof
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct exact final-review patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/increment2d-final-review/part-000 \
            > /tmp/increment2d-final-review.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2d-final-review.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2d-final-review.patch.gz \
            > /tmp/increment2d-final-review.patch

      - name: Apply and verify exact final-review tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_BASE_TREE"
          git apply --index /tmp/increment2d-final-review.patch
          cat > /tmp/expected-paths <<'EOF'
          docs/operations/increment-2d-complete-actual-neo4j-proof.md
          docs/research/2026-07-27-increment-2d-substantive-review.md
          newsroom/authority/_development_candidate_store.py
          newsroom/authority/_development_candidate_system.py
          newsroom/tests/increment_2d_helpers.py
          newsroom/tests/test_increment_2d_candidate_authority.py
          newsroom/tests/test_increment_2d_neo4j_service.py
          newsroom/tests/test_increment_2d_traceability.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked final-review gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_proof_controller.py \
            newsroom/tests/test_increment_2d_neo4j_service.py \
            newsroom/tests/test_increment_2d_traceability.py \
            newsroom/tests/test_retrieval_2c_authority.py \
            newsroom/tests/test_relation_2a_lifecycle_integrity.py \
            newsroom/tests/test_complete_projection_2b_authority.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
            --repo-root . \
            --report increment2d-final-review-core.xml \
            --clustering
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Create and push clean final-review commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2D Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(candidate): close final Increment 2D review findings' \
            'Bind restart integrity to immutable command and event authority, enforce exact Candidate chronology and proposal-only exclusion, narrow failure contracts, and finalize reviewed evidence.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORISED_PARENT" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
