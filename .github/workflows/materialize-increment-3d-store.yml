name: Materialize Increment 3D Signal Lead authority store

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3d-signal-lead-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact Increment 3D branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3d-signal-lead-authority
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Verify and apply exact authority-store patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          manifest_path = root / '.github/increment-3d-store-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          Path('/tmp/increment-3d-store-manifest-copy.json').write_text(
              json.dumps(manifest, sort_keys=True) + '\n', encoding='utf-8'
          )
          if manifest.get('schema_version') != (
              'newsroom.increment-3d.signal-lead-store-materializer.v1'
          ):
              raise SystemExit('unexpected Increment 3D store materializer schema')

          base_commit = manifest['base_commit']
          subprocess.run(
              ['git', 'merge-base', '--is-ancestor', base_commit, 'HEAD'],
              check=True,
          )
          actual_changed = tuple(
              sorted(
                  subprocess.check_output(
                      ['git', 'diff', '--name-only', f'{base_commit}..HEAD', '--'],
                      text=True,
                  ).splitlines()
              )
          )
          expected_temporary = tuple(sorted(manifest['temporary_paths']))
          if actual_changed != expected_temporary:
              raise SystemExit(
                  'Increment 3D branch contains non-transport changes before '
                  f'materialization: {actual_changed!r}'
              )

          pieces = []
          for relative in manifest['payload_chunk_paths']:
              encoded = (root / relative).read_text(encoding='ascii')
              if not encoded.endswith('\n'):
                  raise SystemExit(
                      f'Increment 3D store payload chunk lacks newline: {relative}'
                  )
              pieces.append(encoded[:-1])
          compact = ''.join(pieces)
          if len(compact) != manifest['payload_base64_size']:
              raise SystemExit('Increment 3D store payload base64 size differs')
          compressed = base64.b64decode(compact, validate=True)
          if len(compressed) != manifest['gzip_size']:
              raise SystemExit('Increment 3D store payload gzip size differs')
          if hashlib.sha256(compressed).hexdigest() != manifest['gzip_sha256']:
              raise SystemExit('Increment 3D store payload gzip digest differs')
          patch = gzip.decompress(compressed)
          if len(patch) != manifest['patch_size']:
              raise SystemExit('Increment 3D store patch size differs')
          if hashlib.sha256(patch).hexdigest() != manifest['patch_sha256']:
              raise SystemExit('Increment 3D store patch digest differs')
          Path('/tmp/increment-3d-store.patch').write_bytes(patch)
          PY
          git apply --check /tmp/increment-3d-store.patch
          git apply /tmp/increment-3d-store.patch
          rm -f \
            .github/increment-3d-store-manifest.json \
            .github/increment-3d-store-payload/part-*.txt \
            .github/workflows/materialize-increment-3d-store.yml
          python -m compileall -q newsroom scripts
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python - <<'PY'
          import neo4j
          import pytest
          import sys

          assert sys.version_info[:2] == (3, 12), sys.version
          assert neo4j.__version__ == '6.2.0', neo4j.__version__
          assert pytest.__version__
          PY

      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/increment-3d-focused-tests.txt
          import json
          from pathlib import Path
          manifest = json.loads(
              Path('/tmp/increment-3d-store-manifest-copy.json').read_text(
                  encoding='utf-8'
              )
          )
          print('\n'.join(manifest['focused_tests']))
          PY
          mapfile -t focused_tests < /tmp/increment-3d-focused-tests.txt
          uv run --no-sync python -m pytest -q "${focused_tests[@]}"
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified clean authority store
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import subprocess

          manifest = json.loads(
              Path('/tmp/increment-3d-store-manifest-copy.json').read_text(
                  encoding='utf-8'
              )
          )
          expected = tuple(
              sorted(manifest['product_paths'] + manifest['temporary_paths'])
          )
          raw = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-z']
          ).decode('utf-8')
          actual: list[str] = []
          for record in (item for item in raw.split('\0') if item):
              path = record[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              actual.append(path)
          if tuple(sorted(actual)) != expected:
              raise SystemExit(
                  'Increment 3D clean product paths differ: '
                  f'{tuple(sorted(actual))!r}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(discovery): add single-writer Signal and Lead authority'
          git push origin HEAD:agent/increment-3d-signal-lead-authority
