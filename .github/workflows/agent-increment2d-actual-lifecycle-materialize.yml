name: agent-increment2d-actual-lifecycle-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2d-actual-lifecycle-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: 42a055458d20128004e9fcf1b8c16861be6f128f
      EXPECTED_BASE_TREE: 0b006ddfd2beb2af95e1978a09e099e016ddd65c
      EXPECTED_TREE: bba53119424f8f27afdef1e30def0a909b927bb7
      PATCH_SHA256: c8362420a6dea5dda2e161524773e5566712070ae8a217247ea5a9648b3f71c8
      TARGET_BRANCH: agent/increment-2d-complete-actual-neo4j-proof
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct exact actual-lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/increment2d-actual-lifecycle/part-000 \
            > /tmp/increment2d-actual-lifecycle.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2d-actual-lifecycle.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2d-actual-lifecycle.patch.gz \
            > /tmp/increment2d-actual-lifecycle.patch

      - name: Apply and verify exact actual-lifecycle tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_BASE_TREE"
          git apply --index /tmp/increment2d-actual-lifecycle.patch
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/projection-b2-neo4j.yml
          newsroom/tests/test_increment_2d_neo4j_service.py
          newsroom/tests/test_integrated_c1_sdlc_contract.py
          newsroom/tests/test_sdlc_workflow_lane.py
          scripts/sdlc/workflow_lane.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked actual-lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_proof_controller.py \
            newsroom/tests/test_increment_2d_neo4j_service.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
            --repo-root . \
            --report increment2d-actual-lifecycle-core.xml \
            --clustering
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Create and push clean actual-lifecycle checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2D Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'test(increment2): require complete lifecycle evidence' \
            'Extend permanent actual-Neo4j proof with replacement-generation, relation revocation, governed deletion, tombstone non-resurrection and fail-closed surface-loss cases.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORISED_PARENT" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
