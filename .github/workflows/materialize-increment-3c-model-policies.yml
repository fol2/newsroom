name: Materialize Increment 3C source-model policies

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Verify and materialize exact policy payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import shutil
          import subprocess
          import tarfile
          import tempfile

          root = Path.cwd()
          payload_root = root / '.github/increment-3c-model-policies'
          manifest_path = root / '.github/increment-3c-model-policies-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          staging_parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^'], text=True
          ).strip()
          parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^^'], text=True
          ).strip()
          if staging_parent != '83aa0be960e23bdad67e2c9fbfd022df7c0d287a':
              raise SystemExit(
                  f'workflow repair parent {staging_parent} is not exact staging head'
              )
          if parent != manifest['parent_sha']:
              raise SystemExit(
                  f"staging base {parent} differs from reviewed {manifest['parent_sha']}"
              )
          expected_chunks = tuple(
              payload_root / f'part-{index:02d}.b64'
              for index in range(manifest['chunk_count'])
          )
          actual_chunks = tuple(sorted(payload_root.glob('part-*.b64')))
          if actual_chunks != expected_chunks:
              raise SystemExit('policy payload chunk inventory differs from manifest')
          encoded_parts: list[str] = []
          for path in expected_chunks:
              text = path.read_text(encoding='ascii')
              expected = manifest['chunk_sha256'][path.name]
              if hashlib.sha256(text.encode('ascii')).hexdigest() != expected:
                  raise SystemExit(f'policy payload chunk digest differs: {path.name}')
              encoded_parts.append(text)
          encoded = ''.join(encoded_parts)
          if len(encoded) != manifest['base64_size']:
              raise SystemExit('policy payload base64 size differs from manifest')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != manifest['archive_size']:
              raise SystemExit('policy archive size differs from manifest')
          if hashlib.sha256(archive).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('policy archive digest differs from manifest')

          expected_paths = tuple(manifest['paths'])
          if len(expected_paths) != len(set(expected_paths)):
              raise SystemExit('policy manifest contains duplicate paths')
          with tempfile.TemporaryDirectory() as temporary:
              staging = Path(temporary)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
                  members = tar.getmembers()
                  names = tuple(member.name for member in members)
                  if len(names) != len(set(names)) or set(names) != set(expected_paths):
                      raise SystemExit('policy archive inventory differs from manifest')
                  for member in members:
                      path = PurePosixPath(member.name)
                      if (
                          path.is_absolute()
                          or '..' in path.parts
                          or not member.isfile()
                          or member.issym()
                          or member.islnk()
                      ):
                          raise SystemExit(f'unsafe policy archive member: {member.name}')
                      target = staging.joinpath(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = tar.extractfile(member)
                      if source is None:
                          raise SystemExit(f'policy member has no bytes: {member.name}')
                      target.write_bytes(source.read())
              for relative in expected_paths:
                  source = staging / relative
                  digest = hashlib.sha256(source.read_bytes()).hexdigest()
                  if digest != manifest['file_sha256'][relative]:
                      raise SystemExit(f'policy file digest differs: {relative}')
                  target = root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          operations = root / 'docs/operations/increment-3c-check-transition-authority.md'
          operations_text = operations.read_text(encoding='utf-8')
          old_header = (
              '**Status:** implementation review unit for issue #207  \n'
              '**Parent:** #143  \n'
              '**Authorised base:** `main@707519cebcc18fd8010b9b1b608b361ab2f6de03`  \n'
          )
          clean_header = (
              '**Status:** implementation review unit for issue #207\n'
              '**Parent:** #143\n'
              '**Authorised base:** `main@707519cebcc18fd8010b9b1b608b361ab2f6de03`\n'
          )
          if operations_text.count(old_header) != 1:
              raise SystemExit('reviewed operations header changed shape')
          operations.write_text(
              operations_text.replace(old_header, clean_header, 1),
              encoding='utf-8',
          )
          clean_operations_digest = hashlib.sha256(operations.read_bytes()).hexdigest()
          if clean_operations_digest != '22ee88ae88153864cdc0dea45da909025210b7c37cda2f73c549edf73d53f8cc':
              raise SystemExit('clean operations document digest differs')
          for relative in manifest['deletions']:
              target = root / relative
              if target.exists():
                  if target.is_dir():
                      shutil.rmtree(target)
                  else:
                      target.unlink()
          shutil.rmtree(payload_root)
          manifest_path.unlink()
          (root / '.github/workflows/materialize-increment-3c-model-policies.yml').unlink()
          PY
          python -m compileall -q newsroom
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_contracts.py \
            newsroom/tests/test_check_3c_baselines.py \
            newsroom/tests/test_check_3c_transitions.py \
            newsroom/tests/test_check_3c_agenda.py \
            newsroom/tests/test_check_3c_findings.py \
            newsroom/tests/test_check_3c_transition_planning.py \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_check_3c_authority_store.py \
            newsroom/tests/test_check_3c_authority_integrity.py \
            newsroom/tests/test_check_3c_admission.py \
            newsroom/tests/test_check_3c_admission_findings.py \
            newsroom/tests/test_check_3c_model_policies.py \
            newsroom/tests/test_check_3c_concurrency.py \
            newsroom/tests/test_check_3c_traceability.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified clean policy authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(checks): complete source-model transition policies'
          git push origin HEAD:agent/increment-3c-check-transition-authority
