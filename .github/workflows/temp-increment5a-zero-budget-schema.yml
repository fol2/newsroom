name: Temporary Increment 5A zero-budget schema migration

on:
  push:
    branches:
      - agent/increment-5a-retrieval-contract
    paths:
      - .github/workflows/temp-increment5a-zero-budget-schema.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Migrate schema and all digest-bound references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import subprocess

          OLD_SCHEMA_DIGEST = (
              "sha256:1dfdb4de6d2d184efb486d1601a3eb246f1d74352f55955a2b69e962336c31ef"
          )
          OLD_BODY_DIGEST = (
              "sha256:137f423d2630aec1af065968a6a0afac9283918fdad3f6e0631719f23b97952a"
          )

          def replace_once(source: str, old: str, new: str, *, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          profiles_path = Path("newsroom/increment5/profiles.py")
          profiles = profiles_path.read_text(encoding="utf-8")
          old_block = '''_qualification_common_properties = deepcopy(_proposal._COMMON_PROPERTIES)\n_qualification_rights = deepcopy(_qualification_common_properties["rights"])\n'''
          new_block = '''_qualification_common_properties = deepcopy(_proposal._COMMON_PROPERTIES)\n_qualification_budgets = deepcopy(_qualification_common_properties["budgets"])\nassert isinstance(_qualification_budgets, dict)\n_budget_properties = _qualification_budgets["properties"]\nassert isinstance(_budget_properties, dict)\n_budget_properties["max_external_calls_per_request"] = {"const": 0}\n_budget_properties["max_gross_cost_microunits_per_request"] = {"const": 0}\n_qualification_common_properties["budgets"] = _qualification_budgets\n_qualification_rights = deepcopy(_qualification_common_properties["rights"])\n'''
          profiles = replace_once(
              profiles,
              old_block,
              new_block,
              label="qualification budget hardening",
          )
          profiles_path.write_text(profiles, encoding="utf-8")

          artifact_path = Path(
              "newsroom/increment5/data/"
              "increment5_production_qualification_profile_v2.schema.json"
          )
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          budget_properties = artifact["properties"]["budgets"]["properties"]
          budget_properties["max_external_calls_per_request"] = {"const": 0}
          budget_properties["max_gross_cost_microunits_per_request"] = {
              "const": 0
          }
          canonical = json.dumps(
              artifact,
              ensure_ascii=False,
              allow_nan=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          artifact_path.write_bytes(canonical)

          tests_path = Path("newsroom/tests/test_increment5a_approval.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "from jsonschema import Draft202012Validator\n",
              "from jsonschema import Draft202012Validator\n",
              label="jsonschema import already present",
          ) if "from jsonschema import Draft202012Validator\n" in tests else tests.replace(
              "import pytest\n",
              "import pytest\nfrom jsonschema import Draft202012Validator\n",
              1,
          )
          tests = replace_once(
              tests,
              "    PRODUCTION_PROFILE_SCHEMA_PATH,\n",
              "    PRODUCTION_PROFILE_SCHEMA_PATH,\n    PRODUCTION_PROFILE_SCHEMA_VERSION,\n",
              label="production schema version import",
          )
          old_assertion = '''    rights = PRODUCTION_PROFILE_SCHEMA["properties"]["rights"]["properties"]\n    assert rights["protected_content_allowed"] == {"const": False}\n\n\n'''
          new_assertion = '''    rights = PRODUCTION_PROFILE_SCHEMA["properties"]["rights"]["properties"]\n    assert rights["protected_content_allowed"] == {"const": False}\n    budgets = PRODUCTION_PROFILE_SCHEMA["properties"]["budgets"]["properties"]\n    assert budgets["max_external_calls_per_request"] == {"const": 0}\n    assert budgets["max_gross_cost_microunits_per_request"] == {"const": 0}\n\n\ndef _standalone_production_manifest() -> dict[str, object]:\n    proposal = INCREMENT_5A_DECISION_PACKET\n    required_modes = PRODUCTION_PROFILE_SCHEMA["properties"]["required_modes"][\n        "const"\n    ]\n    return {\n        "schema_version": PRODUCTION_PROFILE_SCHEMA_VERSION,\n        "profile": RetrievalProfileKind.PRODUCTION.value,\n        "decision_payload_digest": proposal.payload_digest,\n        "proposal_record_digest": proposal.record_digest,\n        "contract_bundle_digest": proposal.bundle.contract_digest,\n        "approval_attestation_digest": "sha256:" + "a" * 64,\n        "effective_contract_digest": "sha256:" + "b" * 64,\n        "runtime_authority": "PRODUCTION_QUALIFICATION",\n        "qualification_eligible": True,\n        "required_modes": required_modes,\n        "graph_free_fallback": False,\n        "silent_mode_fallback": False,\n        "components": {\n            kind.value: {\n                "contract_id": identity.contract_id,\n                "contract_version": identity.contract_version,\n                "implementation_version": identity.implementation_version,\n                "configuration_digest": identity.configuration_digest,\n                "identity_digest": identity.identity_digest,\n                "implementation_kind": "REAL_REPOSITORY_NATIVE",\n                "approval_status": "APPROVED_BY_ATTESTATION",\n            }\n            for kind, identity in proposal.bundle.component_by_kind.items()\n        },\n        "budgets": proposal.budgets.canonical_value(),\n        "rights": {\n            "protected_content_allowed": False,\n            "rights_rechecked_at_hydration": True,\n            "purge_required": True,\n            "rebuild_must_not_resurrect": True,\n        },\n    }\n\n\ndef test_standalone_v2_schema_rejects_external_calls_and_spend() -> None:\n    validator = Draft202012Validator(PRODUCTION_PROFILE_SCHEMA)\n    manifest = _standalone_production_manifest()\n    assert not tuple(validator.iter_errors(manifest))\n\n    for field in (\n        "max_external_calls_per_request",\n        "max_gross_cost_microunits_per_request",\n    ):\n        tampered = deepcopy(manifest)\n        budgets = tampered["budgets"]\n        assert isinstance(budgets, dict)\n        budgets[field] = 1\n        assert tuple(validator.iter_errors(tampered))\n\n\n'''
          tests = replace_once(
              tests,
              old_assertion,
              new_assertion,
              label="standalone zero-budget regression",
          )
          tests_path.write_text(tests, encoding="utf-8")

          new_schema_digest = "sha256:" + hashlib.sha256(canonical).hexdigest()

          def tracked_files_with(text: str) -> list[Path]:
              completed = subprocess.run(
                  ("git", "grep", "-l", "--fixed-strings", text, "--"),
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if completed.returncode not in (0, 1):
                  raise SystemExit(completed.stderr)
              return [
                  Path(line)
                  for line in completed.stdout.splitlines()
                  if line
              ]

          schema_files = tracked_files_with(OLD_SCHEMA_DIGEST)
          if not schema_files:
              raise SystemExit("old qualification schema digest was not referenced")
          for path in schema_files:
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace(OLD_SCHEMA_DIGEST, new_schema_digest),
                  encoding="utf-8",
              )

          # Import only after code and canonical artifact agree.
          from newsroom.authority.canonical import digest_bytes
          from newsroom.increment5 import (
              QUALIFICATION_PRODUCTION_PROFILE_SCHEMA_DIGEST,
              expected_increment5a_owner_approval_body,
          )

          if QUALIFICATION_PRODUCTION_PROFILE_SCHEMA_DIGEST != new_schema_digest:
              raise SystemExit("runtime schema digest differs from canonical artifact")
          new_body_digest = digest_bytes(
              expected_increment5a_owner_approval_body().encode("utf-8")
          )

          body_files = tracked_files_with(OLD_BODY_DIGEST)
          if not body_files:
              raise SystemExit("old owner-statement body digest was not referenced")
          for path in body_files:
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace(OLD_BODY_DIGEST, new_body_digest),
                  encoding="utf-8",
              )

          if tracked_files_with(OLD_SCHEMA_DIGEST):
              raise SystemExit("stale qualification schema digest remains")
          if tracked_files_with(OLD_BODY_DIGEST):
              raise SystemExit("stale owner-statement body digest remains")

          Path(".increment5a-zero-budget-digests.txt").write_text(
              f"effective_schema={new_schema_digest}\n"
              f"owner_body={new_body_digest}\n",
              encoding="utf-8",
          )
          print(new_schema_digest)
          print(new_body_digest)
          PY

          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom/increment5 newsroom/tests/test_increment5a_approval.py
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment5a_approval.py \
            newsroom/tests/test_increment5a_contracts.py \
            newsroom/tests/test_increment5a_traceability.py
          git diff --check

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cat .increment5a-zero-budget-digests.txt
          rm .increment5a-zero-budget-digests.txt
          rm .github/workflows/temp-increment5a-zero-budget-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(increment5): pin zero external calls and spend"
          git push origin HEAD:agent/increment-5a-retrieval-contract
