name: Finalize Increment 5B3 exact-head gate

on:
  push:
    branches:
      - support/finalize-increment-5b3-20260806
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: finalize-increment-5b3-exact-head
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: fol2/newsroom
      OWNER: fol2
      REPO: newsroom
      EXPECTED_BASE: 7a4164f0a0b7c7c70cd68b2a5485110e7ca576f3
      CANONICAL_BRANCH: agent/increment-5b3-vector-replay
      GATE_REPORT: /tmp/increment5b3-final-gate.json
      GATE_STATE: /tmp/increment5b3-final-gate-state
      PR_NUMBER_PATH: /tmp/increment5b3-final-pr-number
      HEAD_PATH: /tmp/increment5b3-final-head
    steps:
      - name: Check out disposable gate carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for exact-head workflows, publication evidence and review
        shell: bash
        run: |
          set -euo pipefail
          permanent_paths=(
            ".github/workflows/ci.yml"
            ".github/workflows/authority-a2a.yml"
            ".github/workflows/authority-a2b.yml"
            ".github/workflows/projection-b1.yml"
            ".github/workflows/projection-b2-neo4j.yml"
            ".github/workflows/evidence.yml"
          )

          gate_passed=false
          for attempt in $(seq 1 50); do
            pr_number="$(gh pr list \
              --repo "$REPOSITORY" \
              --head "$CANONICAL_BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty')"
            if [[ -z "$pr_number" ]]; then
              printf '{"pass":false,"reasons":["canonical PR is not open"],"attempt":%s}\n' \
                "$attempt" | tee "$GATE_REPORT"
              sleep 30
              continue
            fi
            printf '%s\n' "$pr_number" > "$PR_NUMBER_PATH"

            gh pr view "$pr_number" \
              --repo "$REPOSITORY" \
              --json number,state,isDraft,mergeable,headRefOid,baseRefOid,url,title \
              > /tmp/pr.json
            head="$(jq -r .headRefOid /tmp/pr.json)"
            printf '%s\n' "$head" > "$HEAD_PATH"

            gh api "repos/$REPOSITORY/commits/$head" > /tmp/head-commit.json
            gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" \
              --slurp > /tmp/pr-files-pages.json
            gh api "repos/$REPOSITORY/actions/runs?head_sha=$head&per_page=100" \
              > /tmp/workflow-runs.json
            gh api --paginate "repos/$REPOSITORY/issues/$pr_number/comments?per_page=100" \
              --slurp > /tmp/pr-comment-pages.json
            gh api graphql \
              -f owner="$OWNER" \
              -f repo="$REPO" \
              -F number="$pr_number" \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){totalCount nodes{isResolved}}}}}' \
              > /tmp/review-threads.json

            PERMANENT_PATHS="$(printf '%s\n' "${permanent_paths[@]}")" \
            ATTEMPT="$attempt" \
            python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_base = os.environ["EXPECTED_BASE"]
          permanent_paths = [
              item for item in os.environ["PERMANENT_PATHS"].splitlines() if item
          ]
          pr = json.loads(Path("/tmp/pr.json").read_text(encoding="utf-8"))
          commit = json.loads(
              Path("/tmp/head-commit.json").read_text(encoding="utf-8")
          )
          file_pages = json.loads(
              Path("/tmp/pr-files-pages.json").read_text(encoding="utf-8")
          )
          files = [item for page in file_pages for item in page]
          runs = json.loads(
              Path("/tmp/workflow-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          comment_pages = json.loads(
              Path("/tmp/pr-comment-pages.json").read_text(encoding="utf-8")
          )
          comments = [item for page in comment_pages for item in page]
          threads_payload = json.loads(
              Path("/tmp/review-threads.json").read_text(encoding="utf-8")
          )
          threads = threads_payload["data"]["repository"]["pullRequest"][
              "reviewThreads"
          ]

          reasons: list[str] = []
          head = pr.get("headRefOid")
          if pr.get("state") != "OPEN":
              reasons.append("PR is not open")
          if pr.get("isDraft"):
              reasons.append("PR is still draft")
          if pr.get("mergeable") != "MERGEABLE":
              reasons.append(f"PR mergeable state is {pr.get('mergeable')}")
          if pr.get("baseRefOid") != expected_base:
              reasons.append("PR base head moved from the locked post-5B2 commit")

          parents = commit.get("parents", [])
          if len(parents) != 1 or parents[0].get("sha") != expected_base:
              reasons.append("candidate is not exactly one commit over the locked base")

          expected_files = {
              "docs/operations/increment-5b3-vector-fixture-retriever.md",
              "docs/traceability/increment-5b3-vector-fixture-retriever.md",
              "newsroom/increment5/data/increment5b3_vector_fixture_v1.json",
              "newsroom/increment5/vector_retriever.py",
              "newsroom/tests/test_increment5b3_vector_retriever.py",
          }
          actual_files = {item.get("filename") for item in files}
          if actual_files != expected_files:
              reasons.append(
                  "product file inventory mismatch: "
                  f"expected={sorted(expected_files)} actual={sorted(actual_files)}"
              )

          latest_by_path: dict[str, dict[str, object]] = {}
          for run in runs:
              path = run.get("path")
              if path in permanent_paths and path not in latest_by_path:
                  latest_by_path[path] = run
          workflow_state: dict[str, object] = {}
          for path in permanent_paths:
              run = latest_by_path.get(path)
              if run is None:
                  reasons.append(f"missing exact-head permanent workflow: {path}")
                  workflow_state[path] = None
                  continue
              state = {
                  "id": run.get("id"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "event": run.get("event"),
              }
              workflow_state[path] = state
              if run.get("head_sha") != head:
                  reasons.append(f"workflow {path} is not bound to the current head")
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  reasons.append(
                      f"workflow {path} is not successful: "
                      f"status={run.get('status')} conclusion={run.get('conclusion')}"
                  )

          bodies = [str(comment.get("body") or "") for comment in comments]
          publication_marker = any(
              "Exact 5B3 publication checkpoint:" in body
              and f"head: `{head}`" in body
              and "complete repository:" in body
              and "passed" in body.lower()
              for body in bodies
          )
          if not publication_marker:
              reasons.append("current-head focused/full publication evidence is absent")

          codex_clean = False
          codex_reviewed = None
          for body in bodies:
              if "Codex Review:" not in body:
                  continue
              match = re.search(r"Reviewed commit:\*\*\s*`([0-9a-f]+)`", body)
              if match is None:
                  match = re.search(r"Reviewed commit:\s*`([0-9a-f]+)`", body)
              if match is None:
                  continue
              reviewed = match.group(1)
              if not str(head).startswith(reviewed):
                  continue
              if (
                  "Didn't find any major issues" in body
                  or "didn't find any major issues" in body
              ):
                  codex_clean = True
                  codex_reviewed = reviewed
                  break
          if not codex_clean:
              reasons.append("clean Codex substantive review for the current head is absent")

          if threads.get("totalCount", 0) > 100:
              reasons.append("review thread count exceeds the bounded gate query")
          unresolved = [
              node for node in threads.get("nodes", []) if not node.get("isResolved")
          ]
          if unresolved:
              reasons.append(f"{len(unresolved)} review threads remain unresolved")

          report = {
              "schema_version": "newsroom.increment5b3.final-merge-gate.v1",
              "attempt": int(os.environ["ATTEMPT"]),
              "pass": not reasons,
              "reasons": reasons,
              "pull_request": pr,
              "head": head,
              "head_tree": commit.get("commit", {}).get("tree", {}).get("sha"),
              "head_parent": parents[0].get("sha") if len(parents) == 1 else None,
              "files": sorted(actual_files),
              "permanent_workflows": workflow_state,
              "publication_marker": publication_marker,
              "codex_clean": codex_clean,
              "codex_reviewed_commit": codex_reviewed,
              "review_thread_total": threads.get("totalCount"),
              "unresolved_review_threads": len(unresolved),
          }
          Path(os.environ["GATE_REPORT"]).write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          Path(os.environ["GATE_STATE"]).write_text(
              "PASS\n" if not reasons else "WAIT\n",
              encoding="utf-8",
          )
          PY

            if [[ "$(cat "$GATE_STATE")" == "PASS" ]]; then
              gate_passed=true
              break
            fi
            sleep 30
          done

          if [[ "$gate_passed" != "true" ]]; then
            pr_number="$(cat "$PR_NUMBER_PATH" 2>/dev/null || true)"
            if [[ -n "$pr_number" ]]; then
              gh pr comment "$pr_number" --repo "$REPOSITORY" --body "The exact-head merge gate did not pass within its bounded wait. No merge occurred. Latest retained report:\n\n\`\`\`json\n$(cat "$GATE_REPORT")\n\`\`\`" || true
            fi
            exit 1
          fi

      - name: Squash merge only the exact gated head
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(cat "$PR_NUMBER_PATH")"
          head="$(cat "$HEAD_PATH")"
          merge_response="$(gh api \
            --method PUT \
            "repos/$REPOSITORY/pulls/$pr_number/merge" \
            -f merge_method=squash \
            -f sha="$head" \
            -f commit_title="Increment 5B3: deterministic vector fixture replay retriever" \
            -f commit_message="Deliver the independently attributable fixture/replay VECTOR branch with exact binary32 materialisation, rational cosine ordering, current-authority checks, bounded truthful outcomes and immutable restart replay. All permanent exact-head workflows and the current-head substantive review passed. Closes #303.")"
          printf '%s\n' "$merge_response" > /tmp/increment5b3-merge-response.json
          if [[ "$(jq -r .merged <<<"$merge_response")" != "true" ]]; then
            echo "GitHub did not merge the exact gated head" >&2
            exit 1
          fi
          merge_commit="$(jq -r .sha <<<"$merge_response")"
          main_head="$(gh api "repos/$REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$main_head" != "$merge_commit" ]]; then
            echo "main did not advance to the returned squash commit" >&2
            exit 1
          fi
          head_tree="$(gh api "repos/$REPOSITORY/commits/$head" --jq .commit.tree.sha)"
          merge_tree="$(gh api "repos/$REPOSITORY/commits/$merge_commit" --jq .commit.tree.sha)"
          merge_parent="$(gh api "repos/$REPOSITORY/commits/$merge_commit" --jq '.parents[0].sha')"
          if [[ "$head_tree" != "$merge_tree" || "$merge_parent" != "$EXPECTED_BASE" ]]; then
            echo "squash merge tree or parent does not match the exact gate" >&2
            exit 1
          fi
          cat > /tmp/increment5b3-merge-receipt.json <<EOF
          {"schema_version":"newsroom.increment5b3.merge-receipt.v1","pull_request":$pr_number,"reviewed_head":"$head","reviewed_tree":"$head_tree","base":"$EXPECTED_BASE","merge_commit":"$merge_commit","merge_tree":"$merge_tree"}
          EOF
          gh issue comment 251 --repo "$REPOSITORY" --body "Increment 5B3 / #303 is merged after the exact-head gate passed.\n\n- reviewed head: \`$head\`\n- reviewed tree: \`$head_tree\`\n- squash merge: \`$merge_commit\`\n- main tree: \`$merge_tree\`\n\nThe vector lane remains fixture/replay-only with zero external/model/embedding/provider calls and zero spend. Parent 5B remains open for 5B4 / #308."
          gh issue comment 308 --repo "$REPOSITORY" --body "Predecessor Increment 5B3 / #303 is now merged and closed completed on \`main@$merge_commit\` (tree \`$merge_tree\`). The canonical 5B4 implementation may begin from this exact base under its existing bounded admitted-graph contract."
          issue_state="$(gh issue view 303 --repo "$REPOSITORY" --json state --jq .state)"
          if [[ "$issue_state" != "CLOSED" ]]; then
            gh issue close 303 --repo "$REPOSITORY" --reason completed
          fi

      - name: Upload exact gate and merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5b3-final-gate-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/increment5b3-final-gate.json
            /tmp/increment5b3-merge-response.json
            /tmp/increment5b3-merge-receipt.json

      - name: Remove disposable support carriers after successful merge
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            support/materialize-increment-5b3-20260806 \
            support/publish-increment-5b3-v3-20260806 \
            support/finalize-increment-5b3-20260806
          do
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded" || true
          done
