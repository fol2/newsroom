name: Materialize Increment 3C chronology review

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Verify and apply exact chronology patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          manifest_path = root / '.github/increment-3c-chronology-manifest.json'
          payload_root = root / '.github/increment-3c-chronology-payload'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^'], text=True
          ).strip()
          if parent != manifest['parent_sha']:
              raise SystemExit(
                  f"staging parent {parent} differs from reviewed {manifest['parent_sha']}"
              )
          parent_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^^{tree}'], text=True
          ).strip()
          if parent_tree != manifest['local_base_tree']:
              raise SystemExit(
                  f"parent tree {parent_tree} differs from reviewed {manifest['local_base_tree']}"
              )

          expected_chunks = tuple(
              payload_root / f'part-{index:02d}.b64'
              for index in range(manifest['chunk_count'])
          )
          expected_staging = {
              '.github/increment-3c-chronology-manifest.json',
              '.github/workflows/materialize-increment-3c-chronology.yml',
              *(str(path.relative_to(root)) for path in expected_chunks),
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD'],
                  text=True,
              ).splitlines()
          )
          if changed != expected_staging:
              raise SystemExit(
                  f'staging commit inventory differs: {sorted(changed)!r}'
              )

          actual_chunks = tuple(sorted(payload_root.glob('part-*.b64')))
          if actual_chunks != expected_chunks:
              raise SystemExit('chronology payload chunk inventory differs')

          encoded_parts: list[str] = []
          for path in expected_chunks:
              text = path.read_text(encoding='ascii')
              actual_digest = hashlib.sha256(text.encode('ascii')).hexdigest()
              if actual_digest != manifest['chunk_sha256'][path.name]:
                  raise SystemExit(
                      f'chronology payload chunk digest differs: {path.name}'
                  )
              encoded_parts.append(text)
          encoded = ''.join(encoded_parts)
          if len(encoded) != manifest['base64_size']:
              raise SystemExit('chronology payload base64 size differs')

          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != manifest['gzip_size']:
              raise SystemExit('chronology payload gzip size differs')
          if hashlib.sha256(compressed).hexdigest() != manifest['gzip_sha256']:
              raise SystemExit('chronology payload gzip digest differs')

          patch = gzip.decompress(compressed)
          if len(patch) != manifest['raw_size']:
              raise SystemExit('chronology patch size differs')
          if hashlib.sha256(patch).hexdigest() != manifest['raw_sha256']:
              raise SystemExit('chronology patch digest differs')
          Path('/tmp/increment-3c-chronology.patch').write_bytes(patch)
          PY
          git apply --check /tmp/increment-3c-chronology.patch
          git apply /tmp/increment-3c-chronology.patch
          rm -rf \
            .github/increment-3c-chronology-manifest.json \
            .github/increment-3c-chronology-payload \
            .github/workflows/materialize-increment-3c-chronology.yml
          python -m compileall -q newsroom
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_contracts.py \
            newsroom/tests/test_check_3c_baselines.py \
            newsroom/tests/test_check_3c_transitions.py \
            newsroom/tests/test_check_3c_agenda.py \
            newsroom/tests/test_check_3c_findings.py \
            newsroom/tests/test_check_3c_transition_planning.py \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_check_3c_authority_store.py \
            newsroom/tests/test_check_3c_authority_integrity.py \
            newsroom/tests/test_check_3c_admission.py \
            newsroom/tests/test_check_3c_admission_findings.py \
            newsroom/tests/test_check_3c_model_policies.py \
            newsroom/tests/test_check_3c_concurrency.py \
            newsroom/tests/test_check_3c_semantic_chronology.py \
            newsroom/tests/test_check_3c_traceability.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified clean chronology authority
        shell: bash
        run: |
          set -euo pipefail
          expected_tree="$(git show HEAD:.github/increment-3c-chronology-manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["final_tree_sha"])')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          actual_tree="$(git write-tree)"
          if [ "${actual_tree}" != "${expected_tree}" ]; then
            echo "materialized tree ${actual_tree} differs from reviewed ${expected_tree}" >&2
            exit 1
          fi
          git commit -m 'fix(checks): order source history by Outcome authority'
          git push origin HEAD:agent/increment-3c-check-transition-authority
