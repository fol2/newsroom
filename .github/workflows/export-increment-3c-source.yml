name: Export Increment 3C source snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 1
          show-progress: false

      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf /tmp/newsroom-increment-3c-source.tgz .
          sha256sum /tmp/newsroom-increment-3c-source.tgz \
            > /tmp/newsroom-increment-3c-source.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newsroom-increment-3c-source-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/newsroom-increment-3c-source.tgz
            /tmp/newsroom-increment-3c-source.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
