name: Increment 3A SDLC margin repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-sdlc-margin.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-sdlc-margin-repair
  cancel-in-progress: true

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEO4J_B2_IMAGE: neo4j:2026.06.0-community-trixie
      NEO4J_URI: bolt://localhost:7687
      NEO4J_ADMIN_USERNAME: neo4j
      NEWSROOM_NEO4J_COMPLETE_SERVICE_REQUIRED: '1'
      NEWSROOM_NEO4J_DATABASE: neo4j
      NEWSROOM_NEO4J_INCREMENT_2D_SERVICE_REQUIRED: '1'
      NEWSROOM_NEO4J_PROJECTOR_USERNAME: newsroom_projector
      NEWSROOM_NEO4J_RETRIEVAL_SERVICE_REQUIRED: '1'
      NEWSROOM_NEO4J_SERVICE_REQUIRED: '1'
      NEWSROOM_NEO4J_URI: bolt://localhost:7687
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Remove source-integrity whitespace and reuse administrative driver
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one replacement, found {count}: {old!r}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          for name in (
              'docs/operations/increment-3a-source-registry.md',
              'docs/research/2026-07-27-increment-3a-substantive-review.md',
          ):
              path = Path(name)
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')

          path = 'newsroom/tests/test_complete_projection_2b_neo4j_service.py'
          replace_once(
              path,
              'from __future__ import annotations\n\nimport os\n',
              'from __future__ import annotations\n\nimport atexit\n'
              'from functools import lru_cache\n'
              'import os\n',
          )
          replace_once(
              path,
              'def _service_config() -> Neo4jProjectorConfig:\n',
              '@lru_cache(maxsize=1)\n'
              'def _service_config() -> Neo4jProjectorConfig:\n',
          )
          replace_once(
              path,
              'def _projector_driver():\n'
              '    from neo4j import GraphDatabase\n\n'
              '    config = _service_config()\n'
              '    return GraphDatabase.driver(\n'
              '        config.uri,\n'
              '        auth=(config.username, config.password),\n'
              '    )\n',
              '_PROJECTOR_ADMIN_DRIVER = None\n\n\n'
              'def _projector_driver():\n'
              '    global _PROJECTOR_ADMIN_DRIVER\n'
              '    if _PROJECTOR_ADMIN_DRIVER is None:\n'
              '        from neo4j import GraphDatabase\n\n'
              '        config = _service_config()\n'
              '        _PROJECTOR_ADMIN_DRIVER = GraphDatabase.driver(\n'
              '            config.uri,\n'
              '            auth=(config.username, config.password),\n'
              '        )\n'
              '        _PROJECTOR_ADMIN_DRIVER.verify_connectivity()\n'
              '    return _PROJECTOR_ADMIN_DRIVER\n\n\n'
              'def _close_projector_driver() -> None:\n'
              '    global _PROJECTOR_ADMIN_DRIVER\n'
              '    if _PROJECTOR_ADMIN_DRIVER is not None:\n'
              '        _PROJECTOR_ADMIN_DRIVER.close()\n'
              '        _PROJECTOR_ADMIN_DRIVER = None\n\n\n'
              'atexit.register(_close_projector_driver)\n',
          )
          replace_once(
              path,
              'def _projector_write(statement: str, **parameters) -> None:\n'
              '    driver = _projector_driver()\n'
              '    try:\n'
              '        with driver.session(database=_service_config().database) as session:\n'
              '            session.run(statement, parameters).consume()\n'
              '    finally:\n'
              '        driver.close()\n',
              'def _projector_write(statement: str, **parameters) -> None:\n'
              '    driver = _projector_driver()\n'
              '    with driver.session(database=_service_config().database) as session:\n'
              '        session.run(statement, parameters).consume()\n',
          )
          replace_once(
              path,
              'def _projector_scalar(statement: str, **parameters) -> int:\n'
              '    driver = _projector_driver()\n'
              '    try:\n'
              '        with driver.session(database=_service_config().database) as session:\n'
              '            record = session.run(statement, parameters).single(strict=True)\n'
              '            return int(record[0])\n'
              '    finally:\n'
              '        driver.close()\n',
              'def _projector_scalar(statement: str, **parameters) -> int:\n'
              '    driver = _projector_driver()\n'
              '    with driver.session(database=_service_config().database) as session:\n'
              '        record = session.run(statement, parameters).single(strict=True)\n'
              '        return int(record[0])\n',
          )
          PY
          python -m compileall -q newsroom
          git diff --check

      - name: Commit bounded SDLC margin repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs newsroom/tests/test_complete_projection_2b_neo4j_service.py
          git diff --cached --check
          git commit -m "test(neo4j): restore service-lane connection margin"
          git push origin HEAD:agent/increment-3a-source-registry

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'uv==0.8.0'
          uv lock --check
          uv sync --dev --locked

      - name: Generate masked credentials and start Neo4j
        run: |
          set -euo pipefail
          NEO4J_ADMIN_PASSWORD="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          NEWSROOM_NEO4J_PROJECTOR_PASSWORD="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "::add-mask::${NEO4J_ADMIN_PASSWORD}"
          echo "::add-mask::${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}"
          echo "NEO4J_ADMIN_PASSWORD=${NEO4J_ADMIN_PASSWORD}" >> "${GITHUB_ENV}"
          echo "NEWSROOM_NEO4J_PROJECTOR_PASSWORD=${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}" >> "${GITHUB_ENV}"
          timeout --signal=TERM --kill-after=5s 55s docker pull "${NEO4J_B2_IMAGE}"
          timeout --signal=TERM --kill-after=2s 10s docker run --detach --pull=never \
            --name newsroom-increment-3a-margin-neo4j \
            --publish 127.0.0.1:7687:7687 \
            --env "NEO4J_AUTH=neo4j/${NEO4J_ADMIN_PASSWORD}" \
            "${NEO4J_B2_IMAGE}"

      - name: Wait for authenticated Neo4j and create projector
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          uri = os.environ['NEO4J_URI']
          deadline = time.monotonic() + 25.0
          driver = None
          last_error = None
          while time.monotonic() < deadline:
              try:
                  driver = GraphDatabase.driver(
                      uri,
                      auth=(os.environ['NEO4J_ADMIN_USERNAME'], os.environ['NEO4J_ADMIN_PASSWORD']),
                      connection_timeout=1.0,
                  )
                  driver.verify_connectivity()
                  break
              except Exception as exc:
                  last_error = exc
                  if driver is not None:
                      driver.close()
                  driver = None
                  time.sleep(0.25)
          else:
              raise RuntimeError('authenticated Neo4j readiness timed out') from last_error

          assert driver is not None
          try:
              with driver.session(database='system') as session:
                  session.run(
                      'CREATE USER newsroom_projector IF NOT EXISTS '
                      'SET PLAINTEXT PASSWORD $password CHANGE NOT REQUIRED',
                      password=os.environ['NEWSROOM_NEO4J_PROJECTOR_PASSWORD'],
                  ).consume()
          finally:
              driver.close()

          projector = GraphDatabase.driver(
              uri,
              auth=(
                  os.environ['NEWSROOM_NEO4J_PROJECTOR_USERNAME'],
                  os.environ['NEWSROOM_NEO4J_PROJECTOR_PASSWORD'],
              ),
              connection_timeout=1.0,
          )
          try:
              projector.verify_connectivity()
          finally:
              projector.close()
          PY

      - name: Prove exact 32-case service lane within hard budget
        id: service
        continue-on-error: true
        run: |
          set +e
          start_ms="$(date +%s%3N)"
          timeout --signal=TERM --kill-after=1s 55s \
            uv run --no-sync python -m pytest -q \
              newsroom/tests/test_complete_projection_2b_neo4j_service.py \
              newsroom/tests/test_increment_2d_neo4j_service.py \
              newsroom/tests/test_integrated_c1_neo4j_service.py \
              newsroom/tests/test_projection_b2_neo4j_service.py \
              newsroom/tests/test_projection_b3_neo4j_service.py \
              newsroom/tests/test_retrieval_2c_neo4j_service.py \
              --junitxml=increment-3a-service-margin.xml \
              > increment-3a-service-margin.log 2>&1
          status="$?"
          end_ms="$(date +%s%3N)"
          elapsed_ms="$((end_ms - start_ms))"
          cat increment-3a-service-margin.log
          printf '%s\n' "${elapsed_ms}" > increment-3a-service-margin-ms.txt
          echo "elapsed_ms=${elapsed_ms}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('increment-3a-service-margin.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 32, len(cases)
          assert all(case.find('failure') is None for case in cases)
          assert all(case.find('error') is None for case in cases)
          assert all(case.find('skipped') is None for case in cases)
          PY

      - name: Upload timed service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-3a-service-margin-evidence
          path: |
            increment-3a-service-margin.xml
            increment-3a-service-margin.log
            increment-3a-service-margin-ms.txt
          if-no-files-found: error

      - name: Remove disposable Neo4j state
        if: always()
        run: |
          timeout --signal=TERM --kill-after=2s 10s \
            docker rm --force newsroom-increment-3a-margin-neo4j || true

      - name: Enforce timed service evidence
        if: steps.service.outcome != 'success'
        run: exit 1

      - name: Remove temporary proof workflow
        if: steps.service.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/increment-3a-sdlc-margin.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): remove Increment 3A SDLC margin proof"
          git push origin HEAD:agent/increment-3a-source-registry
