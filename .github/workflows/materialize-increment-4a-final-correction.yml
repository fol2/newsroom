name: Materialize final Increment 4A correction

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize-final-correction:
    if: github.event.pull_request.head.ref == 'agent/increment-4a-extraction-run-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact staged head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-4a-extraction-run-authority
          fetch-depth: 0
          show-progress: false
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Verify, apply, qualify and publish clean source
        shell: bash
        env:
          CLEAN_SHA: 66fb5cf1d501a41143658e0dae6d9a47d411dc0a
          EXPECTED_CLEAN_TREE: f7544bbd84d060ec37cf68e4a3a93d0e7735c4e1
          EXPECTED_FINAL_TREE: 372bbf76dccd032d852456eaa3bf1fb7349b5631
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          START_SHA="$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = 'agent/increment-4a-extraction-run-authority'
          test "$START_SHA" = '${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD^)" = "$CLEAN_SHA"
          test "$(git rev-parse HEAD^^{tree})" = "$EXPECTED_CLEAN_TREE"
          test -f .github/increment-4a-final-correction/patch.gz

          cp .github/increment-4a-final-correction/patch.gz \
            "$RUNNER_TEMP/increment-4a-final-correction.patch.gz"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-final-correction.patch.gz")" -eq 7269
          printf '%s  %s\n' \
            'bf4311e89796c0c1b3070e8fc384f7cbae7ac98cbd5232d87caef18b2b7dda47' \
            "$RUNNER_TEMP/increment-4a-final-correction.patch.gz" \
            | sha256sum --check --strict -

          gzip --decompress --stdout \
            "$RUNNER_TEMP/increment-4a-final-correction.patch.gz" \
            > "$RUNNER_TEMP/increment-4a-final-correction.patch"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-final-correction.patch")" -eq 25261
          printf '%s  %s\n' \
            '6190c4a5783613338e70ba859c74b4c94624a2328fcc7b5a48f5d7890ade2f46' \
            "$RUNNER_TEMP/increment-4a-final-correction.patch" \
            | sha256sum --check --strict -

          git apply --check "$RUNNER_TEMP/increment-4a-final-correction.patch"
          git apply "$RUNNER_TEMP/increment-4a-final-correction.patch"
          rm -rf .github/increment-4a-final-correction
          rm -f .github/workflows/materialize-increment-4a-final-correction.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache

          git diff --check
          python -m compileall -q newsroom scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          uv lock --check
          uv sync --dev --locked

          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_extraction_4a_*.py \
            newsroom/tests/test_authority_a2a_extraction.py \
            newsroom/tests/test_authority_a2b_extraction.py \
            newsroom/tests/test_discovery_3d_migrations.py \
            newsroom/tests/test_projection_b1_migrations.py \
            -W error::ResourceWarning \
            --junitxml="$RUNNER_TEMP/increment-4a-final-focused.xml"

          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          test ! -e .github/increment-4a-final-correction
          test ! -e .github/workflows/materialize-increment-4a-final-correction.yml
          git add -A
          git diff --cached --check
          ACTUAL_TREE="$(git write-tree)"
          printf 'actual_tree=%s\nexpected_final_tree=%s\n' \
            "$ACTUAL_TREE" "$EXPECTED_FINAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_FINAL_TREE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(sdlc): run core gates concurrently on native workers'
          git push \
            --force-with-lease=refs/heads/agent/increment-4a-extraction-run-authority:"$START_SHA" \
            origin HEAD:agent/increment-4a-extraction-run-authority
