name: CI

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Lockfile Check
        run: uv lock --check

      - name: Sync (Dev)
        run: uv sync --dev --locked

      - name: Tests
        run: uv run python -m pytest -q

      - name: Clustering Eval Gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

  diagnose-increment-3b-sdlc:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 211
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Re-verify exact failed core transport with exception chain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          import traceback

          from scripts.sdlc.artifact_envelope import GithubRunContext
          from scripts.sdlc.contracts import load_contract
          from scripts.sdlc.github_transport import GitHubActionsClient, fetch_artifact_bundle
          from scripts.sdlc.shadow_lane import verify_shadow_lane

          root = Path('.').resolve()
          target = root / '.sdlc-diagnostic'
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(mode=0o700)
          context = GithubRunContext(
              repository='fol2/newsroom',
              repository_id=1153895518,
              head_repository='fol2/newsroom',
              head_repository_id=1153895518,
              run_id=30282472707,
              run_attempt=1,
              job_id='decision',
              workflow_ref='fol2/newsroom/.github/workflows/evidence.yml@refs/pull/211/merge',
              workflow_sha='61089c59627c7eec454831cb33706c86b9bacd48',
              event_name='pull_request',
              event_sha='61089c59627c7eec454831cb33706c86b9bacd48',
              evaluated_sha='477bdf2cde259790551c420141782d34c0fcb36f',
              evaluated_tree_sha='42b38109420f3ca5958e36a07aa6e9592d33103d',
              ref='refs/pull/211/merge',
              runner_environment='github-hosted',
          )
          client = GitHubActionsClient.from_environment(timeout_seconds=5.0)
          fetch_artifact_bundle(
              client=client,
              output_parent=target,
              output_name='core-transport',
              run_id=context.run_id,
              run_attempt=context.run_attempt,
              artifact_name='newsroom-sdlc-30282472707-1-core-477bdf2cde259790551c420141782d34c0fcb36f',
          )
          try:
              record = verify_shadow_lane(
                  repo_root=root,
                  bundle_root=target / 'core-transport',
                  lane_id='core',
                  decision_context=context,
                  contract=load_contract(root),
              )
          except BaseException as exc:
              print('DIAGNOSTIC_EXCEPTION_CHAIN_BEGIN')
              current = exc
              depth = 0
              while current is not None and depth < 16:
                  print(f'{depth}:{type(current).__module__}.{type(current).__qualname__}:{current!s}')
                  current = current.__cause__ or current.__context__
                  depth += 1
              print('DIAGNOSTIC_EXCEPTION_CHAIN_END')
              traceback.print_exc()
              raise
          else:
              print('DIAGNOSTIC_VERIFICATION_PASS')
              print(record.as_dict())
          finally:
              shutil.rmtree(target, ignore_errors=True)
          PY
