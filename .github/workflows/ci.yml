name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  materialise-worksteal:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/sdlc-core-worksteal-scheduler' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact support branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/sdlc-core-worksteal-scheduler
          fetch-depth: 0
          show-progress: false

      - name: Apply, clean and push exact scheduler correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lane = Path("scripts/sdlc/workflow_lane.py")
          source = lane.read_text(encoding="utf-8")
          old = '_CORE_WORKER_COUNT = 8\n_CORE_DISTRIBUTION = "loadfile"\n'
          new = '_CORE_WORKER_COUNT = 6\n_CORE_DISTRIBUTION = "worksteal"\n'
          if source.count(old) != 1:
              raise SystemExit("expected exactly one eight-worker loadfile contract")
          lane.write_text(source.replace(old, new, 1), encoding="utf-8")

          existing = Path("newsroom/tests/test_sdlc_workflow_lane.py")
          source = existing.read_text(encoding="utf-8")
          replacements = {
              'assert lane_module._CORE_DISTRIBUTION == "loadfile"':
                  'assert lane_module._CORE_DISTRIBUTION == "worksteal"',
              '"--dist=loadfile",': '"--dist=worksteal",',
              'assert "--dist=loadfile" in command':
                  'assert "--dist=worksteal" in command',
          }
          for old_text, new_text in replacements.items():
              if source.count(old_text) < 1:
                  raise SystemExit(f"missing expected test contract: {old_text}")
              source = source.replace(old_text, new_text)
          existing.write_text(source, encoding="utf-8")

          Path("newsroom/tests/test_sdlc_core_worker_capacity.py").write_text(
              '''from __future__ import annotations

from pathlib import Path

import scripts.sdlc.workflow_lane as lane_module


def test_core_lane_uses_six_persistent_worksteal_workers(
    tmp_path: Path,
) -> None:
    assert lane_module._CORE_WORKER_COUNT == 6
    assert lane_module._CORE_DISTRIBUTION == "worksteal"

    command = lane_module._core_worker_command(
        report=tmp_path / "pytest.xml",
        basetemp=tmp_path / "pytest",
    )

    worker_flag = command.index("-n")
    assert command[worker_flag + 1] == "6"
    assert "--dist=worksteal" in command
    assert "--max-worker-restart=0" in command
    assert command.count("xdist.plugin") == 1
    assert command.count("newsroom/tests") == 1
''',
              encoding="utf-8",
          )

          Path(".github/temp-sdlc-worksteal-trigger").unlink(missing_ok=True)
          Path(".github/workflows/temp-sdlc-worksteal-materialise.yml").unlink(missing_ok=True)
          PY

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python -m compileall -q newsroom scripts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(sdlc): schedule core tests by work stealing"
          git push origin HEAD:agent/sdlc-core-worksteal-scheduler

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Lockfile Check
        run: uv lock --check

      - name: Sync (Dev)
        run: uv sync --dev --locked

      - name: Tests
        run: uv run python -m pytest -q

      - name: Clustering Eval Gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression
