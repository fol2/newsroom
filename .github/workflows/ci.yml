name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Lockfile Check
        run: uv lock --check

      - name: Sync (Dev)
        run: uv sync --dev --locked

      - name: Tests
        run: uv run python -m pytest -q

      - name: Clustering Eval Gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

  materialize-increment-3b:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/increment-3b-generic-adapters'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact Increment 3B branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3b-generic-adapters
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct and validate reviewed payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if test -f newsroom/discovery_adapters/traceability.py; then
            echo "needed=false" >> "${GITHUB_OUTPUT}"
            echo "Increment 3B corpus is already materialized."
            exit 0
          fi
          echo "needed=true" >> "${GITHUB_OUTPUT}"
          payload="${RUNNER_TEMP}/increment-3b-payload.tar.gz"
          extracted="${RUNNER_TEMP}/increment-3b-extracted"
          cat .github/increment-3b-payload/part-* | tr -d '\r\n' | base64 --decode > "${payload}"
          echo "ed60bc3e29db91444e68601cf5e91d8ba7b01671e3b61e78bce85541ec985afa  ${payload}" | sha256sum --check --strict
          PAYLOAD="${payload}" EXTRACTED="${extracted}" python - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import tarfile

          expected = {
              "docs/operations/increment-3b-fixture-adapters.md",
              "newsroom/discovery_adapters/__init__.py",
              "newsroom/discovery_adapters/compression.py",
              "newsroom/discovery_adapters/models.py",
              "newsroom/discovery_adapters/parsers.py",
              "newsroom/discovery_adapters/runner.py",
              "newsroom/discovery_adapters/security.py",
              "newsroom/discovery_adapters/traceability.py",
              "newsroom/discovery_adapters/types.py",
              "newsroom/tests/discovery_adapter_3b_helpers.py",
              "newsroom/tests/fixtures/discovery_adapters/atom-feed-v1.xml",
              "newsroom/tests/fixtures/discovery_adapters/json-items-v1.json",
              "newsroom/tests/fixtures/discovery_adapters/maintained-guidance-v1.html",
              "newsroom/tests/fixtures/discovery_adapters/malformed-json-duplicate-key.json",
              "newsroom/tests/fixtures/discovery_adapters/rss-feed-v1.xml",
              "newsroom/tests/fixtures/discovery_adapters/unsafe-xml-entity.xml",
              "newsroom/tests/test_discovery_adapter_3b_contracts.py",
              "newsroom/tests/test_discovery_adapter_3b_parsers.py",
              "newsroom/tests/test_discovery_adapter_3b_runner.py",
              "newsroom/tests/test_discovery_adapter_3b_security.py",
              "newsroom/tests/test_discovery_adapter_3b_traceability.py",
          }
          payload = Path(os.environ["PAYLOAD"])
          extracted = Path(os.environ["EXTRACTED"])
          extracted.mkdir(mode=0o700)
          with tarfile.open(payload, mode="r:gz") as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit("payload path inventory differs from the reviewed manifest")
              for member in members:
                  path = Path(member.name)
                  if (
                      not member.isfile()
                      or path.is_absolute()
                      or ".." in path.parts
                      or member.size > 1_000_000
                  ):
                      raise SystemExit(f"unsafe payload member: {member.name}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"payload member has no bytes: {member.name}")
                  destination = extracted / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  destination.chmod(0o644)
          for relative in sorted(expected):
              source = extracted / relative
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY
          python -m compileall -q newsroom
          git diff --check

      - name: Commit and push verified Increment 3B corpus
        id: commit
        if: steps.payload.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            set -x
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git status --short
            git add -- \
              docs/operations/increment-3b-fixture-adapters.md \
              newsroom/discovery_adapters \
              newsroom/tests/discovery_adapter_3b_helpers.py \
              newsroom/tests/fixtures/discovery_adapters \
              newsroom/tests/test_discovery_adapter_3b_contracts.py \
              newsroom/tests/test_discovery_adapter_3b_security.py \
              newsroom/tests/test_discovery_adapter_3b_parsers.py \
              newsroom/tests/test_discovery_adapter_3b_runner.py \
              newsroom/tests/test_discovery_adapter_3b_traceability.py
            git status --short
            git diff --cached --check
            git commit -m "feat(adapters): add bounded fixture corpus and outcome evidence"
            git rev-parse HEAD
            git push --verbose origin HEAD:agent/increment-3b-generic-adapters
          } > increment-3b-commit-diagnostic.log 2>&1
          status=$?
          cat increment-3b-commit-diagnostic.log
          exit "${status}"

      - name: Upload materializer push diagnostic
        if: steps.commit.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: increment-3b-materializer-push-diagnostic
          path: increment-3b-commit-diagnostic.log
          if-no-files-found: error

      - name: Enforce materializer push
        if: steps.commit.outcome != 'success'
        run: exit 1
