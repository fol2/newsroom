name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  increment4-final-review-correction:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/increment-4e-corrective-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Apply exact review corrections
        run: python scripts/tmp_increment4_final_review_fixes.py

      - name: Sync locked development environment
        run: uv sync --dev --locked

      - name: Run focused authority regressions
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_increment4e_alias_rights_snapshot.py \
            newsroom/tests/test_increment4e_mutation_authorization.py \
            newsroom/tests/test_increment4e_corrective_hardening.py \
            newsroom/tests/test_increment4e_neo4j_controller.py

      - name: Restore permanent CI and publish clean correction
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Install uv
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install uv

                - name: Lockfile Check
                  run: uv lock --check

                - name: Sync (Dev)
                  run: uv sync --dev --locked

                - name: Tests
                  run: uv run python -m pytest -q

                - name: Clustering Eval Gate
                  run: |
                    uv run python scripts/eval_clustering_metrics.py \
                      --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
                      --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
                      --fail-on-regression
          YAML
          rm scripts/tmp_increment4_final_review_fixes.py
          rm -f .github/workflows/tmp-increment4-final-review-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(increment4): close final authority review gaps'
          git push origin HEAD:agent/increment-4e-corrective-hardening

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Lockfile Check
        run: uv lock --check

      - name: Sync (Dev)
        run: uv sync --dev --locked

      - name: Tests
        run: uv run python -m pytest -q

      - name: Clustering Eval Gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression
