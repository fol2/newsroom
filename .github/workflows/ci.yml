name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Lockfile Check
        run: uv lock --check

      - name: Sync (Dev)
        run: uv sync --dev --locked

      - name: Tests
        run: uv run python -m pytest -q

      - name: Clustering Eval Gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

  increment-1c-integrity-publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/increment-1c-integrity-qualify' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'fol2/newsroom'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-1c-integrity-qualify
          path: .qualifier
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Increment 1C target
        uses: actions/checkout@v4
        with:
          ref: agent/increment-1c-integrated-foundation
          path: .target
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up exact uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: .target/uv.lock

      - name: Correct, qualify and publish integrity bindings
        shell: bash
        working-directory: .target
        run: |
          set -euxo pipefail
          diagnostic="${RUNNER_TEMP}/increment-1c-integrity-qualifier.log"
          exec > >(tee "${diagnostic}") 2>&1
          expected_head="3c8dec9d66e9c794376a20e9ef839e285a341b2f"
          test "$(git rev-parse HEAD)" = "${expected_head}"
          python ../.qualifier/.sdlc/increment_1c_integrity_qualify.py

          actual_files="$(git diff --name-only | sort)"
          expected_files="$(printf '%s\n' \
            newsroom/authority/_integrated_store.py \
            newsroom/integrated/models.py \
            newsroom/integrated/proof.py | sort)"
          test "${actual_files}" = "${expected_files}"
          git diff --check
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_integrated_c1_contracts.py \
            newsroom/tests/test_integrated_c1_policy.py \
            newsroom/tests/test_integrated_c1_candidate_authority.py \
            newsroom/tests/test_integrated_c1_proof_integrity.py
          uv run --no-sync python -m pytest -q newsroom/tests
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            newsroom/authority/_integrated_store.py \
            newsroom/integrated/models.py \
            newsroom/integrated/proof.py
          git commit -m 'fix(integrated): bind proof authority state'

          remote_head="$(git ls-remote origin refs/heads/agent/increment-1c-integrated-foundation | cut -f1)"
          test "${remote_head}" = "${expected_head}"
          git push \
            --force-with-lease=refs/heads/agent/increment-1c-integrated-foundation:${expected_head} \
            origin HEAD:agent/increment-1c-integrated-foundation

      - name: Upload qualifier diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-1c-integrity-qualifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/increment-1c-integrity-qualifier.log
          if-no-files-found: warn
          retention-days: 1
