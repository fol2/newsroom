name: Graphiti Research

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "docs/research/**"
      - "scripts/graphiti_combined_temporal_extraction.py"
      - "scripts/graphiti_deterministic_work.py"
      - "scripts/graphiti_runtime_calibration.py"
      - "newsroom/tests/test_graphiti_core_0293_*.py"
      - "newsroom/tests/test_graphiti_sdk_no_tool_calibration.py"
      - "newsroom/tests/test_graphiti_combined_temporal_*.py"
      - "newsroom/tests/test_graphiti_donor_identities.py"
      - "newsroom/tests/test_graphiti_deterministic_work.py"
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphiti-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: provider-free-graphiti-research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv once
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: newsroom-graphiti-research-py312
          save-cache: false

      - name: Prepare Graphiti research environment once
        run: |
          uv lock --check
          uv sync --dev --extra graphiti --locked

      - name: Verify pinned Graphiti dependency
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata

          version = importlib.metadata.version("graphiti-core")
          if version != "0.29.3":
              raise SystemExit(f"expected graphiti-core 0.29.3, got {version}")
          PY

      - name: Run provider-free research fixtures
        run: |
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_graphiti_core_0293_call_shape.py \
            newsroom/tests/test_graphiti_core_0293_nonzero_combined_call_shape.py \
            newsroom/tests/test_graphiti_sdk_no_tool_calibration.py \
            newsroom/tests/test_graphiti_combined_temporal_extraction.py \
            newsroom/tests/test_graphiti_combined_temporal_pipeline.py \
            newsroom/tests/test_graphiti_combined_temporal_runtime.py \
            newsroom/tests/test_graphiti_donor_identities.py \
            newsroom/tests/test_graphiti_deterministic_work.py \
            --junitxml=graphiti-research.xml

      - name: Verify combined-temporal research pin
        run: uv run --no-sync python scripts/graphiti_combined_temporal_extraction.py

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graphiti-research-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: graphiti-research.xml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
