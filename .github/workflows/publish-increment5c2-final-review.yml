name: Publish final Increment 5C2 review correction

on:
  push:
    branches: [support/publish-increment5c2-final-review-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-final-increment5c2-review
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/publish-increment5c2-final-review-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Inspect exact patch parts
        run: |
          set -euo pipefail
          # Previous diagnostics split three canonical chunks into smaller files.
          # They are support-only and never contribute bytes to the bound patch.
          find scripts/support/patches -type f \
            -name 'increment5c2_final_review.patch.b64.part??.??' -delete
          wc -c scripts/support/patches/increment5c2_final_review.patch.b64.part*
          sha256sum scripts/support/patches/increment5c2_final_review.patch.b64.part*
      - name: Reassemble, verify and publish exact correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/support/publish_increment5c2_final_review.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5c2-final-review-correction-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5c2-final-review-corrections.patch
            /tmp/increment5c2-final-review-focused.log
            /tmp/increment5c2-final-review-full.log
            /tmp/increment5c2-final-review-clustering.log
            /tmp/increment5c2-final-review-receipt.json
