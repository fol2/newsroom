name: Materialize reviewed final Increment 4A source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize-final-source:
    if: github.event.pull_request.head.ref == 'agent/increment-4a-extraction-run-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact staged head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-4a-extraction-run-authority
          fetch-depth: 0
          show-progress: false
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Verify, apply, qualify and publish exact clean tree
        shell: bash
        env:
          BASE_SHA: a220e7f8eaa924e99696ba1972aced5885f39b58
          BASE_TREE: 372bbf76dccd032d852456eaa3bf1fb7349b5631
          FINAL_TREE: e5b3a68605a53c2c0ef89d152555f4d50a760940
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          set -euxo pipefail
          START_SHA="$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = 'agent/increment-4a-extraction-run-authority'
          test "$START_SHA" = '${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse 'HEAD^^{tree}')" = "$BASE_TREE"

          mapfile -t staged < <(git diff --name-only "$BASE_SHA" "$START_SHA" | LC_ALL=C sort)
          printf 'staged_paths=%s\n' "${staged[*]}"
          test "${#staged[@]}" -eq 5
          test "${staged[0]}" = '.github/increment-4a-final-materialize/part-00'
          test "${staged[1]}" = '.github/increment-4a-final-materialize/part-01'
          test "${staged[2]}" = '.github/increment-4a-final-materialize/part-02'
          test "${staged[3]}" = '.github/increment-4a-final-materialize/part-03'
          test "${staged[4]}" = '.github/workflows/materialize-increment-4a-reviewed-final.yml'

          for spec in \
            'part-00 a5d9a61ba4765fae927c6a824bf51e305f7fe0f0b1bac4eb5e3a8e91bb2508c1' \
            'part-01 df9b1169591f50a39ebb9ce585d259299ad7d7b443b8d66a6b6266ad5aecc674' \
            'part-02 71d415404a1f82fa6c2e517d0e1aabbabb11b6988f88f13acdb0526844c32c46' \
            'part-03 d757b247aa20c5b8c274e6582ce893f9550d4ac58f291baf5296195688c4fa0c'
          do
            set -- $spec
            path=".github/increment-4a-final-materialize/$1"
            test "$(wc -c < "$path")" -eq 4668
            printf '%s  %s\n' "$2" "$path" | sha256sum --check --strict -
          done

          cat \
            .github/increment-4a-final-materialize/part-00 \
            .github/increment-4a-final-materialize/part-01 \
            .github/increment-4a-final-materialize/part-02 \
            .github/increment-4a-final-materialize/part-03 \
            > "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz.b64")" -eq 18672
          printf '%s  %s\n' \
            '9c26268d0bd6e7031577036f8afe38943e0a0baa4dd96172610278c669e53836' \
            "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz.b64" \
            | sha256sum --check --strict -

          base64 --decode "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz.b64" \
            > "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz")" -eq 14003
          printf '%s  %s\n' \
            '581fb6d50f68dc90eb8013f2de7ac9da4b8d5b00ee26ca582f4b75a8f7d42d0c' \
            "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz" \
            | sha256sum --check --strict -

          gzip --decompress --stdout "$RUNNER_TEMP/increment-4a-reviewed-final.patch.gz" \
            > "$RUNNER_TEMP/increment-4a-reviewed-final.patch"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-reviewed-final.patch")" -eq 51430
          printf '%s  %s\n' \
            '659e426d5a42f699b250e098ad681c303d3539849a6a4d3640c734db6cb5fc45' \
            "$RUNNER_TEMP/increment-4a-reviewed-final.patch" \
            | sha256sum --check --strict -

          git apply --check "$RUNNER_TEMP/increment-4a-reviewed-final.patch"
          git apply "$RUNNER_TEMP/increment-4a-reviewed-final.patch"
          rm -rf .github/increment-4a-final-materialize
          rm -f .github/workflows/materialize-increment-4a-reviewed-final.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache

          git diff --check
          python -m compileall -q newsroom scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          uv lock --check
          uv sync --dev --locked

          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_extraction_4a_*.py \
            newsroom/tests/test_authority_a2a_extraction.py \
            newsroom/tests/test_authority_a2b_extraction.py \
            newsroom/tests/test_discovery_3d_migrations.py \
            newsroom/tests/test_projection_b1_migrations.py \
            -W error::ResourceWarning \
            --junitxml="$RUNNER_TEMP/increment-4a-reviewed-focused.xml"

          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          test ! -e .github/increment-4a-final-materialize
          test ! -e .github/workflows/materialize-increment-4a-reviewed-final.yml
          git add -A
          git diff --cached --check
          ACTUAL_TREE="$(git write-tree)"
          printf 'actual_tree=%s\nexpected_final_tree=%s\n' "$ACTUAL_TREE" "$FINAL_TREE"
          test "$ACTUAL_TREE" = "$FINAL_TREE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(extraction): complete reviewed Increment 4A authority'
          git push \
            --force-with-lease=refs/heads/agent/increment-4a-extraction-run-authority:"$START_SHA" \
            origin HEAD:agent/increment-4a-extraction-run-authority
