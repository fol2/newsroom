name: Diagnose Increment 3E persistent core worker counts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Materialize the persistent-worker candidate in the disposable checkout
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/increment-3e-persistent-core-apply.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  "    '''def test_core_test_inventory_is_sorted_complete_and_rejects_symlinks(",
                  "    r'''def test_core_test_inventory_is_sorted_complete_and_rejects_symlinks(",
              ),
              (
                  "    '''def test_persistent_core_runner_invokes_one_session_and_propagates_failure(",
                  "    r'''def test_persistent_core_runner_invokes_one_session_and_propagates_failure(",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected apply-script string marker: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          uv run python .github/increment-3e-persistent-core-apply.py
          uv lock
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_discovery_projection_3e_health_chronology.py \
            newsroom/tests/test_discovery_projection_3e_health.py \
            newsroom/tests/test_integrated_c1_workflow_contract.py \
            newsroom/tests/test_sdlc_workflow_orchestrator.py
          git diff --check

      - name: Measure persistent worker counts on the full exact inventory
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          uv run --no-sync python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          proof_root = root / '.increment-3e-worker-count-diagnostics'
          if proof_root.exists() or proof_root.is_symlink():
              raise SystemExit('diagnostic root already exists')
          proof_root.mkdir()

          results: list[dict[str, object]] = []
          for workers in (6, 8, 10, 12):
              run_root = proof_root / f'workers-{workers:02d}'
              run_root.mkdir()
              report = run_root / 'pytest.xml'
              basetemp = run_root / 'pytest-temp'
              command = (
                  sys.executable,
                  '-m',
                  'pytest',
                  '-q',
                  '--assert=plain',
                  '-p',
                  'no:cacheprovider',
                  '-p',
                  'xdist.plugin',
                  '-n',
                  str(workers),
                  '--dist=loadfile',
                  '--max-worker-restart=0',
                  'newsroom/tests',
                  f'--basetemp={basetemp}',
                  f'--junitxml={report}',
              )
              started = time.monotonic()
              timed_out = False
              try:
                  completed = subprocess.run(
                      command,
                      cwd=root,
                      env=os.environ.copy(),
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      check=False,
                      timeout=75,
                  )
                  returncode = completed.returncode
                  output = completed.stdout.decode('utf-8', errors='replace')
              except subprocess.TimeoutExpired as exc:
                  timed_out = True
                  returncode = 124
                  raw = exc.stdout or b''
                  output = raw.decode('utf-8', errors='replace')
              elapsed = round(time.monotonic() - started, 3)

              test_count = 0
              failure_count = 0
              error_count = 0
              skip_count = 0
              if report.is_file() and not report.is_symlink():
                  document = ET.parse(report).getroot()
                  test_count = len(tuple(document.iter('testcase')))
                  failure_count = len(tuple(document.iter('failure')))
                  error_count = len(tuple(document.iter('error')))
                  skip_count = len(tuple(document.iter('skipped')))

              result = {
                  'workers': workers,
                  'elapsed_seconds': elapsed,
                  'returncode': returncode,
                  'timed_out': timed_out,
                  'test_count': test_count,
                  'failure_count': failure_count,
                  'error_count': error_count,
                  'skip_count': skip_count,
                  'output_tail': output[-1200:],
              }
              results.append(result)
              print(json.dumps(result, sort_keys=True), flush=True)

          shutil.rmtree(proof_root)
          valid = [
              item
              for item in results
              if item['returncode'] == 0
              and item['test_count'] >= 1500
              and item['failure_count'] == 0
              and item['error_count'] == 0
          ]
          print(json.dumps({'results': results, 'valid': valid}, sort_keys=True), flush=True)
          if not valid:
              raise SystemExit('no persistent worker count completed the exact inventory')
          PY
