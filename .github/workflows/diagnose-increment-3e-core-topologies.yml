name: Diagnose Increment 3E core topologies

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Measure repository-owned shard runner
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import tempfile
          import time

          from scripts.sdlc import workflow_lane

          root = Path.cwd()
          summaries = []
          for shard_count, workers in ((16, 5), (24, 5), (32, 5), (32, 6)):
              workflow_lane._CORE_SHARD_COUNT = shard_count
              workflow_lane._CORE_WORKER_COUNT = workers
              with tempfile.TemporaryDirectory(prefix='newsroom-topology-') as raw:
                  report = Path(raw) / 'pytest.xml'
                  started = time.monotonic()
                  code = workflow_lane._run_core_pytest_shards(
                      root=root,
                      report=report,
                  )
                  summary = {
                      'shard_count': shard_count,
                      'workers': workers,
                      'wall_seconds': round(time.monotonic() - started, 3),
                      'returncode': code,
                  }
                  summaries.append(summary)
                  print(json.dumps(summary, sort_keys=True), flush=True)
                  if code:
                      raise SystemExit(code)
          print(json.dumps({'summaries': summaries}, sort_keys=True), flush=True)
          PY
