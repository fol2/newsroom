name: Apply Increment 3E permanent six-worker core

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked tooling
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Apply the measured permanent correction
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/increment-3e-persistent-core-apply.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  "    '''def test_core_test_inventory_is_sorted_complete_and_rejects_symlinks(",
                  "    r'''def test_core_test_inventory_is_sorted_complete_and_rejects_symlinks(",
              ),
              (
                  "    '''def test_persistent_core_runner_invokes_one_session_and_propagates_failure(",
                  "    r'''def test_persistent_core_runner_invokes_one_session_and_propagates_failure(",
              ),
              (
                  "'_CORE_WORKER_COUNT = 4\\n_CORE_DISTRIBUTION = \"loadfile\"\\n'",
                  "'_CORE_WORKER_COUNT = 6\\n_CORE_DISTRIBUTION = \"loadfile\"\\n'",
              ),
              (
                  '    assert lane_module._CORE_WORKER_COUNT == 4\n',
                  '    assert lane_module._CORE_WORKER_COUNT == 6\n',
              ),
              (
                  '        "4",\n',
                  '        "6",\n',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected apply-script marker: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          uv run python .github/increment-3e-persistent-core-apply.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(
                      f'expected one exact replacement in {path}: {old[:100]!r}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_span(
              path: Path,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              text = path.read_text(encoding='utf-8')
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0 or text.find(start_marker, start + 1) >= 0:
                  raise SystemExit(
                      f'unable to select one exact span in {path}: {start_marker!r}'
                  )
              path.write_text(
                  text[:start] + replacement + text[end:],
                  encoding='utf-8',
              )

          lane = Path('scripts/sdlc/workflow_lane.py')
          replace_span(
              lane,
              'def _core_worker_command(',
              'def _run_pytest_shard(',
              '''def _core_worker_command(
              *,
              report: Path,
              basetemp: Path,
          ) -> tuple[str, ...]:
              test_paths = tuple(_CORE_TESTS)
              if test_paths != ("newsroom/tests",):
                  raise WorkflowLaneError("core_test_topology")
              return (
                  sys.executable,
                  "-m",
                  "pytest",
                  "-q",
                  "--assert=plain",
                  "-p",
                  "no:cacheprovider",
                  "-p",
                  "xdist.plugin",
                  "-n",
                  str(_CORE_WORKER_COUNT),
                  f"--dist={_CORE_DISTRIBUTION}",
                  "--max-worker-restart=0",
                  *test_paths,
                  f"--basetemp={basetemp}",
                  f"--junitxml={report}",
              )


          ''',
          )
          replace_once(
              lane,
              '''    test_files = _core_test_files(root)
              with tempfile.TemporaryDirectory(prefix="newsroom-core-workers-") as raw_temp:
                  command = _core_worker_command(
                      test_files=test_files,
                      report=report,
                      basetemp=Path(raw_temp) / "pytest",
                  )
          ''',
              '''    _core_test_files(root)
              with tempfile.TemporaryDirectory(prefix="newsroom-core-workers-") as raw_temp:
                  command = _core_worker_command(
                      report=report,
                      basetemp=Path(raw_temp) / "pytest",
                  )
          ''',
          )

          tests = Path('newsroom/tests/test_sdlc_workflow_lane.py')
          replace_span(
              tests,
              'def test_core_worker_command_is_pinned_persistent_and_file_scoped(',
              'def test_persistent_core_dependency_is_exactly_pinned(',
              '''def test_core_worker_command_is_pinned_persistent_and_file_scoped(
              tmp_path: Path,
          ) -> None:
              report = tmp_path / "report.xml"
              basetemp = tmp_path / "basetemp"
              command = lane_module._core_worker_command(
                  report=report,
                  basetemp=basetemp,
              )

              assert lane_module._CORE_WORKER_COUNT == 6
              assert lane_module._CORE_DISTRIBUTION == "loadfile"
              assert command[:13] == (
                  sys.executable,
                  "-m",
                  "pytest",
                  "-q",
                  "--assert=plain",
                  "-p",
                  "no:cacheprovider",
                  "-p",
                  "xdist.plugin",
                  "-n",
                  "6",
                  "--dist=loadfile",
                  "--max-worker-restart=0",
              )
              assert command[13:14] == lane_module._CORE_TESTS == (
                  "newsroom/tests",
              )
              assert command[-2:] == (
                  f"--basetemp={basetemp}",
                  f"--junitxml={report}",
              )


          ''',
          )
          PY
          uv lock
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_discovery_projection_3e_health_chronology.py \
            newsroom/tests/test_discovery_projection_3e_health.py \
            newsroom/tests/test_integrated_c1_workflow_contract.py \
            newsroom/tests/test_sdlc_workflow_orchestrator.py
          git diff --check

      - name: Prove the exact full core command twice within bounded margin
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            proof_root=".increment-3e-core-proof-${attempt}"
            mkdir "${proof_root}"
            timeout --signal=TERM --kill-after=2s 52s \
              uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
                --repo-root . \
                --report "${proof_root}/pytest.xml"
            PROOF_ROOT="${proof_root}" uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ['PROOF_ROOT']) / 'pytest.xml'
          document = ET.parse(report).getroot()
          cases = tuple(document.iter('testcase'))
          assert len(cases) >= 1_500, len(cases)
          assert not tuple(document.iter('failure'))
          assert not tuple(document.iter('error'))
          PY
            rm -rf "${proof_root}"
          done

      - name: Publish permanent code only
        run: |
          set -euo pipefail
          rm .github/increment-3e-persistent-core-apply.py
          rm .github/workflows/diagnose-increment-3e-core-topologies.yml
          rm -f .github/.increment-3e-persistent-core-trigger
          test ! -e .github/workflows/finalize-increment-3-20260729.yml
          test ! -e .github/increment-3e-stable-response.patch.gz.b64
          git config user.name newsroom-ci
          git config user.email newsroom-ci@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git commit -m "perf(sdlc): use persistent file-scoped core workers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
