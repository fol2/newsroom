name: Diagnose Increment 3E core hotspots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Measure repository-owned core hotspots
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          uv run python - <<'PY'
          from collections import defaultdict
          import json
          from pathlib import Path
          import tempfile
          import time
          import xml.etree.ElementTree as ET

          from scripts.sdlc import workflow_lane

          root = Path.cwd()
          workflow_lane._CORE_SHARD_COUNT = 16
          workflow_lane._CORE_WORKER_COUNT = 5
          with tempfile.TemporaryDirectory(
              prefix='.newsroom-hotspots-',
              dir=root,
          ) as raw:
              report = Path(raw) / 'pytest.xml'
              started = time.monotonic()
              code = workflow_lane._run_core_pytest_shards(
                  root=root,
                  report=report,
              )
              wall_seconds = round(time.monotonic() - started, 3)
              if code:
                  raise SystemExit(code)

              document = ET.parse(report).getroot()
              cases = []
              modules = defaultdict(float)
              for case in document.iter('testcase'):
                  duration = float(case.attrib.get('time', '0') or '0')
                  classname = case.attrib.get('classname', '')
                  name = case.attrib.get('name', '')
                  cases.append(
                      {
                          'seconds': round(duration, 6),
                          'classname': classname,
                          'name': name,
                      }
                  )
                  modules[classname] += duration
              cases.sort(
                  key=lambda item: (
                      -float(item['seconds']),
                      str(item['classname']),
                      str(item['name']),
                  )
              )
              module_rows = [
                  {
                      'seconds': round(duration, 6),
                      'classname': classname,
                  }
                  for classname, duration in modules.items()
              ]
              module_rows.sort(
                  key=lambda item: (
                      -float(item['seconds']),
                      str(item['classname']),
                  )
              )
              print(
                  json.dumps(
                      {
                          'wall_seconds': wall_seconds,
                          'test_count': len(cases),
                          'summed_test_seconds': round(
                              sum(float(item['seconds']) for item in cases),
                              6,
                          ),
                          'top_testcases': cases[:50],
                          'top_modules': module_rows[:40],
                      },
                      sort_keys=True,
                  ),
                  flush=True,
              )
          PY
