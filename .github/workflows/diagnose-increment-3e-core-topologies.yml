name: Diagnose Increment 3E tmpfs core runtime

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Verify bounded tmpfs scratch
        run: |
          test -d /dev/shm
          test ! -L /dev/shm
          test -w /dev/shm
          df -B1 /dev/shm

      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Measure repository-owned core on tmpfs scratch
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import tempfile
          import time

          from scripts.sdlc import workflow_lane

          root = Path.cwd()
          workflow_lane._CORE_SHARD_COUNT = 16
          workflow_lane._CORE_WORKER_COUNT = 5
          with tempfile.TemporaryDirectory(
              prefix='.newsroom-tmpfs-diagnostic-',
              dir=root,
          ) as raw:
              report = Path(raw) / 'pytest.xml'
              started = time.monotonic()
              code = workflow_lane._run_core_pytest_shards(
                  root=root,
                  report=report,
              )
              result = {
                  'tmpdir': str(Path(tempfile.gettempdir()).resolve()),
                  'wall_seconds': round(time.monotonic() - started, 3),
                  'returncode': code,
                  'shard_count': workflow_lane._CORE_SHARD_COUNT,
                  'workers': workflow_lane._CORE_WORKER_COUNT,
              }
              print(json.dumps(result, sort_keys=True), flush=True)
              if code:
                  raise SystemExit(code)
          PY
