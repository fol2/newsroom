name: Apply Increment 3E persistent core evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked tooling
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Apply measured corrections and refresh lock
        run: |
          uv run python .github/increment-3e-persistent-core-apply.py
          uv lock
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_discovery_projection_3e_health_chronology.py \
            newsroom/tests/test_discovery_projection_3e_health.py \
            newsroom/tests/test_integrated_c1_workflow_contract.py \
            newsroom/tests/test_sdlc_workflow_orchestrator.py
          git diff --check

      - name: Prove full core evidence has accepted-deadline margin
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          mkdir -p .increment-3e-core-proof
          timeout --signal=TERM --kill-after=2s 48s \
            uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
              --repo-root . \
              --report .increment-3e-core-proof/pytest.xml
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('.increment-3e-core-proof/pytest.xml')
          root = ET.parse(report).getroot()
          cases = tuple(root.iter('testcase'))
          assert len(cases) >= 1500, len(cases)
          assert not tuple(root.iter('failure'))
          assert not tuple(root.iter('error'))
          PY
          rm -rf .increment-3e-core-proof

      - name: Publish permanent code and remove one-shot material
        run: |
          rm .github/increment-3e-persistent-core-apply.py
          rm .github/workflows/diagnose-increment-3e-core-topologies.yml
          rm -f .github/.increment-3e-persistent-core-trigger
          git config user.name newsroom-ci
          git config user.email newsroom-ci@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git commit -m "perf(sdlc): use persistent file-scoped core workers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
