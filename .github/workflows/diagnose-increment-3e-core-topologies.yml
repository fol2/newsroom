name: Diagnose Increment 3E persistent pytest workers

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked environment and pinned diagnostic plugin
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev
          uv pip install pytest-xdist==3.8.0

      - name: Measure persistent file-level workers
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import time
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          with tempfile.TemporaryDirectory(
              prefix='.newsroom-xdist-',
              dir=root,
          ) as raw:
              temporary = Path(raw)
              report = temporary / 'pytest.xml'
              basetemp = temporary / 'pytest'
              command = (
                  sys.executable,
                  '-m',
                  'pytest',
                  '-q',
                  '--assert=plain',
                  '-p',
                  'no:cacheprovider',
                  '-p',
                  'xdist.plugin',
                  '-n',
                  '4',
                  '--dist=loadfile',
                  'newsroom/tests',
                  f'--basetemp={basetemp}',
                  f'--junitxml={report}',
              )
              started = time.monotonic()
              completed = subprocess.run(command, cwd=root, check=False)
              wall_seconds = round(time.monotonic() - started, 3)
              test_count = 0
              failures = 0
              errors = 0
              skipped = 0
              if report.is_file():
                  document = ET.parse(report).getroot()
                  test_count = len(tuple(document.iter('testcase')))
                  failures = len(tuple(document.iter('failure')))
                  errors = len(tuple(document.iter('error')))
                  skipped = len(tuple(document.iter('skipped')))
              result = {
                  'returncode': completed.returncode,
                  'wall_seconds': wall_seconds,
                  'workers': 4,
                  'distribution': 'loadfile',
                  'test_count': test_count,
                  'failures': failures,
                  'errors': errors,
                  'skipped': skipped,
              }
              print(json.dumps(result, sort_keys=True), flush=True)
              if completed.returncode:
                  raise SystemExit(completed.returncode)
              if test_count < 1500 or failures or errors:
                  raise SystemExit('persistent worker evidence is incomplete')
          PY
