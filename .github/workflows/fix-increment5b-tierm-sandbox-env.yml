name: Fix exact Increment 5B Tier-M service sandbox credentials v3

on:
  push:
    branches: [support/fix-increment5b-tierm-sandbox-env-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-exact-increment5b-tierm-sandbox-env-v3
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/fix-increment5b-tierm-sandbox-env-20260807
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Patch, commit locally, verify and publish exact product head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/support/fix_increment5b_tierm_sandbox_env_v3.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5b-tierm-sandbox-repair-v3-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5b-tierm-sandbox-focused.log
            /tmp/increment5b-tierm-sandbox-full.log
            /tmp/increment5b-tierm-sandbox-receipt.txt
