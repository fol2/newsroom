name: Materialize Increment 3C proposal admission

on:
  push:
    branches:
      - agent/increment-3c-check-transition-authority
    paths:
      - .github/workflows/materialize-increment-3c-admission.yml
      - .github/increment-3c-admission-payload/**

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Verify and materialize exact source payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile
          import tempfile

          root = Path.cwd()
          payload_root = root / '.github/increment-3c-admission-payload'
          manifest = json.loads((payload_root / 'manifest.json').read_text())
          expected_paths = tuple(manifest['paths'])
          if len(expected_paths) != len(set(expected_paths)):
              raise SystemExit('payload manifest contains duplicate paths')
          expected_chunks = tuple(
              payload_root / f'part-{index:02d}.b64'
              for index in range(manifest['chunk_count'])
          )
          actual_chunks = tuple(sorted(payload_root.glob('part-*.b64')))
          if actual_chunks != expected_chunks:
              raise SystemExit('payload chunk inventory differs from manifest')
          encoded = ''.join(path.read_text(encoding='ascii') for path in expected_chunks)
          if len(encoded) != manifest['base64_size']:
              raise SystemExit('payload base64 size differs from manifest')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != manifest['archive_size']:
              raise SystemExit('payload archive size differs from manifest')
          if hashlib.sha256(archive).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('payload archive digest differs from manifest')

          with tempfile.TemporaryDirectory() as temporary:
              staging = Path(temporary)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
                  members = tar.getmembers()
                  names = tuple(member.name for member in members)
                  if names != tuple(sorted(expected_paths)):
                      raise SystemExit('archive path inventory differs from manifest')
                  for member in members:
                      path = PurePosixPath(member.name)
                      if (
                          path.is_absolute()
                          or '..' in path.parts
                          or not member.isfile()
                          or member.issym()
                          or member.islnk()
                      ):
                          raise SystemExit(f'unsafe archive member: {member.name}')
                      target = staging.joinpath(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = tar.extractfile(member)
                      if source is None:
                          raise SystemExit(f'archive member has no bytes: {member.name}')
                      target.write_bytes(source.read())
              for relative in expected_paths:
                  source = staging / relative
                  digest = hashlib.sha256(source.read_bytes()).hexdigest()
                  if digest != manifest['file_sha256'][relative]:
                      raise SystemExit(f'file digest differs for {relative}')
                  target = root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          PY
          python -m compileall -q newsroom/authority newsroom/checks newsroom/tests
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused admission and retained authority suites
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_contracts.py \
            newsroom/tests/test_check_3c_baselines.py \
            newsroom/tests/test_check_3c_transitions.py \
            newsroom/tests/test_check_3c_agenda.py \
            newsroom/tests/test_check_3c_findings.py \
            newsroom/tests/test_check_3c_traceability.py \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_check_3c_authority.py \
            newsroom/tests/test_check_3c_admission.py \
            newsroom/tests/test_source_3a_authority.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py

      - name: Commit verified clean admission controller
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/increment-3c-admission-payload \
            .github/workflows/materialize-increment-3c-admission.yml \
            .github/workflows/export-increment-3c-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            newsroom/authority/_check_facade.py \
            newsroom/authority/_check_store.py \
            newsroom/authority/_check_system.py \
            newsroom/authority/_check_admission_lookup.py \
            newsroom/authority/_proposal_admission.py \
            newsroom/authority/_proposal_admission_commit.py \
            newsroom/authority/_proposal_admission_models.py \
            newsroom/authority/_proposal_admission_planning.py \
            newsroom/authority/_proposal_admission_validation.py \
            newsroom/checks/__init__.py \
            newsroom/checks/admission_models.py \
            newsroom/tests/test_check_3c_admission.py \
            .github/increment-3c-admission-payload \
            .github/workflows/materialize-increment-3c-admission.yml \
            .github/workflows/export-increment-3c-source.yml
          git diff --cached --check
          test -z "$(git status --short --untracked-files=all | grep -vE '^[MADRCU?!]{1,2}  (newsroom/authority/(_check_facade|_check_store|_check_system|_check_admission_lookup|_proposal_admission|_proposal_admission_commit|_proposal_admission_models|_proposal_admission_planning|_proposal_admission_validation)\.py|newsroom/checks/(__init__|admission_models)\.py|newsroom/tests/test_check_3c_admission\.py|\.github/(increment-3c-admission-payload/|workflows/(materialize-increment-3c-admission|export-increment-3c-source)\.yml))' || true)"
          git commit -m 'feat(checks): admit adapter proposals into source lineage'
          git push origin HEAD:agent/increment-3c-check-transition-authority
