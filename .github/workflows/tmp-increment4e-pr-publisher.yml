name: Temporary Increment 4E workflow export

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.head_ref == 'agent/increment-4e-corrective-hardening' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Prepare exact permanent workflow update
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/projection-b2-neo4j.yml')
          old = 'test_actual_service_increment4_graph_loss_replays_retained_authority_exactly'
          new = 'test_actual_service_increment4_graph_loss_requires_isolated_replacement'
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1 or new in text:
              raise SystemExit('Increment 4E workflow assertion anchor changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Export exact permanent workflow file
        uses: actions/upload-artifact@v4
        with:
          name: increment4e-permanent-workflow
          path: .github/workflows/projection-b2-neo4j.yml
          if-no-files-found: error
