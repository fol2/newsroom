name: agent-increment2b-sdlc-margin-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      AUTHORISED_PARENT: ff3577798a74d2b8777fa6ea422a15379ff84eaf
      TARGET_BRANCH: agent/increment-2b-fulltext-vector-projection
      PATCH_SHA256: 36e7d2dba1b9897406c9adf06074632507bd6b3f38ea82c86fe05be731912637
      EXPECTED_TREE: f8046fb8efce5cc8c8f00ef818d4aa0b72116adc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reconstruct verified SDLC margin patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/increment2b-sdlc-margin/fix.patch.gz.b64 \
            > /tmp/increment2b-sdlc-margin.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2b-sdlc-margin.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2b-sdlc-margin.patch.gz \
            > /tmp/increment2b-sdlc-margin.patch

      - name: Apply correction to exact authorised parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          git apply --check /tmp/increment2b-sdlc-margin.patch
          git apply /tmp/increment2b-sdlc-margin.patch
          rm -rf .github/increment2b-sdlc-margin
          rm -f .github/workflows/agent-increment2b-sdlc-margin-materialize.yml
          git add -A

      - name: Verify exact correction boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-paths <<'EOF'
          docs/operations/increment-2b-complete-projection.md
          docs/research/2026-07-25-increment-2b-substantive-review.md
          newsroom/tests/complete_projection_2b_helpers.py
          newsroom/tests/test_complete_projection_2b_traceability.py
          newsroom/tests/test_sdlc_dependencies.py
          newsroom/tests/test_sdlc_watchdog.py
          scripts/sdlc/dependencies.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          python -m compileall -q newsroom scripts
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Create and push exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2B Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'perf(sdlc): preserve deterministic evidence margin' \
            'Cache dependency analysis by exact source bytes, shorten readiness-observed watchdog fixtures, clone closed deterministic fixture authority into isolated tests, and record the eighth Increment 2B review correction without changing the accepted 55-second lane or complete-suite topology.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
