name: agent-increment2d-foundation-materialize

on:
  push:
    branches:
      - agent/increment-2d-foundation-materialize
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2d-foundation-materialize-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: 41e8bcdc1664514932c0994d58512faa4fe7658c
      EXPECTED_BASE_TREE: 9cd9413ae91690e2f06faae2c3897dcebb6a90e6
      TARGET_BRANCH: agent/increment-2d-complete-actual-neo4j-proof
      PATCH_SHA256: 614f1a719544ed15071903671482a03b4df18f3785b6b4f5d100610bf5ba6dd1
      EXPECTED_TREE: 99e99ba4bd19c45433529ef2e76211d0af07a53c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct exact Candidate-authority patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/increment2d-foundation/part-* \
            | base64 --decode > /tmp/increment2d-foundation.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2d-foundation.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2d-foundation.patch.gz \
            > /tmp/increment2d-foundation.patch

      - name: Apply and verify exact foundation tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_BASE_TREE"
          git apply --index /tmp/increment2d-foundation.patch
          cat > /tmp/expected-paths <<'EOF'
          newsroom/authority/_complete_projection_store.py
          newsroom/authority/_development_candidate_store.py
          newsroom/authority/_development_candidate_system.py
          newsroom/authority/_projection_store.py
          newsroom/authority/_retrieval_store.py
          newsroom/authority/development_candidate_migrations.py
          newsroom/authority/development_candidate_system.py
          newsroom/authority/migrations.py
          newsroom/increment2/__init__.py
          newsroom/increment2/models.py
          newsroom/increment2/policy.py
          newsroom/tests/increment_2d_helpers.py
          newsroom/tests/test_complete_projection_2b_migrations.py
          newsroom/tests/test_increment_2d_candidate_authority.py
          newsroom/tests/test_increment_2d_migrations.py
          newsroom/tests/test_projection_b1_migrations.py
          newsroom/tests/test_relation_2a_contracts.py
          newsroom/tests/test_retrieval_2c_migrations.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked foundation gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_relation_2a_authority.py \
            newsroom/tests/test_relation_2a_contracts.py \
            newsroom/tests/test_complete_projection_2b_authority.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_retrieval_2c_authority.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_projection_b1_migrations.py
          uv run --no-sync python -m scripts.sdlc.workflow_lane \
            core-tests --repo-root . --report increment2d-foundation-core.xml \
            --clustering
          rm -f increment2d-foundation-core.xml
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Create and push clean foundation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2D Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'feat(candidate): add complete fixture admission authority' \
            'Add checked SQLite schema v9, authenticated relational development-Candidate admission from retained Retrieval Context v2, exact replay and semantic deduplication, startup integrity, and Candidate-safe source watermark semantics.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORISED_PARENT" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
