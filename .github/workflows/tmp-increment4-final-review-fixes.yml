''',
              label="test scope import",
          )
          test = replace_once(
              test,
              '''    state, snapshot = admitted_increment4_fixture(tmp_path)
    adapter = MemoryNeo4jAdapter()
    captured = []
    build = increment4_boundary_module.build_increment4_admitted_batches

    def capture(authoritative_snapshot, **kwargs):
        captured.append(authoritative_snapshot)
        return build(authoritative_snapshot, **kwargs)

    monkeypatch.setattr(
        increment4_boundary_module,
        "build_increment4_admitted_batches",
        capture,
    )
    with open_increment4_neo4j_system(state, adapter) as system:
        system.increment4.build_and_promote(
            _request(GENERATION_1, snapshot, key="increment4-authority-owned-v1"),
            proof=extraction_proof(),
        )

    assert captured == [snapshot]
    assert captured[0] is not snapshot
''',
              '''    state, snapshot = admitted_increment4_fixture(tmp_path)
    adapter = MemoryNeo4jAdapter()
    captured = []
    build = increment4_boundary_module.build_increment4_admitted_batches
    revoked_alias = snapshot.entities[0].aliases[0]
    filtered_entity = replace(
        snapshot.entities[0],
        aliases=tuple(
            item
            for item in snapshot.entities[0].aliases
            if item.alias_id != revoked_alias.alias_id
        ),
    )
    filtered_snapshot = replace(
        snapshot,
        entities=(filtered_entity, *snapshot.entities[1:]),
    )
    require_alias = (
        increment4_store_module._Increment4ProjectionAuthorityStore
        ._increment4_alias_if_current
    )

    def reject_revoked_alias(self, conn, row):
        alias = self._alias_from_row(conn, row)
        if alias.alias_id == revoked_alias.alias_id:
            raise EntityRightsDenied("alias rights are no longer current")
        return require_alias(self, conn, row)

    def capture(authoritative_snapshot, **kwargs):
        captured.append(authoritative_snapshot)
        return build(authoritative_snapshot, **kwargs)

    monkeypatch.setattr(
        increment4_store_module._Increment4ProjectionAuthorityStore,
        "_increment4_alias_if_current",
        reject_revoked_alias,
