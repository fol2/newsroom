name: Temporary Increment 4 final review corrections

on:
  push:
    branches:
      - agent/increment-4e-corrective-hardening
    paths:
      - .github/workflows/tmp-increment4-final-review-fixes.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/increment-4e-corrective-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          store_path = Path("newsroom/authority/_increment4_projection_store.py")
          store = store_path.read_text(encoding="utf-8")
          store = replace_once(
              store,
              '''    """Projection authority with exact governed Increment 4 snapshot reads."""

    def increment4_admitted_snapshot(self) -> Increment4AdmittedProjectionSnapshot:
''',
              '''    """Projection authority with exact governed Increment 4 snapshot reads."""

    def _increment4_alias_if_current(self, conn, row):
        alias = self._alias_from_row(conn, row)
        mention = self._mention_from_row(
            conn,
            self._mention_row(conn, alias.provenance_mention_id),
            replayed=False,
        )
        self._require_mention_current(conn, mention)
        return alias

    def increment4_admitted_snapshot(self) -> Increment4AdmittedProjectionSnapshot:
''',
              label="alias-current helper",
          )
          store = replace_once(
              store,
              '''                    alias_count = int(
                        conn.execute(
                            "SELECT COUNT(*) FROM entity_aliases WHERE entity_id=?",
                            (str(entity_id),),
                        ).fetchone()[0]
                    )
                    aliases = tuple(
                        sorted(
                            self.aliases(entity_id, limit=max(1, alias_count)),
                            key=lambda item: str(item.alias_id),
                        )
                    )
                except PermissionError:
                    # Rights-invalid current state must disappear from derivative
                    # authority rather than being copied from stale caller memory.
                    continue
                if len(aliases) != alias_count:
                    raise AuthorityPersistenceError(
                        "Increment 4 entity alias authority is incomplete"
                    )
''',
              '''                    alias_rows = conn.execute(
                        "SELECT * FROM entity_aliases WHERE entity_id=? "
                        "ORDER BY alias_id",
                        (str(entity_id),),
                    ).fetchall()
                    current_aliases = []
                    for alias_row in alias_rows:
                        try:
                            current_aliases.append(
                                self._increment4_alias_if_current(conn, alias_row)
                            )
                        except PermissionError:
                            # An independently sourced alias can lose current rights
                            # without invalidating the canonical entity or relations
                            # whose own retained authority remains current.
                            continue
                    aliases = tuple(current_aliases)
                except PermissionError:
                    # Rights-invalid current state must disappear from derivative
                    # authority rather than being copied from stale caller memory.
                    continue
''',
              label="per-alias rights filtering",
          )
          store_path.write_text(store, encoding="utf-8")

          boundary_path = Path("newsroom/authority/_neo4j_projection_system.py")
          boundary = boundary_path.read_text(encoding="utf-8")
          boundary = replace_once(
              boundary,
              '''    def _require_generic_mutation_generation(
        self,
        generation_id: ProjectionGenerationId,
        proof: AuthenticationProof,
    ) -> None:
        self._projection_boundary._authenticate(proof)
        metadata = self._store.projection_generation_metadata(generation_id)
        self._require_generic_structural_family(metadata.family.family_id)
''',
              '''    def _require_generic_mutation_generation(
        self,
        generation_id: ProjectionGenerationId,
    ) -> None:
        metadata = self._store.projection_generation_metadata(generation_id)
        self._require_generic_structural_family(metadata.family.family_id)
''',
              label="generation guard",
          )
          boundary = replace_once(
              boundary,
              '''    def transition_generation(
        self,
        request: ProjectionGenerationTransitionRequest,
        proof: AuthenticationProof,
    ) -> ProjectionGenerationView:
        if not isinstance(request, ProjectionGenerationTransitionRequest):
            raise TypeError("projection generation transition requires a typed request")
        self._require_generic_mutation_generation(request.generation_id, proof)
        return self._projection_boundary.transition_generation(request, proof)
''',
              '''    def transition_generation(
        self,
        request: ProjectionGenerationTransitionRequest,
        proof: AuthenticationProof,
    ) -> ProjectionGenerationView:
        if not isinstance(request, ProjectionGenerationTransitionRequest):
            raise TypeError("projection generation transition requires a typed request")
        grant = self._projection_boundary._grant(
            command_type="projection.generation.transition",
            aggregate_id=request.generation_id.as_aggregate_id(),
            expected_version=request.expected_authority_version,
            payload={
