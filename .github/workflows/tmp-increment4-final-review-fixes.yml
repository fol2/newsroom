          boundary_path.write_text(boundary, encoding="utf-8")

          test_path = Path("newsroom/tests/test_increment4e_corrective_hardening.py")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              '''import newsroom.authority._increment4_neo4j_boundary as increment4_boundary_module
from newsroom.authority import digest_canonical
from newsroom.entities.types import EntityKind
''',
              '''import newsroom.authority._increment4_neo4j_boundary as increment4_boundary_module
import newsroom.authority._increment4_projection_store as increment4_store_module
from newsroom.authority import digest_canonical
from newsroom.entities.types import EntityKind, EntityRightsDenied
''',
              label="test authority imports",
          )
          test = replace_once(
              test,
              '''from .increment4e_helpers import (
    admitted_increment4_fixture,
    open_increment4_neo4j_system,
)
''',
              '''from .increment4e_helpers import (
    INCREMENT4_PROJECTION_SCOPES,
    admitted_increment4_fixture,
