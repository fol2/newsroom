      - name: Install locked environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Run focused authority and controller regressions
        shell: bash
        run: |
          uv run python -m compileall -q newsroom
          uv run python -m pytest -q \
            newsroom/tests/test_increment4e_corrective_hardening.py \
            newsroom/tests/test_increment4e_neo4j_controller.py \
            newsroom/tests/test_increment4e_stale_relation_rebuild.py \
            newsroom/tests/test_increment4e_workflow_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py

      - name: Commit tested permanent correction and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-increment4-final-review-fixes.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(increment4): close final authority review gaps"
          git push origin HEAD:agent/increment-4e-corrective-hardening
