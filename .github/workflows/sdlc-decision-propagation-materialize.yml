name: Materialize SDLC decision propagation correction

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sdlc-decision-metadata-propagation
  cancel-in-progress: true

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/sdlc-decision-metadata-propagation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact corrective branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/sdlc-decision-metadata-propagation
          fetch-depth: 0
          show-progress: false

      - name: Apply reviewed bounded retry and regression tests
        run: python .github/sdlc-decision-propagation-patch.py

      - name: Compile and inspect patch
        run: |
          set -euo pipefail
          python -m compileall -q scripts/sdlc newsroom/tests
          git diff --check

      - name: Install locked development environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete regression suites
        run: |
          set -euo pipefail
          uv run python -m pytest -q newsroom/tests/test_sdlc_workflow_orchestrator.py
          uv run python -m pytest -q
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit and push verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/sdlc-decision-propagation-patch.py \
            .github/workflows/sdlc-decision-propagation-materialize.yml
          git add -- \
            scripts/sdlc/workflow_orchestrator.py \
            newsroom/tests/test_sdlc_workflow_orchestrator.py
          git diff --cached --check
          git commit -m "fix(sdlc): retry exact lane verification after metadata propagation"
          git push origin HEAD:agent/sdlc-decision-metadata-propagation
