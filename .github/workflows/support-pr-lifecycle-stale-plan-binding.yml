name: Support PR lifecycle stale-plan binding

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: github.head_ref == 'support/pr-lifecycle-stale-plan-binding-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Apply stale-plan binding correction
        run: |
          set -euo pipefail
          python scripts/support/apply_pr_lifecycle_stale_plan_binding.py
          python -m py_compile \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              'newsroom/tests/test_pr_lifecycle.py',
              'scripts/sdlc/pr_lifecycle.py',
          }
          lines = subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          actual = {line[3:] for line in lines}
          if actual != expected:
              raise SystemExit(
                  f'lifecycle stale-plan inventory differs: '
                  f'expected={sorted(expected)!r} actual={sorted(actual)!r}'
              )
          PY

      - name: Commit corrected product files
        run: |
          set -euo pipefail
          git add \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind lifecycle effects to the planned current metadata'
          test -z "$(git status --porcelain)"

      - name: Sync locked development environment
        run: uv sync --dev --locked

      - name: Focused stale-plan evidence
        run: uv run python -m pytest -q newsroom/tests/test_pr_lifecycle.py

      - name: Complete deterministic repository evidence
        run: uv run python -m pytest -q

      - name: Existing clustering evaluation gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Publish product-only corrected tree
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm \
            scripts/support/apply_pr_lifecycle_stale_plan_binding.py \
            .github/workflows/support-pr-lifecycle-stale-plan-binding.yml
          git diff --cached --check
          git commit -m 'support: retain product-only lifecycle stale-plan correction'
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${HEAD_BRANCH}"
