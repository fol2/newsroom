name: Materialize final Increment 4A source

on:
  push:
    branches:
      - agent/increment-4a-extraction-run-authority

permissions:
  contents: write

jobs:
  materialize-clean-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact staged head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-4a-extraction-run-authority
          fetch-depth: 0
          show-progress: false
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Reconstruct, verify and apply exact clean source
        shell: bash
        env:
          START_SHA: ${{ github.sha }}
          EXPECTED_TREE: f7544bbd84d060ec37cf68e4a3a93d0e7735c4e1
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/increment-4a-extraction-run-authority"
          test "$(git rev-parse HEAD)" = "$START_SHA"
          test -d .github/increment-4a-transport
          test -f .github/increment-4a-transport-final/part-00

          find .github/increment-4a-transport -maxdepth 1 -type f -name 'part-*' -print0 \
            | sort -z \
            | xargs -0 cat > "$RUNNER_TEMP/increment-4a-series.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-series.patch.gz.b64")" -eq 82320
          printf '%s  %s\n' \
            '9202191659db917d72933e903b5ed3681d3fe19f9486a248c02ce7dd2ee2e3ef' \
            "$RUNNER_TEMP/increment-4a-series.patch.gz.b64" | sha256sum --check --strict -
          base64 --decode "$RUNNER_TEMP/increment-4a-series.patch.gz.b64" \
            > "$RUNNER_TEMP/increment-4a-series.patch.gz"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-series.patch.gz")" -eq 61740
          printf '%s  %s\n' \
            'f08c0a8378484abe902ea0962397a8d5c9c3d951d8ee5e95dc40ab64431ac50a' \
            "$RUNNER_TEMP/increment-4a-series.patch.gz" | sha256sum --check --strict -
          gzip --decompress --stdout "$RUNNER_TEMP/increment-4a-series.patch.gz" \
            > "$RUNNER_TEMP/increment-4a-series.patch"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-series.patch")" -eq 292268
          printf '%s  %s\n' \
            'a5d56f4b22d38114f7b611208f1bf20927b54b5c0697ad53981cb1c883c4c366' \
            "$RUNNER_TEMP/increment-4a-series.patch" | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/increment-4a-series.patch"
          git apply "$RUNNER_TEMP/increment-4a-series.patch"

          cat .github/increment-4a-transport-final/part-00 \
            > "$RUNNER_TEMP/increment-4a-final.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-final.patch.gz.b64")" -eq 1816
          printf '%s  %s\n' \
            '60b255cd2153516424eeedf017e0ba95f598f5295200f52be145623a24188e71' \
            "$RUNNER_TEMP/increment-4a-final.patch.gz.b64" | sha256sum --check --strict -
          base64 --decode "$RUNNER_TEMP/increment-4a-final.patch.gz.b64" \
            > "$RUNNER_TEMP/increment-4a-final.patch.gz"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-final.patch.gz")" -eq 1362
          printf '%s  %s\n' \
            '2d5cb1bf1a89ab2cf33145f09199195102a94d96c7d032aa46d04f27254ee2ca' \
            "$RUNNER_TEMP/increment-4a-final.patch.gz" | sha256sum --check --strict -
          gzip --decompress --stdout "$RUNNER_TEMP/increment-4a-final.patch.gz" \
            > "$RUNNER_TEMP/increment-4a-final.patch"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-final.patch")" -eq 3877
          printf '%s  %s\n' \
            'f3a95ddb22659d82e434f2c00e27998798dac8cad7d5f33b441e61f4276bd5f9' \
            "$RUNNER_TEMP/increment-4a-final.patch" | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/increment-4a-final.patch"
          git apply "$RUNNER_TEMP/increment-4a-final.patch"

          rm -rf .github/increment-4a-transport
          rm -rf .github/increment-4a-transport-final
          rm -f .github/workflows/materialize-increment-4a-final.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          git diff --check
          python -m compileall -q newsroom scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_extraction_4a_*.py \
            newsroom/tests/test_authority_a2a_extraction.py \
            newsroom/tests/test_authority_a2b_extraction.py \
            newsroom/tests/test_discovery_3d_migrations.py \
            newsroom/tests/test_projection_b1_migrations.py \
            --junitxml="$RUNNER_TEMP/increment-4a-focused.xml"
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          test ! -e .github/increment-4a-transport
          test ! -e .github/increment-4a-transport-final
          test ! -e .github/workflows/materialize-increment-4a-final.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(extraction): complete Increment 4A authority'
          git push \
            --force-with-lease=refs/heads/agent/increment-4a-extraction-run-authority:"$START_SHA" \
            origin HEAD:agent/increment-4a-extraction-run-authority
