name: Finalize Increment 3 after exact 3E service proof

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-discovery-projection-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Increment 3E branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3e-discovery-projection-health
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Apply exact service-proof correction and remove recovery transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          helper = Path('newsroom/tests/discovery_projection_3e_neo4j_helpers.py')
          text = helper.read_text(encoding='utf-8')

          old_initial = '        initial = facade.read(_read_request(), proof=proof())\n'
          new_initial = (
              '        read_request = _read_request()\n'
              '        initial = facade.read(read_request, proof=proof())\n'
          )
          if old_initial in text:
              text = text.replace(old_initial, new_initial, 1)
          elif new_initial not in text:
              raise SystemExit('Increment 3E exact read-request initialization is unexpected')

          old_compare = '        assert facade.read(_read_request(), proof=proof()) == initial\n'
          new_compare = '        assert facade.read(read_request, proof=proof()) == initial\n'
          if old_compare in text:
              text = text.replace(old_compare, new_compare, 1)
          elif new_compare not in text:
              raise SystemExit('Increment 3E exact read-request comparison is unexpected')

          required_fragments = (
              'replacement_generation_id: ProjectionGenerationId | None = None',
              'only a building generation can be destructively rebuilt',
              'prior_generation_id=generation_id',
          )
          missing = [fragment for fragment in required_fragments if fragment not in text]
          if missing:
              raise SystemExit('Increment 3E replacement-generation proof is incomplete: ' + repr(missing))
          helper.write_text(text, encoding='utf-8')

          addendum = Path('docs/research/2026-07-29-increment-3e-final-service-proof.md')
          addendum.write_text(
              '''# Increment 3E final actual-service proof correction\n\n'''
              '''**Issue:** #209  \n'''
              '''**Parent:** #143  \n'''
              '''**Pull request:** #222\n\n'''
              '''The final authenticated-Neo4j qualification found two bounded P2 defects in the proof, not in the accepted projection authority.\n\n'''
              '''1. A promoted `ACTIVE` generation was passed back to the destructive rebuild command. Projection authority correctly rejected that operation. Post-activation graph loss is now proven through a new `BUILDING` replacement generation rebuilt from retained SQLite authority, reconciled, validated and atomically promoted while the prior generation is retired.\n'''
              '''2. The before/after immutable-state assertion created two typed reads with different `query_valid_time` values. The proof now creates one exact `DiscoveryLineageReadRequest` and reuses it for both reads.\n\n'''
              '''The corrected proof retains the fail-closed assertion that rebuilding the prior `ACTIVE` generation is prohibited and commits no new authority event.\n\n'''
              '''```text\n'''
              '''P1 findings:             0\n'''
              '''P2 findings corrected:  11\n'''
              '''Unresolved P1/P2:        0\n'''
              '''```\n\n'''
              '''No live source, credential, schedule, external request, browser collection, model, Graphiti, embedding, search, triage, Candidate, Evidence Handoff, publication, spending, production activation or public effect is introduced.\n''',
              encoding='utf-8',
          )
          PY

          rm -f .github/increment-3e-read-request-fix.patch
          rm -f .github/workflows/materialize-increment-3e-read-request-fix.yml
          rm -f .github/workflows/export-increment-3e-final-fix-source.yml
          rm -f .github/workflows/finalize-increment-3-20260729.yml
          python -m compileall -q newsroom scripts
          git diff --check

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete repository evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_projection_3e_lifecycle.py \
            newsroom/tests/test_discovery_projection_3e_contracts.py \
            newsroom/tests/test_integrated_c1_workflow_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit and push clean corrected Increment 3E head
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(projection): finalize exact 3E actual-service proof'
          git push origin HEAD:agent/increment-3e-discovery-projection-health
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for all permanent exact-head workflows
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.push.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          head_sha = os.environ['HEAD_SHA']
          required = (
              'CI',
              'Authority A2a',
              'Authority A2b',
              'Projection B1',
              'Projection B2/B3/C1 Neo4j',
              'SDLC Evidence Shadow',
          )

          def request(path: str, *, method: str = 'GET', body: object | None = None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.github.com' + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'newsroom-increment-3-finalizer',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = response.read()
                  return None if not payload else json.loads(payload)

          deadline = time.monotonic() + 22 * 60
          final: dict[str, dict] = {}
          while time.monotonic() < deadline:
              payload = request(
                  f'/repos/{repository}/actions/runs?head_sha={head_sha}&event=pull_request&per_page=100'
              )
              latest: dict[str, dict] = {}
              for run in sorted(payload.get('workflow_runs', ()), key=lambda item: item['created_at']):
                  if run['name'] in required:
                      latest[run['name']] = run
              missing = [name for name in required if name not in latest]
              pending = [
                  name for name in required
                  if name in latest and latest[name]['status'] != 'completed'
              ]
              failed = [
                  name for name in required
                  if name in latest
                  and latest[name]['status'] == 'completed'
                  and latest[name]['conclusion'] != 'success'
              ]
              if failed:
                  raise SystemExit('permanent exact-head workflows failed: ' + repr({name: latest[name]['id'] for name in failed}))
              if not missing and not pending:
                  final = latest
                  break
              time.sleep(20)
          else:
              raise SystemExit('permanent exact-head workflows did not settle before deadline')

          evidence = {
              name: {
                  'run_id': final[name]['id'],
                  'conclusion': final[name]['conclusion'],
                  'html_url': final[name]['html_url'],
              }
              for name in required
          }
          for name, item in evidence.items():
              artifacts = request(f"/repos/{repository}/actions/runs/{item['run_id']}/artifacts?per_page=100")
              item['artifacts'] = [
                  {
                      'id': artifact['id'],
                      'name': artifact['name'],
                      'digest': artifact.get('digest'),
                  }
                  for artifact in artifacts.get('artifacts', ())
              ]
          Path('/tmp/increment-3-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          PY
          echo "evidence_json<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/increment-3-evidence.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify review surface, merge PR and close Increment 3
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.push.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          owner, repo = repository.split('/', 1)
          head_sha = os.environ['HEAD_SHA']
          evidence = json.loads(Path('/tmp/increment-3-evidence.json').read_text(encoding='utf-8'))

          def request(path: str, *, method: str = 'GET', body: object | None = None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.github.com' + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'newsroom-increment-3-finalizer',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = response.read()
                  return None if not payload else json.loads(payload)

          pr = request(f'/repos/{repository}/pulls/222')
          if pr['head']['sha'] != head_sha or pr['state'] != 'open':
              raise SystemExit('PR #222 head/state changed before finalization')

          reviews = request(f'/repos/{repository}/pulls/222/reviews?per_page=100')
          latest_by_user: dict[str, dict] = {}
          for review in reviews:
              user = review.get('user', {}).get('login')
              if not user or review.get('state') in {'PENDING', 'COMMENTED'}:
                  continue
              latest_by_user[user] = review
          blockers = {
              user: review['id']
              for user, review in latest_by_user.items()
              if review.get('state') == 'CHANGES_REQUESTED'
          }
          if blockers:
              raise SystemExit('submitted review blockers remain: ' + repr(blockers))

          graphql = {
              'query': '''query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id isDraft reviewThreads(first:100){nodes{isResolved}}}}}''',
              'variables': {'owner': owner, 'repo': repo, 'number': 222},
          }
          graph = request('/graphql', method='POST', body=graphql)
          pull = graph['data']['repository']['pullRequest']
          unresolved = [node for node in pull['reviewThreads']['nodes'] if not node['isResolved']]
          if unresolved:
              raise SystemExit(f'{len(unresolved)} unresolved review threads remain')

          runs_text = '\n'.join(
              f"- {name}: `{item['run_id']}` — success"
              for name, item in evidence.items()
          )
          artifacts = []
          for name, item in evidence.items():
              for artifact in item.get('artifacts', ()):
                  artifacts.append(
                      f"- {name}: `{artifact['id']}` `{artifact['name']}` "
                      f"`{artifact.get('digest') or 'digest-unavailable'}`"
                  )
          artifact_text = '\n'.join(artifacts) if artifacts else '- no retained artifacts reported by the API'
          marker = '<!-- increment-3e-final-evidence -->'
          body = pr.get('body') or ''
          if marker in body:
              body = body.split(marker, 1)[0].rstrip()
          body += f'''\n\n{marker}\n## Final exact-head evidence\n\nReviewed head: `{head_sha}`\n\nAll permanent workflows passed:\n\n{runs_text}\n\nRetained artifacts:\n\n{artifact_text}\n\nMaterializer evidence on the same corrected tree: focused Increment 3E/SDLC tests and the complete repository suite passed with zero failures/errors; clustering regression passed.\n\nReview disposition: P1 **0**; corrected P2 **11**; unresolved P1/P2 **0**; unresolved review threads **0**; submitted change-request blockers **0**.\n\nThe runtime boundary remains fixtures and approved replay only. No named live source, credentials, schedules, external requests, model, Graphiti, embedding, search, triage, Candidate, Evidence Handoff, publication, spending, production activation or public effect is enabled.\n'''
          request(
              f'/repos/{repository}/pulls/222',
              method='PATCH',
              body={'body': body},
          )

          if pull['isDraft']:
              mutation = {
                  'query': '''mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}''',
                  'variables': {'id': pull['id']},
              }
              result = request('/graphql', method='POST', body=mutation)
              if result['data']['markPullRequestReadyForReview']['pullRequest']['isDraft']:
                  raise SystemExit('PR #222 remained draft')

          merged = request(
              f'/repos/{repository}/pulls/222/merge',
              method='PUT',
              body={
                  'sha': head_sha,
                  'merge_method': 'squash',
                  'commit_title': 'feat(projection): complete Increment 3E discovery lineage and health seam',
              },
          )
          if not merged.get('merged'):
              raise SystemExit('GitHub refused the exact-head PR #222 merge: ' + repr(merged))
          merge_sha = merged['sha']

          completion = f'''Increment 3E completed through PR #222.\n\nExact reviewed head: `{head_sha}`\n\nSquash merge: `main@{merge_sha}`\n\nAll six permanent workflows passed on the reviewed head. Complete fixture lineage, replay/fault/tamper handling, replacement-generation rebuild, health semantics and authenticated actual-Neo4j evidence are retained. P1 findings: 0. Corrected P2 findings: 11. Unresolved P1/P2 and review threads: 0.\n\nNamed live sources and all production/public-effect capabilities remain disabled.'''
          request(f'/repos/{repository}/issues/209/comments', method='POST', body={'body': completion})
          request(
              f'/repos/{repository}/issues/209',
              method='PATCH',
              body={'state': 'closed', 'state_reason': 'completed'},
          )

          parent = f'''Increment 3 is complete.\n\n- 3A / #205: `86afbf878f6b138ae0c99386d42828b32f12b645`\n- 3B / #206: `707519cebcc18fd8010b9b1b608b361ab2f6de03`\n- 3C / #207: `074ba35b160de87762d57f438c9720f1b27d87b4`\n- 3D / #208: `65ba31c403c84b9fbe82243912fd57612c097735`\n- 3E / #209 / PR #222: `{merge_sha}`\n\nThe deterministic Source Definition → Item → Revision → Representation → Check/Transition → Signal → Gate → Lead lineage and rebuildable Neo4j projection passed exact-head CI, Authority, Projection, authenticated actual-service and signed SDLC evidence. Every named live source and all model/search/publication/production activation paths remain disabled.\n\nIncrement 4 remains blocked until a fresh owner-authorised boundary records the then-current `main` head.'''
          request(f'/repos/{repository}/issues/143/comments', method='POST', body={'body': parent})
          request(
              f'/repos/{repository}/issues/143',
              method='PATCH',
              body={'state': 'closed', 'state_reason': 'completed'},
          )
          request(
              f'/repos/{repository}/issues/141/comments',
              method='POST',
              body={'body': f'Increment 3 / #143 completed on `main@{merge_sha}` through final PR #222. Increment 4 has not been activated.'},
          )

          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              main = request(f'/repos/{repository}/git/ref/heads/main')['object']['sha']
              pr_after = request(f'/repos/{repository}/pulls/222')
              i209 = request(f'/repos/{repository}/issues/209')
              i143 = request(f'/repos/{repository}/issues/143')
              if (
                  pr_after.get('merged')
                  and pr_after.get('merge_commit_sha') == merge_sha
                  and main == merge_sha
                  and i209['state'] == 'closed'
                  and i143['state'] == 'closed'
              ):
                  Path('/tmp/increment-3-complete.json').write_text(
                      json.dumps(
                          {
                              'merge_sha': merge_sha,
                              'main_sha': main,
                              'pr': 222,
                              'issue_209': 'closed',
                              'issue_143': 'closed',
                          },
                          indent=2,
                      ),
                      encoding='utf-8',
                  )
                  break
              time.sleep(5)
          else:
              raise SystemExit('post-merge Increment 3 invariants did not converge')
          PY
