name: Export exact post-5C1 source

on:
  push:
    branches: [support/export-post5c1-source-20260807]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72e0ade55ec05ff6de907319cb9baeeefe30d1ca
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Verify and archive exact source
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "72e0ade55ec05ff6de907319cb9baeeefe30d1ca"
          git -C source archive --format=tar.gz --output=/tmp/newsroom-post5c1.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: newsroom-post5c1-source-72e0ade55ec05ff6de907319cb9baeeefe30d1ca
          path: /tmp/newsroom-post5c1.tar.gz
          retention-days: 1
          if-no-files-found: error
