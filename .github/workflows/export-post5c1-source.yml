name: Export exact Increment 5C2 kernel candidate

on:
  push:
    branches: [support/export-post5c1-source-20260807]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76c9a2f8ec48c110ef147084443be97c8c186bbf
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Verify and archive exact source
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "76c9a2f8ec48c110ef147084443be97c8c186bbf"
          git -C source archive --format=tar.gz --output=/tmp/newsroom-5c2-kernel.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: newsroom-5c2-kernel-source-76c9a2f8ec48c110ef147084443be97c8c186bbf
          path: /tmp/newsroom-5c2-kernel.tar.gz
          retention-days: 1
          if-no-files-found: error
