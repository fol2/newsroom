name: Increment 5A final boundary replacement builder

on:
  pull_request:
    branches:
      - agent/increment-5a-retrieval-contract

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: staging/increment-5a-scope-expand-20260803
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Materialize final whole-requirement ownership correction
        run: python scripts/sdlc/_staging_increment5_reassign_final_boundaries.py

      - name: Normalize zero-count Counter expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("newsroom/tests/test_increment5a_traceability.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        Increment5DeliveryTrace.DELIVERED_IN_5A: 10,\n"
              "        Increment5DeliveryTrace.DEFERRED_TO_5B: 0,\n"
              "        Increment5DeliveryTrace.DEFERRED_TO_5C: 4,\n"
          )
          new = (
              "        Increment5DeliveryTrace.DELIVERED_IN_5A: 10,\n"
              "        Increment5DeliveryTrace.DEFERRED_TO_5C: 4,\n"
          )
          if text.count(old) != 1:
              raise SystemExit("zero-count Counter expectation differs")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify exact generated path set
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              "docs/decisions/2026-08-02-increment-5a-production-retrieval-contract.md",
              "docs/operations/increment-5-production-retrieval-contract.md",
              "docs/traceability/increment-5-production-retrieval.md",
              "increment5a-final-boundary-manifest.json",
              "newsroom/increment5/_traceability_anchors.py",
              "newsroom/increment5/_traceability_model.py",
              "newsroom/increment5/traceability.py",
              "newsroom/tests/test_increment5a_traceability.py",
          }
          tracked = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True,
              ).splitlines()
          )
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit(
                  f"generated path set differs: missing={sorted(expected-actual)}, "
                  f"extra={sorted(actual-expected)}"
              )
          for path in actual:
              if not Path(path).is_file():
                  raise SystemExit(f"generated path is not a regular file: {path}")
          PY

      - name: Verify locked environment
        run: |
          uv lock --check
          uv sync --dev --locked

      - name: Focused Increment 5A verification
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_increment5a_contract.py \
            newsroom/tests/test_increment5a_evaluation_plan.py \
            newsroom/tests/test_increment5a_package_neutrality.py \
            newsroom/tests/test_increment5a_profiles.py \
            newsroom/tests/test_increment5a_profile_semantic_envelope.py \
            newsroom/tests/test_increment5a_traceability.py

      - name: Full deterministic verification
        run: uv run python -m pytest -q

      - name: Source integrity
        run: |
          git diff --check
          cat increment5a-final-boundary-manifest.json

      - name: Commit verified staging materialization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/decisions/2026-08-02-increment-5a-production-retrieval-contract.md \
            docs/operations/increment-5-production-retrieval-contract.md \
            docs/traceability/increment-5-production-retrieval.md \
            increment5a-final-boundary-manifest.json \
            newsroom/increment5/_traceability_anchors.py \
            newsroom/increment5/_traceability_model.py \
            newsroom/increment5/traceability.py \
            newsroom/tests/test_increment5a_traceability.py
          git commit -m "build(increment5): materialize final ownership boundary"
          git push origin HEAD:staging/increment-5a-scope-expand-20260803
