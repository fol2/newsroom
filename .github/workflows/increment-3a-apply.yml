name: Increment 3A source installer cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/increment-3a-apply.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-source-installer
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Verify materialised source authority
        run: |
          test -f newsroom/authority/source_registry_migrations.py
          test -f newsroom/authority/_source_registry_system.py
          test -f newsroom/tests/test_source_3a_authority.py
          python -m compileall -q newsroom
          python -c "from newsroom.authority.migrations import SCHEMA_VERSION; assert SCHEMA_VERSION == 10"

      - name: Remove temporary materialisation transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/increment-3a-apply
          rm -f .github/workflows/increment-3a-apply.yml
          rm -f docs/research/2026-07-27-increment-3a-installer-failure.log
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): remove Increment 3A materialisation transport"
          git pull --rebase origin agent/increment-3a-source-registry
          git push origin HEAD:agent/increment-3a-source-registry
