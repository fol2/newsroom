name: Increment 3A source installer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/increment-3a-apply/**
      - .github/workflows/increment-3a-apply.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-source-installer
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Apply and verify governed source-registry payload
        run: |
          python .github/increment-3a-apply/apply.py

      - name: Commit generated source authority
        run: |
          if git diff --quiet -- newsroom docs; then
            echo "No generated source changes found"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsroom docs
          echo "Generated source diff summary:"
          git diff --cached --stat
          echo "Whitespace diagnostics (reviewed after materialisation):"
          git diff --cached --check || true
          git commit -m "feat(authority): complete transactional source registry"
          git pull --rebase origin agent/increment-3a-source-registry
          git push origin HEAD:agent/increment-3a-source-registry
