name: Increment 3A source installer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/increment-3a-apply/**
      - .github/workflows/increment-3a-apply.yml
  push:
    branches:
      - agent/increment-3a-source-registry
    paths:
      - .github/increment-3a-apply/**
      - .github/workflows/increment-3a-apply.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-source-installer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Apply and verify governed source-registry payload
        run: |
          set +e
          python .github/increment-3a-apply/apply.py > /tmp/increment-3a-installer.log 2>&1
          status=$?
          cat /tmp/increment-3a-installer.log
          if [ "$status" -ne 0 ]; then
            {
              echo "Increment 3A installer failed on commit $(git rev-parse HEAD)."
              echo
              cat /tmp/increment-3a-installer.log
            } > docs/research/2026-07-27-increment-3a-installer-failure.log
            exit "$status"
          fi

      - name: Persist fail-closed installer diagnostic
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/2026-07-27-increment-3a-installer-failure.log
          git commit -m "chore(ci): retain Increment 3A installer failure"
          git push origin HEAD:agent/increment-3a-source-registry

      - name: Commit generated source authority
        if: success()
        run: |
          if git diff --quiet -- newsroom docs; then
            echo "No generated source changes found"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsroom docs
          git diff --cached --check
          git commit -m "feat(authority): complete transactional source registry"
          git push origin HEAD:agent/increment-3a-source-registry
