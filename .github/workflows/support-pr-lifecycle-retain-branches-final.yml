name: Support PR lifecycle retain branches export

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export-tested-product:
    if: github.head_ref == 'support/pr-lifecycle-retain-branches-final-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Recreate the tested no-delete product bytes
        run: |
          set -euo pipefail
          python scripts/support/run_pr_lifecycle_retain_branches.py
          python -m py_compile \
            newsroom/checks/pr_lifecycle.py \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/pull_request_template.md',
              '.github/workflows/pr-lifecycle.yml',
              'docs/operations/pr-lifecycle.md',
              'newsroom/checks/pr_lifecycle.py',
              'newsroom/tests/test_pr_lifecycle.py',
              'scripts/sdlc/pr_lifecycle.py',
          }
          lines = subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          actual = {line[3:] for line in lines}
          if actual != expected:
              raise SystemExit(
                  f'retain-branches inventory differs: '
                  f'expected={sorted(expected)!r} actual={sorted(actual)!r}'
              )
          PY

      - name: Focused byte-boundary smoke evidence
        run: |
          uv sync --dev --locked
          uv run python -m pytest -q newsroom/tests/test_pr_lifecycle.py

      - name: Export exact product blobs without workflow-write scope
        env:
          EXPORT_BASE: c293ed27799d89ea7aac03c12c4f4c5db8d89586
          EXPORT_BRANCH: staging/pr-lifecycle-retain-branches-export-20260805
        run: |
          set -euo pipefail
          export INDEX_PATH="$RUNNER_TEMP/pr-lifecycle-retain-branches.index"
          rm -f "$INDEX_PATH"
          GIT_INDEX_FILE="$INDEX_PATH" git read-tree "${EXPORT_BASE}^{tree}"

          product_paths=(
            .github/pull_request_template.md
            docs/operations/pr-lifecycle.md
            newsroom/checks/pr_lifecycle.py
            newsroom/tests/test_pr_lifecycle.py
            scripts/sdlc/pr_lifecycle.py
          )

          {
            echo '## Exact retained product blobs'
            echo
            echo '| Product path | Blob |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for path in "${product_paths[@]}"; do
            blob="$(git hash-object -w "$path")"
            GIT_INDEX_FILE="$INDEX_PATH" git update-index \
              --add --cacheinfo "100644,$blob,$path"
            echo "| \`$path\` | \`$blob\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          export_path=scripts/support/exported_pr_lifecycle_product.yml
          mkdir -p "$(dirname "$export_path")"
          cp .github/workflows/pr-lifecycle.yml "$export_path"
          workflow_blob="$(git hash-object -w "$export_path")"
          GIT_INDEX_FILE="$INDEX_PATH" git update-index \
            --add --cacheinfo "100644,$workflow_blob,$export_path"
          echo "| \`.github/workflows/pr-lifecycle.yml\` | \`$workflow_blob\` |" \
            >> "$GITHUB_STEP_SUMMARY"

          export_tree="$(GIT_INDEX_FILE="$INDEX_PATH" git write-tree)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export_commit="$(printf '%s\n' \
            'support: export exact tested branch-retention product blobs' \
            | git commit-tree "$export_tree" -p "$EXPORT_BASE")"

          {
            echo
            echo "- Export base: \`$EXPORT_BASE\`"
            echo "- Export tree: \`$export_tree\`"
            echo "- Export commit: \`$export_commit\`"
            echo "- Prior complete evidence: run \`31057451644\` "
            echo '  (`28 focused`, `2,093 passed`, `38 skipped`, clustering PASS)'
          } >> "$GITHUB_STEP_SUMMARY"

          git push --force origin \
            "$export_commit:refs/heads/$EXPORT_BRANCH"
