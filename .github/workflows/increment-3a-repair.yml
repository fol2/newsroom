name: Increment 3A focused repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-repair.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-focused-repair
  cancel-in-progress: true

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Repair retained migration expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "newsroom/tests/test_projection_b1_migrations.py",
              '        assert conn.execute("PRAGMA user_version").fetchone()[0] == 9\n',
              '        assert conn.execute("PRAGMA user_version").fetchone()[0] == 10\n',
          )
          replace_once(
              "newsroom/tests/test_projection_b1_migrations.py",
              '            (9, "complete_fixture_candidate_authority_v9"),\n        ]\n',
              '            (9, "complete_fixture_candidate_authority_v9"),\n'
              '            (10, "source_registry_authority_v10"),\n'
              '        ]\n',
          )
          replace_once(
              "newsroom/tests/test_complete_projection_2b_migrations.py",
              "    assert SCHEMA_VERSION == 9\n",
              "    assert SCHEMA_VERSION == 10\n",
          )
          replace_once(
              "newsroom/tests/test_retrieval_2c_migrations.py",
              "    assert SCHEMA_VERSION == 9\n",
              "    assert SCHEMA_VERSION == 10\n",
          )
          replace_once(
              "newsroom/tests/test_increment_2d_migrations.py",
              "    assert DEVELOPMENT_CANDIDATE_SCHEMA_VERSION == SCHEMA_VERSION == 9\n"
              "    assert EXPECTED_MIGRATION_HISTORY[-1] == (\n"
              "        9,\n"
              "        DEVELOPMENT_CANDIDATE_MIGRATION_NAME,\n"
              "        DEVELOPMENT_CANDIDATE_MIGRATION_CHECKSUM,\n"
              "    )\n",
              "    assert DEVELOPMENT_CANDIDATE_SCHEMA_VERSION == 9\n"
              "    assert SCHEMA_VERSION == 10\n"
              "    assert (\n"
              "        9,\n"
              "        DEVELOPMENT_CANDIDATE_MIGRATION_NAME,\n"
              "        DEVELOPMENT_CANDIDATE_MIGRATION_CHECKSUM,\n"
              "    ) in EXPECTED_MIGRATION_HISTORY\n",
          )
          replace_once(
              "newsroom/tests/test_increment_2d_migrations.py",
              '        assert conn.execute("PRAGMA user_version").fetchone()[0] == 9\n',
              '        assert conn.execute("PRAGMA user_version").fetchone()[0] == SCHEMA_VERSION\n',
          )
          replace_once(
              "newsroom/tests/test_increment_2d_candidate_authority.py",
              "import json\nfrom pathlib import Path\nimport json\n",
              "import json\nfrom pathlib import Path\n",
          )
          replace_once(
              "newsroom/tests/test_increment_2d_candidate_authority.py",
              "def test_schema_version_advances_to_candidate_authority_v9(tmp_path: Path) -> None:\n",
              "def test_candidate_authority_v9_remains_available_under_current_schema(tmp_path: Path) -> None:\n",
          )
          replace_once(
              "newsroom/tests/test_increment_2d_candidate_authority.py",
              '        assert conn.execute("PRAGMA user_version").fetchone()[0] == SCHEMA_VERSION == 9\n',
              '        assert conn.execute("PRAGMA user_version").fetchone()[0] == SCHEMA_VERSION == 10\n',
          )
          replace_once(
              "newsroom/tests/test_relation_2a_contracts.py",
              "    assert SCHEMA_VERSION == 9\n",
              "    assert SCHEMA_VERSION == 10\n",
          )
          PY
          python -m compileall -q newsroom
          git diff --check

      - name: Commit migration compatibility repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsroom/tests
          git diff --cached --check
          git commit -m "test(authority): advance retained schema expectations to v10"
          git pull --rebase origin agent/increment-3a-source-registry
          git push origin HEAD:agent/increment-3a-source-registry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Run Increment 3A and retained migration suites
        id: focused
        continue-on-error: true
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_projection_b1_migrations.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_relation_2a_contracts.py \
            newsroom/tests/test_source_3a_contracts.py \
            newsroom/tests/test_source_3a_authority.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_source_3a_traceability.py \
            --junitxml=increment-3a-focused-results.xml

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-3a-focused-test-evidence
          path: increment-3a-focused-results.xml
          if-no-files-found: error

      - name: Enforce focused evidence
        if: steps.focused.outcome != 'success'
        run: exit 1
