name: Increment 3A focused repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-repair.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-focused-repair
  cancel-in-progress: true

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Preserve typed UUID authority at every command boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("newsroom/authority/_source_registry_system.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "AggregateId(str(request.definition_id))": "AggregateId(request.definition_id.value)",
              "AggregateId(str(request.version_id))": "AggregateId(request.version_id.value)",
              "AggregateId(str(request.item_id))": "AggregateId(request.item_id.value)",
              "AggregateId(str(request.decision_id))": "AggregateId(request.decision_id.value)",
              "AggregateId(str(request.revision_id))": "AggregateId(request.revision_id.value)",
              "AggregateId(str(request.representation_id))": "AggregateId(request.representation_id.value)",
              "AggregateId(str(request.occurrence_id))": "AggregateId(request.occurrence_id.value)",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {old!r}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q newsroom
          git diff --check

      - name: Commit typed authority repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsroom/authority/_source_registry_system.py
          git diff --cached --check
          git commit -m "fix(authority): preserve typed source aggregate identities"
          git pull --rebase origin agent/increment-3a-source-registry
          git push origin HEAD:agent/increment-3a-source-registry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Run Increment 3A and retained migration suites
        id: focused
        continue-on-error: true
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_projection_b1_migrations.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_relation_2a_contracts.py \
            newsroom/tests/test_source_3a_contracts.py \
            newsroom/tests/test_source_3a_authority.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_source_3a_traceability.py \
            --junitxml=increment-3a-focused-results.xml

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-3a-focused-test-evidence
          path: increment-3a-focused-results.xml
          if-no-files-found: error

      - name: Enforce focused evidence
        if: steps.focused.outcome != 'success'
        run: exit 1
