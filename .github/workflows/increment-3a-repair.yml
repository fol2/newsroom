name: Increment 3A substantive repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-repair.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-focused-repair
  cancel-in-progress: true

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Apply substantive source-authority corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Source time must retain a typed, canonical temporal representation.
          replace_once(
              "newsroom/sources/types.py",
              "from dataclasses import dataclass\nfrom enum import StrEnum\n",
              "from dataclasses import dataclass\nfrom datetime import date\nfrom enum import StrEnum\n",
          )
          replace_once(
              "newsroom/sources/types.py",
              "        if self.precision is TimePrecision.UNKNOWN:\n"
              "            if self.value is not None or self.conflicting_values:\n"
              "                raise SourceContractError(\"unknown source time cannot carry values\")\n"
              "            return\n"
              "        if self.precision is TimePrecision.CONFLICTING:\n"
              "            if self.value is not None:\n"
              "                raise SourceContractError(\"conflicting source time has no single value\")\n"
              "            bounded_text_tuple(\n"
              "                self.conflicting_values,\n"
              "                field=\"conflicting_source_times\",\n"
              "                maximum_items=8,\n"
              "                maximum_item_bytes=128,\n"
              "            )\n"
              "            if len(self.conflicting_values) < 2:\n"
              "                raise SourceContractError(\n"
              "                    \"conflicting source time requires at least two alternatives\"\n"
              "                )\n"
              "            return\n"
              "        if self.conflicting_values:\n"
              "            raise SourceContractError(\n"
              "                \"source time alternatives are valid only when conflicting\"\n"
              "            )\n"
              "        if self.value is None:\n"
              "            raise SourceContractError(\"known source time requires a value\")\n"
              "        bounded_text(\n"
              "            self.value,\n"
              "            field=\"source_time_value\",\n"
              "            maximum_bytes=128,\n"
              "        )\n"
              "        if self.precision is TimePrecision.EXACT:\n"
              "            UtcTimestamp.parse(self.value)\n",
              "        if self.precision is TimePrecision.UNKNOWN:\n"
              "            if self.value is not None or self.conflicting_values:\n"
              "                raise SourceContractError(\"unknown source time cannot carry values\")\n"
              "            return\n"
              "        if self.precision is TimePrecision.CONFLICTING:\n"
              "            if self.value is not None:\n"
              "                raise SourceContractError(\"conflicting source time has no single value\")\n"
              "            bounded_text_tuple(\n"
              "                self.conflicting_values,\n"
              "                field=\"conflicting_source_times\",\n"
              "                maximum_items=8,\n"
              "                maximum_item_bytes=128,\n"
              "            )\n"
              "            if len(self.conflicting_values) < 2:\n"
              "                raise SourceContractError(\n"
              "                    \"conflicting source time requires at least two alternatives\"\n"
              "                )\n"
              "            return\n"
              "        if self.conflicting_values:\n"
              "            raise SourceContractError(\n"
              "                \"source time alternatives are valid only when conflicting\"\n"
              "            )\n"
              "        if self.value is None:\n"
              "            raise SourceContractError(\"known source time requires a value\")\n"
              "        bounded_text(\n"
              "            self.value,\n"
              "            field=\"source_time_value\",\n"
              "            maximum_bytes=128,\n"
              "        )\n"
              "        if self.precision is TimePrecision.DATE_ONLY:\n"
              "            try:\n"
              "                parsed_date = date.fromisoformat(self.value)\n"
              "            except ValueError as exc:\n"
              "                raise SourceContractError(\"date-only source time is invalid\") from exc\n"
              "            if parsed_date.isoformat() != self.value:\n"
              "                raise SourceContractError(\"date-only source time is not canonical\")\n"
              "            return\n"
              "        parsed_time = UtcTimestamp.parse(self.value)\n"
              "        if parsed_time.to_text() != self.value:\n"
              "            raise SourceContractError(\"source time must use canonical UTC text\")\n",
          )

          # Stable item identity must not change when policy metadata or uncertainty wording changes.
          replace_once(
              "newsroom/sources/item_models.py",
              "                \"definition_id\": str(self.definition_id),\n"
              "                \"identity_kind\": self.identity_kind.value,\n"
              "                \"identity_policy\": self.identity_policy.canonical_value(),\n"
              "                \"source_native_id\": self.source_native_id,\n"
              "                \"identity_components\": [\n"
              "                    item.canonical_value() for item in self.identity_components\n"
              "                ],\n"
              "                \"uncertainties\": list(self.uncertainties),\n",
              "                \"definition_id\": str(self.definition_id),\n"
              "                \"identity_kind\": self.identity_kind.value,\n"
              "                \"source_native_id\": self.source_native_id,\n"
              "                \"identity_components\": [\n"
              "                    item.canonical_value() for item in self.identity_components\n"
              "                ],\n",
          )

          # Source Revision equality is source state, not code or policy version identity.
          replace_once(
              "newsroom/sources/observation_models.py",
              "                \"item_id\": str(self.item_id),\n"
              "                \"source_native_revision_token\": (\n"
              "                    self.source_native_revision_token\n"
              "                ),\n"
              "                \"permitted_state_digest\": self.permitted_state_digest,\n"
              "                \"revision_policy\": self.revision_policy.canonical_value(),\n"
              "                \"canonicalizer_version\": self.canonicalizer_version,\n",
              "                \"item_id\": str(self.item_id),\n"
              "                \"source_native_revision_token\": (\n"
              "                    self.source_native_revision_token\n"
              "                ),\n"
              "                \"permitted_state_digest\": self.permitted_state_digest,\n",
          )

          # Comparator metadata may coexist with an Anchor, but never substitutes for Active coverage.
          replace_once(
              "newsroom/sources/definition_models.py",
              "        if active and functions <= {PortfolioFunction.COMPARATOR}:\n"
              "            raise SourceContractError(\n"
              "                \"Comparator-only source cannot claim an Active detection path\"\n"
              "            )\n"
              "        if PortfolioFunction.COMPARATOR in functions:\n"
              "            for item in active:\n"
              "                if item.contribution is not CoverageContribution.COMPARATOR:\n"
              "                    raise SourceContractError(\n"
              "                        \"Comparator Active mapping cannot masquerade as production coverage\"\n"
              "                    )\n",
              "        if active and functions <= {PortfolioFunction.COMPARATOR}:\n"
              "            raise SourceContractError(\n"
              "                \"Comparator-only source cannot claim an Active detection path\"\n"
              "            )\n"
              "        if any(\n"
              "            item.contribution is CoverageContribution.COMPARATOR\n"
              "            for item in active\n"
              "        ):\n"
              "            raise SourceContractError(\n"
              "                \"Comparator mapping cannot claim Active coverage\"\n"
              "            )\n",
          )

          # A later version may explicitly revert to older semantics, but cannot be a no-op.
          replace_once(
              "newsroom/authority/source_registry_migrations.py",
              "        UNIQUE(definition_id,semantic_digest),\n",
              "",
          )
          replace_once(
              "newsroom/authority/source_registry_migrations.py",
              "    \"CREATE INDEX idx_source_items_definition ON source_items(definition_id,recorded_at)\",\n"
              "    \"CREATE INDEX idx_source_revisions_item ON source_revisions(item_id,recorded_at)\",\n",
              "    \"CREATE INDEX idx_source_items_definition ON source_items(definition_id,recorded_at)\",\n"
              "    \"CREATE UNIQUE INDEX idx_source_items_native_identity ON source_items(definition_id,source_native_id) WHERE source_native_id IS NOT NULL\",\n"
              "    \"CREATE INDEX idx_source_revisions_item ON source_revisions(item_id,recorded_at)\",\n"
              "    \"CREATE UNIQUE INDEX idx_source_revisions_native_token ON source_revisions(item_id,source_native_revision_token) WHERE source_native_revision_token IS NOT NULL\",\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_definitions.py",
              "from newsroom.sources.types import SourceVersionConflict\n",
              "from newsroom.sources.types import (\n"
              "    SourceSemanticCollision,\n"
              "    SourceVersionConflict,\n"
              ")\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_definitions.py",
              "            self._ensure_semantic_absent(\n"
              "                conn,\n"
              "                table=\"source_definition_versions\",\n"
              "                predicate=\"definition_id=? AND semantic_digest=?\",\n"
              "                parameters=(\n"
              "                    str(request.definition_id),\n"
              "                    request.semantic_digest,\n"
              "                ),\n"
              "                identity=\"source definition version semantics\",\n"
              "            )\n"
              "            current = self._current_version_row(\n"
              "                conn, request.definition_id\n"
              "            )\n",
              "            current = self._current_version_row(\n"
              "                conn, request.definition_id\n"
              "            )\n"
              "            if (\n"
              "                current is not None\n"
              "                and str(current[\"semantic_digest\"])\n"
              "                == request.semantic_digest\n"
              "            ):\n"
              "                raise SourceSemanticCollision(\n"
              "                    \"source definition version cannot be a semantic no-op\"\n"
              "                )\n",
          )

          # Bind native identifiers/tokens independently of mutable policy metadata.
          replace_once(
              "newsroom/authority/_source_registry_store_lineage.py",
              "            self._ensure_semantic_absent(\n"
              "                conn,\n"
              "                table=\"source_items\",\n"
              "                predicate=\"definition_id=? AND identity_digest=?\",\n"
              "                parameters=(\n"
              "                    str(request.definition_id),\n"
              "                    request.identity_digest,\n"
              "                ),\n"
              "                identity=\"source item semantics\",\n"
              "            )\n"
              "            recorded_at = self._clock().to_text()\n",
              "            self._ensure_semantic_absent(\n"
              "                conn,\n"
              "                table=\"source_items\",\n"
              "                predicate=\"definition_id=? AND identity_digest=?\",\n"
              "                parameters=(\n"
              "                    str(request.definition_id),\n"
              "                    request.identity_digest,\n"
              "                ),\n"
              "                identity=\"source item semantics\",\n"
              "            )\n"
              "            if request.source_native_id is not None:\n"
              "                self._ensure_semantic_absent(\n"
              "                    conn,\n"
              "                    table=\"source_items\",\n"
              "                    predicate=\"definition_id=? AND source_native_id=?\",\n"
              "                    parameters=(\n"
              "                        str(request.definition_id),\n"
              "                        request.source_native_id,\n"
              "                    ),\n"
              "                    identity=\"source-native item identity\",\n"
              "                )\n"
              "            recorded_at = self._clock().to_text()\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_lineage.py",
              "            self._ensure_semantic_absent(\n"
              "                conn,\n"
              "                table=\"source_revisions\",\n"
              "                predicate=\"item_id=? AND revision_identity_digest=?\",\n"
              "                parameters=(\n"
              "                    str(request.item_id),\n"
              "                    request.revision_identity_digest,\n"
              "                ),\n"
              "                identity=\"source revision semantics\",\n"
              "            )\n"
              "            latest = conn.execute(\n",
              "            self._ensure_semantic_absent(\n"
              "                conn,\n"
              "                table=\"source_revisions\",\n"
              "                predicate=\"item_id=? AND revision_identity_digest=?\",\n"
              "                parameters=(\n"
              "                    str(request.item_id),\n"
              "                    request.revision_identity_digest,\n"
              "                ),\n"
              "                identity=\"source revision semantics\",\n"
              "            )\n"
              "            if request.source_native_revision_token is not None:\n"
              "                self._ensure_semantic_absent(\n"
              "                    conn,\n"
              "                    table=\"source_revisions\",\n"
              "                    predicate=(\n"
              "                        \"item_id=? AND source_native_revision_token=?\"\n"
              "                    ),\n"
              "                    parameters=(\n"
              "                        str(request.item_id),\n"
              "                        request.source_native_revision_token,\n"
              "                    ),\n"
              "                    identity=\"source-native revision token\",\n"
              "                )\n"
              "            latest = conn.execute(\n",
          )

          # Sensitive source-native item/revision details must not use metadata scope.
          replace_once(
              "newsroom/authority/_source_registry_system.py",
              "            operation=\"read:source_registry:item\",\n"
              "            aggregate_type=\"source_item\",\n"
              "            aggregate_id=str(item_id),\n"
              "            sensitive=False,\n",
              "            operation=\"read:source_registry:item\",\n"
              "            aggregate_type=\"source_item\",\n"
              "            aggregate_id=str(item_id),\n"
              "            sensitive=True,\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_system.py",
              "            operation=\"read:source_registry:revision\",\n"
              "            aggregate_type=\"source_revision\",\n"
              "            aggregate_id=str(revision_id),\n"
              "            sensitive=False,\n",
              "            operation=\"read:source_registry:revision\",\n"
              "            aggregate_type=\"source_revision\",\n"
              "            aggregate_id=str(revision_id),\n"
              "            sensitive=True,\n",
          )

          # Rebind every normalized SQL column to retained canonical bytes on reopen.
          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "from collections.abc import Callable\n",
              "from collections.abc import Callable, Mapping\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "from newsroom.authority.persistence import AuthorityPersistenceError\n",
              "from newsroom.authority.canonical import canonical_json_bytes, digest_canonical\n"
              "from newsroom.authority.persistence import AuthorityPersistenceError\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "class _SourceRegistryReadMixin:\n"
              "    @staticmethod\n"
              "    def _row_by_id(\n",
              "class _SourceRegistryReadMixin:\n"
              "    @staticmethod\n"
              "    def _require_normalized_columns(\n"
              "        row: Mapping[str, Any],\n"
              "        expected: Mapping[str, object],\n"
              "        *,\n"
              "        identity: str,\n"
              "    ) -> None:\n"
              "        for column, value in expected.items():\n"
              "            if row[column] != value:\n"
              "                raise AuthorityPersistenceError(\n"
              "                    f\"{identity} column {column} differs from canonical bytes\"\n"
              "                )\n"
              "\n"
              "    @staticmethod\n"
              "    def _require_canonical_blob(\n"
              "        row: Mapping[str, Any],\n"
              "        column: str,\n"
              "        value: object,\n"
              "        *,\n"
              "        identity: str,\n"
              "    ) -> None:\n"
              "        if row[column] is None or bytes(row[column]) != canonical_json_bytes(value):\n"
              "            raise AuthorityPersistenceError(\n"
              "                f\"{identity} column {column} differs from canonical bytes\"\n"
              "            )\n"
              "\n"
              "    @staticmethod\n"
              "    def _row_by_id(\n",
          )

          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "        request = decode_source_item(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n",
              "        request = decode_source_item(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n"
              "        self._require_normalized_columns(\n"
              "            row,\n"
              "            {\n"
              "                \"definition_id\": str(request.definition_id),\n"
              "                \"definition_version_id\": str(request.definition_version_id),\n"
              "                \"identity_kind\": request.identity_kind.value,\n"
              "                \"identity_policy_id\": request.identity_policy.policy_id,\n"
              "                \"identity_policy_version\": request.identity_policy.policy_version,\n"
              "                \"source_native_id\": request.source_native_id,\n"
              "                \"identity_digest\": request.identity_digest,\n"
              "            },\n"
              "            identity=\"source item\",\n"
              "        )\n"
              "        self._require_canonical_blob(\n"
              "            row,\n"
              "            \"identity_components_bytes\",\n"
              "            [item.canonical_value() for item in request.identity_components],\n"
              "            identity=\"source item\",\n"
              "        )\n"
              "        self._require_canonical_blob(\n"
              "            row,\n"
              "            \"uncertainties_bytes\",\n"
              "            list(request.uncertainties),\n"
              "            identity=\"source item\",\n"
              "        )\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "        request = decode_locator_continuity(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n",
              "        request = decode_locator_continuity(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n"
              "        prior_locator_digest = digest_canonical(\n"
              "            {\n"
              "                \"definition_id\": str(request.definition_id),\n"
              "                \"locator\": request.prior_locator,\n"
              "            }\n"
              "        )\n"
              "        observed_locator_digest = digest_canonical(\n"
              "            {\n"
              "                \"definition_id\": str(request.definition_id),\n"
              "                \"locator\": request.observed_locator,\n"
              "            }\n"
              "        )\n"
              "        self._require_normalized_columns(\n"
              "            row,\n"
              "            {\n"
              "                \"definition_id\": str(request.definition_id),\n"
              "                \"definition_version_id\": str(request.definition_version_id),\n"
              "                \"prior_item_id\": str(request.prior_item_id),\n"
              "                \"prior_locator\": request.prior_locator,\n"
              "                \"prior_locator_digest\": prior_locator_digest,\n"
              "                \"observed_locator\": request.observed_locator,\n"
              "                \"observed_locator_digest\": observed_locator_digest,\n"
              "                \"outcome\": request.outcome.value,\n"
              "                \"related_item_id\": str(request.related_item_id),\n"
              "                \"rationale\": request.rationale,\n"
              "                \"decision_policy_id\": request.decision_policy.policy_id,\n"
              "                \"decision_policy_version\": request.decision_policy.policy_version,\n"
              "                \"observed_at\": request.observed_at.to_text(),\n"
              "                \"semantic_digest\": request.semantic_digest,\n"
              "            },\n"
              "            identity=\"locator continuity decision\",\n"
              "        )\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "        request = decode_source_revision(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n",
              "        request = decode_source_revision(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n"
              "        item = self._item_row(conn, str(request.item_id))\n"
              "        self._require_normalized_columns(\n"
              "            row,\n"
              "            {\n"
              "                \"item_id\": str(request.item_id),\n"
              "                \"definition_id\": str(item[\"definition_id\"]),\n"
              "                \"definition_version_id\": str(request.definition_version_id),\n"
              "                \"prior_revision_id\": (\n"
              "                    None\n"
              "                    if request.prior_revision_id is None\n"
              "                    else str(request.prior_revision_id)\n"
              "                ),\n"
              "                \"source_native_revision_token\": request.source_native_revision_token,\n"
              "                \"permitted_state_digest\": request.permitted_state_digest,\n"
              "                \"revision_policy_id\": request.revision_policy.policy_id,\n"
              "                \"revision_policy_version\": request.revision_policy.policy_version,\n"
              "                \"canonicalizer_version\": request.canonicalizer_version,\n"
              "                \"observed_at\": request.observed_at.to_text(),\n"
              "                \"revision_identity_digest\": request.revision_identity_digest,\n"
              "            },\n"
              "            identity=\"source revision\",\n"
              "        )\n"
              "        self._require_canonical_blob(\n"
              "            row,\n"
              "            \"source_published_time_bytes\",\n"
              "            request.source_published_time.canonical_value(),\n"
              "            identity=\"source revision\",\n"
              "        )\n"
              "        self._require_canonical_blob(\n"
              "            row,\n"
              "            \"source_updated_time_bytes\",\n"
              "            request.source_updated_time.canonical_value(),\n"
              "            identity=\"source revision\",\n"
              "        )\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "        request = decode_representation(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n",
              "        request = decode_representation(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n"
              "        revision = self._revision_row(conn, str(request.revision_id))\n"
              "        self._require_normalized_columns(\n"
              "            row,\n"
              "            {\n"
              "                \"revision_id\": str(request.revision_id),\n"
              "                \"definition_id\": str(revision[\"definition_id\"]),\n"
              "                \"definition_version_id\": str(request.definition_version_id),\n"
              "                \"adapter_version\": request.adapter_version,\n"
              "                \"parser_version\": request.parser_version,\n"
              "                \"normalizer_version\": request.normalizer_version,\n"
              "                \"extraction_scope_version\": request.extraction_scope_version,\n"
              "                \"permitted_fields_digest\": request.permitted_fields_digest,\n"
              "                \"representation_digest\": request.representation_digest,\n"
              "                \"producer_slot_digest\": request.producer_slot_digest,\n"
              "                \"representation_identity_digest\": request.representation_identity_digest,\n"
              "                \"produced_at\": request.produced_at.to_text(),\n"
              "            },\n"
              "            identity=\"discovery representation\",\n"
              "        )\n",
          )
          replace_once(
              "newsroom/authority/_source_registry_store_read.py",
              "        request = decode_occurrence(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n",
              "        request = decode_occurrence(\n"
              "            value, idempotency_key=str(event[\"idempotency_key\"])\n"
              "        )\n"
              "        revision = self._revision_row(conn, str(request.revision_id))\n"
              "        self._require_normalized_columns(\n"
              "            row,\n"
              "            {\n"
              "                \"check_outcome_id\": str(request.check_outcome_id),\n"
              "                \"revision_id\": str(request.revision_id),\n"
              "                \"representation_id\": (\n"
              "                    None\n"
              "                    if request.representation_id is None\n"
              "                    else str(request.representation_id)\n"
              "                ),\n"
              "                \"definition_id\": str(revision[\"definition_id\"]),\n"
              "                \"definition_version_id\": str(request.definition_version_id),\n"
              "                \"occurrence_kind\": request.kind.value,\n"
              "                \"observed_at\": request.observed_at.to_text(),\n"
              "                \"receipt_digest\": request.receipt_digest,\n"
              "                \"semantic_digest\": request.semantic_digest,\n"
              "            },\n"
              "            identity=\"discovery occurrence\",\n"
              "        )\n"
              "        self._require_canonical_blob(\n"
              "            row,\n"
              "            \"source_asserted_time_bytes\",\n"
              "            request.source_asserted_time.canonical_value(),\n"
