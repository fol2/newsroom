name: Increment 3A local evidence cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-evidence-cleanup.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-local-evidence-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Remove local-only evidence and cleanup workflow
        run: |
          set -euo pipefail
          test -f increment-3a-service-margin-ms.txt
          test -f increment-3a-service-margin.log
          test -f increment-3a-service-margin.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            increment-3a-service-margin-ms.txt \
            increment-3a-service-margin.log \
            increment-3a-service-margin.xml \
            .github/workflows/increment-3a-evidence-cleanup.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): remove local Increment 3A timing evidence"
          git push origin HEAD:agent/increment-3a-source-registry
