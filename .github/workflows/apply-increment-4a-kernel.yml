name: Apply Increment 4A kernel transport

on:
  push:
    branches:
      - agent/increment-4a-extraction-run-authority
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-verified-kernel:
    if: github.ref_name == 'agent/increment-4a-extraction-run-authority' || github.head_ref == 'agent/increment-4a-extraction-run-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-4a-extraction-run-authority
          fetch-depth: 0
          show-progress: false
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Verify, apply and test exact kernel
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/increment-4a-kernel
          test "$(git branch --show-current)" = "agent/increment-4a-extraction-run-authority"

          cat \
            .github/increment-4a-kernel/part-00-segments/seg-00 \
            .github/increment-4a-kernel/part-00-segments/seg-01 \
            .github/increment-4a-kernel/part-00-segments/seg-02 \
            .github/increment-4a-kernel/part-00-segments/seg-03 \
            .github/increment-4a-kernel/part-00-segments/seg-04 \
            .github/increment-4a-kernel/part-00-segments/seg-05 \
            .github/increment-4a-kernel/part-00-segments/seg-06 \
            .github/increment-4a-kernel/part-00-segments/seg-07 \
            .github/increment-4a-kernel/part-01 \
            .github/increment-4a-kernel/part-02 \
            .github/increment-4a-kernel/part-03 \
            .github/increment-4a-kernel/part-04 \
            .github/increment-4a-kernel/part-05 \
            .github/increment-4a-kernel/part-06 \
            > "$RUNNER_TEMP/increment-4a-kernel.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/increment-4a-kernel.patch.gz.b64")" -eq 55188
          printf '%s  %s\n' \
            '5cbabc48cea736cdae9edd7cdddb35c4aa3969f26e8df23ac403685507f03f84' \
            "$RUNNER_TEMP/increment-4a-kernel.patch.gz.b64" | sha256sum --check --strict -

          base64 --decode "$RUNNER_TEMP/increment-4a-kernel.patch.gz.b64" \
            > "$RUNNER_TEMP/increment-4a-kernel.patch.gz"
          printf '%s  %s\n' \
            'b7bdbbb1e597f1fb29ab7ee21095de0af6d7bd36802b7946f7855b92faca2e5d' \
            "$RUNNER_TEMP/increment-4a-kernel.patch.gz" | sha256sum --check --strict -

          gzip --decompress --stdout "$RUNNER_TEMP/increment-4a-kernel.patch.gz" \
            > "$RUNNER_TEMP/increment-4a-kernel.patch"
          printf '%s  %s\n' \
            '2588d0e4118ebe0d0c0f5e04851053c9ee22db1a1d7e4735839f3d2c9c0c01e7' \
            "$RUNNER_TEMP/increment-4a-kernel.patch" | sha256sum --check --strict -

          git apply --check "$RUNNER_TEMP/increment-4a-kernel.patch"
          git apply "$RUNNER_TEMP/increment-4a-kernel.patch"
          python - <<'PYFIX'
          from pathlib import Path

          path = Path("newsroom/authority/_extraction_store_common.py")
          text = path.read_text()
          old = '            "WHERE d.blob_digest=? AND dv.state IN(" \n'
          new = '            "WHERE d.blob_digest=? AND dv.state IN("\n'
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one checked trailing-space target, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new))
          PYFIX
          rm -rf .github/increment-4a-kernel
          rm -f .github/workflows/apply-increment-4a-kernel.yml

          git diff --check
          python -m compileall -q newsroom
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m pip install --disable-pip-version-check --quiet . 'pytest==9.0.2'
          python -m pytest -q newsroom/tests/test_extraction_4a_authority.py -p no:cacheprovider
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test ! -e .github/workflows/apply-increment-4a-kernel.yml
          test ! -e .github/increment-4a-kernel

      - name: Commit clean durable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(extraction): add Increment 4A authority kernel'
          git push origin HEAD:agent/increment-4a-extraction-run-authority
