name: Temporary SDLC prewarmed-core evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-sdlc-five-worker-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Precompile exact repository Python sources outside lane budget
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s%3N)"
          uv run --no-sync python -m compileall -q newsroom scripts
          finished="$(date +%s%3N)"
          echo "precompile_elapsed_ms=$((finished - started))"
          test -d newsroom/__pycache__
          test -d scripts/__pycache__

      - name: Execute unchanged canonical core lane under immutable budget
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sdlc-prewarmed-evaluation
          mkdir -p .sdlc-prewarmed-evaluation
          started="$(date +%s%3N)"
          set +e
          timeout --signal=TERM --kill-after=2s 110s \
            uv run --no-sync python -m scripts.sdlc.workflow_lane \
              core-tests \
              --repo-root . \
              --report .sdlc-prewarmed-evaluation/pytest.xml \
            > .sdlc-prewarmed-evaluation/output.log 2>&1
          status="$?"
          set -e
          finished="$(date +%s%3N)"
          cat .sdlc-prewarmed-evaluation/output.log
          echo "prewarmed_core_elapsed_ms=$((finished - started))"
          echo "prewarmed_core_status=${status}"
          test "${status}" -eq 0
          test -s .sdlc-prewarmed-evaluation/pytest.xml

      - name: Verify exact successful JUnit inventory and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(".sdlc-prewarmed-evaluation/pytest.xml")
          root = ET.parse(report).getroot()
          tests = failures = errors = skips = 0
          for suite in root.iter("testsuite"):
              tests += int(suite.attrib.get("tests", "0"))
              failures += int(suite.attrib.get("failures", "0"))
              errors += int(suite.attrib.get("errors", "0"))
              skips += int(suite.attrib.get("skipped", "0"))
          summary = (tests, failures, errors, skips)
          print(f"prewarmed_junit={summary}")
          if summary != (1954, 0, 0, 38):
              raise SystemExit(f"unexpected JUnit summary: {summary}")
          PY
          git diff --exit-code
