name: Temporary SDLC load-scheduler evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-sdlc-five-worker-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Substitute four-worker load scheduling in workspace only
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          source = Path("scripts/sdlc/workflow_lane.py")
          text = source.read_text(encoding="utf-8")
          old = '_CORE_DISTRIBUTION = "worksteal"\n'
          if text.count(old) != 1:
              raise SystemExit("canonical distribution source differs")
          source.write_text(
              text.replace(old, '_CORE_DISTRIBUTION = "load"\n', 1),
              encoding="utf-8",
              newline="\n",
          )

          for relative in (
              "newsroom/tests/test_sdlc_core_worker_capacity.py",
              "newsroom/tests/test_sdlc_workflow_lane.py",
          ):
              path = Path(relative)
              value = path.read_text(encoding="utf-8")
              if "worksteal" not in value:
                  raise SystemExit(f"scheduler expectation missing: {relative}")
              path.write_text(
                  value.replace("worksteal", "load"),
                  encoding="utf-8",
                  newline="\n",
              )
          PY

      - name: Execute exact core command under immutable budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sdlc-load-evaluation
          started="$(date +%s%3N)"
          set +e
          timeout --signal=TERM --kill-after=2s 110s \
            uv run --no-sync python -m scripts.sdlc.workflow_lane \
              core-tests \
              --repo-root . \
              --report .sdlc-load-evaluation/pytest.xml \
            > .sdlc-load-evaluation/output.log 2>&1
          status="$?"
          set -e
          finished="$(date +%s%3N)"
          cat .sdlc-load-evaluation/output.log
          echo "load_scheduler_elapsed_ms=$((finished - started))"
          echo "load_scheduler_status=${status}"
          test "${status}" -eq 0
          test -s .sdlc-load-evaluation/pytest.xml

      - name: Prove workspace-only substitution
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- \
            scripts/sdlc/workflow_lane.py \
            newsroom/tests/test_sdlc_core_worker_capacity.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          test "$(git diff --name-only | wc -l)" -eq 3
