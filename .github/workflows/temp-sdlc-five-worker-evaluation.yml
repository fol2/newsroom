name: Temporary SDLC five-worker evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-sdlc-five-worker-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Substitute five persistent worksteal workers in workspace only
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          path = Path("scripts/sdlc/workflow_lane.py")
          text = path.read_text(encoding="utf-8")
          old = "_CORE_WORKER_COUNT = 4\n"
          if text.count(old) != 1:
              raise SystemExit("canonical worker count source differs")
          path.write_text(
              text.replace(old, "_CORE_WORKER_COUNT = 5\n", 1),
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Execute exact core command under immutable budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sdlc-five-worker
          started="$(date +%s%3N)"
          set +e
          timeout --signal=TERM --kill-after=2s 110s \
            uv run --no-sync python -m scripts.sdlc.workflow_lane \
              core-tests \
              --repo-root . \
              --report .sdlc-five-worker/pytest.xml \
            > .sdlc-five-worker/output.log 2>&1
          status="$?"
          set -e
          finished="$(date +%s%3N)"
          cat .sdlc-five-worker/output.log
          echo "five_worker_elapsed_ms=$((finished - started))"
          echo "five_worker_status=${status}"
          test "${status}" -eq 0
          test -s .sdlc-five-worker/pytest.xml

      - name: Prove workspace-only substitution
        shell: bash
        run: |
          set -euo pipefail
          git diff -- scripts/sdlc/workflow_lane.py
          test "$(git diff --numstat -- scripts/sdlc/workflow_lane.py | awk '{print $1 ":" $2}')" = "1:1"
