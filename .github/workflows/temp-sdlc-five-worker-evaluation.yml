name: Temporary SDLC minimal-plugin evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-sdlc-five-worker-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/increment-5a-retrieval-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Execute complete suite with unused built-ins disabled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sdlc-minimal-plugin/pytest
          started="$(date +%s%3N)"
          set +e
          timeout --signal=TERM --kill-after=2s 110s \
            uv run --no-sync python -m pytest \
              -qq \
              --tb=no \
              --no-header \
              --assert=plain \
              -p no:cacheprovider \
              -p no:warnings \
              -p no:logging \
              -p no:doctest \
              -p no:faulthandler \
              -p no:unraisableexception \
              -p no:threadexception \
              -p no:pastebin \
              -p no:stepwise \
              -p xdist.plugin \
              -n 4 \
              --dist=worksteal \
              --max-worker-restart=0 \
              newsroom/tests \
              --basetemp=.sdlc-minimal-plugin/pytest \
              --junitxml=.sdlc-minimal-plugin/pytest.xml \
            > .sdlc-minimal-plugin/output.log 2>&1
          status="$?"
          set -e
          finished="$(date +%s%3N)"
          cat .sdlc-minimal-plugin/output.log
          echo "minimal_plugin_elapsed_ms=$((finished - started))"
          echo "minimal_plugin_status=${status}"
          test "${status}" -eq 0
          test -s .sdlc-minimal-plugin/pytest.xml

      - name: Prove repository source was not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
