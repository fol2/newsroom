name: Apply Increment 3E live observation chronology correction

on:
  push:
    branches:
      - agent/increment-3e-corrective-hardening
    paths:
      - .github/workflows/apply-increment-3e-live-observation-chronology.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked tooling
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Apply and verify the bounded chronology correction
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONHASHSEED: '0'
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('newsroom/projection/neo4j/discovery_lineage_reads.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected source marker: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '        reconciliation_valid = retained_validation_valid\n'
              '        if status.generation_state is ProjectionGenerationState.ACTIVE:\n',
              '        reconciliation_valid = retained_validation_valid\n'
              '        reconciliation: StructuralReconciliationView | None = None\n'
              '        response: StructuralReadResponse | None = None\n'
              '        if status.generation_state is ProjectionGenerationState.ACTIVE:\n',
          )
          replace_once(
              '                self._reconcile(status=status, proof=proof)\n',
              '                reconciliation = self._reconcile(\n'
              '                    status=status,\n'
              '                    proof=proof,\n'
              '                )\n',
          )

          start_marker = (
              '        # The live status observation is taken inside this assessment call and\n'
          )
          end_marker = '        return assess_projection_health(\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0 or text.find(start_marker, start + 1) >= 0:
              raise SystemExit('unable to select the assessment chronology block')
          replacement = '\n'.join(
              (
                  '        # Status, successful reconciliation and a returned active read are live',
                  '        # observations taken inside this assessment call. They may follow the',
                  "        # caller's lower-bound timestamp and must bound the health decision.",
                  '        # Persisted validation, gap and dead-letter evidence cannot advance the',
                  '        # clock; future retained evidence therefore still fails closed.',
                  '        live_observations = [assessed_at, status.serving_time]',
                  '        if reconciliation is not None:',
                  '            live_observations.append(reconciliation.serving_time)',
                  '        if response is not None:',
                  '            live_observations.append(response.metadata.serving_time)',
                  '        effective_assessed_at = max(',
                  '            live_observations,',
                  '            key=lambda item: item.value,',
                  '        )',
                  '',
                  '',
              )
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_projection_3e_health_chronology.py \
            newsroom/tests/test_discovery_projection_3e_health.py \
            newsroom/tests/test_discovery_projection_3e_reads.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          git diff --check

      - name: Publish code only and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-increment-3e-live-observation-chronology.yml
          git config user.name newsroom-ci
          git config user.email newsroom-ci@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git commit -m "fix(projection): bound health by all live observations"
          git push origin HEAD:${GITHUB_REF_NAME}
