name: agent-increment2d-fixture-id-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2d-fixture-id-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: fcbbe29651062a8e047a0c7490169ab97ce40d0b
      EXPECTED_BASE_TREE: 7ed0cef7c911d8f495d03fc1025ae2b2403c018c
      EXPECTED_TREE: d55d9b2b30887732437efdd4644df81cf20c6786
      PATCH_SHA256: c780b262a3e5aecf8287bdb52c04a02e97105b8a50f30e3a39ab2bf0b209ce91
      TARGET_BRANCH: agent/increment-2d-complete-actual-neo4j-proof
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct exact fixture-identity correction
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/increment2d-fixture-id/fix.patch.gz.b64 \
            > /tmp/increment2d-fixture-id.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2d-fixture-id.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2d-fixture-id.patch.gz \
            > /tmp/increment2d-fixture-id.patch

      - name: Apply and verify exact correction tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_BASE_TREE"
          git apply --index /tmp/increment2d-fixture-id.patch
          cat > /tmp/expected-paths <<'EOF'
          docs/operations/increment-2d-complete-actual-neo4j-proof.md
          docs/research/2026-07-27-increment-2d-substantive-review.md
          newsroom/tests/test_increment_2d_neo4j_service.py
          newsroom/tests/test_increment_2d_proof_controller.py
          newsroom/tests/test_increment_2d_traceability.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked fixture-identity gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_proof_controller.py \
            newsroom/tests/test_increment_2d_neo4j_service.py \
            newsroom/tests/test_increment_2d_traceability.py \
            newsroom/tests/test_retrieval_2c_authority.py \
            newsroom/tests/test_relation_2a_lifecycle_integrity.py \
            newsroom/tests/test_complete_projection_2b_authority.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
            --repo-root . \
            --report increment2d-fixture-id-core.xml \
            --clustering
          uv run --no-sync python - <<'PY'
          from scripts.sdlc.junit_evidence import summarize_junit
          from scripts.sdlc.workflow_lane import _OPTIONAL_CORE_TEST_IDS
          summary = summarize_junit(
              '.',
              ('increment2d-fixture-id-core.xml',),
              optional_test_ids=_OPTIONAL_CORE_TEST_IDS,
          )
          if (
              summary.outcome != 'PASS'
              or summary.test_count != 1240
              or summary.skip_count != 32
              or summary.required_skip_count != 0
          ):
              raise SystemExit('fixture-identity core summary differs')
          PY
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Create and push clean correction commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2D Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(increment2): use canonical fixture identity in actual proof' \
            'Pass the repository-owned fixture UUID through actual-service preparation, retain strict alias rejection, and record the corrected Increment 2D evidence.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORISED_PARENT" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
