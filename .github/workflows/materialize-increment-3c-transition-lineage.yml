name: Materialize Increment 3C transition lineage correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Apply exact lineage correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('newsroom/checks/transition_models.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'        if \(\n'
              r'            self\.representation_id is None\n'
              r'            and self\.current_revision_id is not None\n'
              r'        \):\n'
              r'            raise CheckContractError\(\n'
              r'                "current Revision transition requires Representation"\n'
              r'            \)\n'
          )
          replacement = (
              '        if (self.current_revision_id is None) != (\n'
              '            self.representation_id is None\n'
              '        ):\n'
              '            raise CheckContractError(\n'
              '                "transition current Revision and Representation move together"\n'
              '            )\n'
          )
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(
                  f'reviewed transition-lineage boundary matched {count} times'
              )
          path.write_text(updated, encoding='utf-8')
          PY
          python -m compileall -q newsroom/checks newsroom/tests
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete regression suites
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_contracts.py \
            newsroom/tests/test_check_3c_baselines.py \
            newsroom/tests/test_check_3c_transitions.py \
            newsroom/tests/test_check_3c_agenda.py \
            newsroom/tests/test_check_3c_findings.py \
            newsroom/tests/test_check_3c_traceability.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified clean correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-increment-3c-transition-lineage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newsroom/checks/transition_models.py \
            .github/workflows/materialize-increment-3c-transition-lineage.yml
          git diff --cached --check
          git commit -m 'fix(checks): bind transition representation lineage'
          git push origin HEAD:agent/increment-3c-check-transition-authority
