name: agent-increment2d-proof-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-increment2d-proof-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: 7a422a978a3573ed446dc5d320d3f7dc4c70997a
      EXPECTED_BASE_TREE: 7e658d4b2e613ac7cd0e3d49367d09183dee8df5
      EXPECTED_TREE: 0b006ddfd2beb2af95e1978a09e099e016ddd65c
      PATCH_SHA256: e7b746531fbdab44175535b105e0b198d1d50f83c4033238e6ad91bbbbed25cb
      TARGET_BRANCH: agent/increment-2d-complete-actual-neo4j-proof
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct exact complete-proof patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/increment2d-proof/part-000 \
            .github/increment2d-proof/part-001 \
            | base64 --decode > /tmp/increment2d-proof.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2d-proof.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2d-proof.patch.gz \
            > /tmp/increment2d-proof.patch

      - name: Apply and verify exact proof tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$AUTHORISED_PARENT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_BASE_TREE"
          git apply --index /tmp/increment2d-proof.patch
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/evidence.yml
          .github/workflows/projection-b2-neo4j.yml
          newsroom/increment2/__init__.py
          newsroom/increment2/proof.py
          newsroom/tests/test_increment_2d_neo4j_service.py
          newsroom/tests/test_increment_2d_proof_controller.py
          newsroom/tests/test_integrated_c1_sdlc_contract.py
          newsroom/tests/test_sdlc_classifier.py
          newsroom/tests/test_sdlc_evidence_workflow.py
          newsroom/tests/test_sdlc_workflow_lane.py
          scripts/sdlc/workflow_lane.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked complete-proof gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m compileall -q newsroom scripts
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_proof_controller.py \
            newsroom/tests/test_increment_2d_neo4j_service.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
            --repo-root . \
            --report increment2d-proof-core.xml \
            --clustering
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Create and push clean proof checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2D Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'feat(increment2): add complete fixture proof controller' \
            'Add the authority-neutral complete Increment 2 proof facade, exact replay and restart checks, permanent actual-service topology, and fail-closed graph/index surface-loss evidence.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$AUTHORISED_PARENT" \
            origin "$commit:refs/heads/$TARGET_BRANCH"
