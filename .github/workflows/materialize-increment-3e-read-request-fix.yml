name: Materialize Increment 3E exact read-request correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-discovery-projection-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact Increment 3E branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3e-discovery-projection-health
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Verify and apply exact read-request correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          base = '349d1a8bb30330e8f5f42788778528fd978bae36'
          patch_path = Path('.github/increment-3e-read-request-fix.patch')
          workflow = '.github/workflows/materialize-increment-3e-read-request-fix.yml'
          expected_patch = '''diff --git a/newsroom/tests/discovery_projection_3e_neo4j_helpers.py b/newsroom/tests/discovery_projection_3e_neo4j_helpers.py
          --- a/newsroom/tests/discovery_projection_3e_neo4j_helpers.py
          +++ b/newsroom/tests/discovery_projection_3e_neo4j_helpers.py
          @@ -244,7 +244,8 @@ def run_actual_service_projects_complete_lineage_and_recovers_graph_loss(
                   assert promoted.generation.state is ProjectionGenerationState.ACTIVE
           
                   facade = DiscoveryLineageProjectionFacade.from_system(system)
          -        initial = facade.read(_read_request(), proof=proof())
          +        read_request = _read_request()
          +        initial = facade.read(read_request, proof=proof())
                   assert {node.node_type for node in initial.nodes} >= {
                       subject.node_type for subject in _subjects()
                   }
          @@ -272,7 +273,7 @@ def run_actual_service_projects_complete_lineage_and_recovers_graph_loss(
                   ):
                       system.structural.rebuild(rebuild_request, proof=proof())
                   assert system.events.after(0, limit=1_000, proof=proof()) == before_replay
          -        assert facade.read(_read_request(), proof=proof()) == initial
          +        assert facade.read(read_request, proof=proof()) == initial
          '''
          # Remove YAML block indentation from the embedded patch.
          expected_patch = ''.join(
              line[10:] if line.startswith('          ') else line
              for line in expected_patch.splitlines(keepends=True)
          )

          if subprocess.check_output(['git', 'rev-parse', 'HEAD~2'], text=True).strip() != base:
              raise SystemExit('Increment 3E read-request transport base differs')
          changed = tuple(sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..HEAD', '--'], text=True
          ).splitlines()))
          expected_changes = tuple(sorted((str(patch_path), workflow)))
          if changed != expected_changes:
              raise SystemExit(f'Increment 3E read-request transport inventory differs: {changed!r}')
          if patch_path.read_text(encoding='utf-8') != expected_patch:
              raise SystemExit('Increment 3E read-request patch bytes differ')
          PY
          git apply --check .github/increment-3e-read-request-fix.patch
          git apply .github/increment-3e-read-request-fix.patch
          rm -f .github/increment-3e-read-request-fix.patch
          rm -f .github/workflows/materialize-increment-3e-read-request-fix.yml
          python -m compileall -q newsroom scripts
          git diff --check

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_projection_3e_lifecycle.py \
            newsroom/tests/test_integrated_c1_workflow_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified read-request correction
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(projection): bind graph-loss proof to one exact read request'
          git push origin HEAD:agent/increment-3e-discovery-projection-health
