name: Materialize parallel SDLC service evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/sdlc-parallel-service-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEO4J_B2_IMAGE: neo4j:2026.06.0-community-trixie
      NEO4J_URI: bolt://localhost:7687
      NEO4J_ADMIN_USERNAME: neo4j
      NEWSROOM_NEO4J_DATABASE: neo4j
      NEWSROOM_NEO4J_PROJECTOR_USERNAME: newsroom_projector
      NEWSROOM_NEO4J_URI: bolt://localhost:7687
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/sdlc-parallel-service-evidence
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Verify and apply exact service-sharding patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          manifest_path = root / '.github/sdlc-service-parallel-manifest.json'
          payload_path = root / '.github/sdlc-service-parallel.patch.b64'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('schema_version') != 'newsroom.sdlc.service-parallel-materializer.v1':
              raise SystemExit('unexpected service-sharding manifest schema')

          expected_temporary = tuple(manifest['temporary_paths'])
          actual_changed = tuple(
              sorted(
                  subprocess.check_output(
                      ['git', 'diff', '--name-only', 'origin/main...HEAD', '--'],
                      text=True,
                  ).splitlines()
              )
          )
          if actual_changed != tuple(sorted(expected_temporary)):
              raise SystemExit(
                  'repair branch contains non-transport changes before materialization: '
                  + repr(actual_changed)
              )

          for relative, expected_blob in manifest['base_file_blobs'].items():
              actual_blob = subprocess.check_output(
                  ['git', 'hash-object', '--', relative], text=True
              ).strip()
              if actual_blob != expected_blob:
                  raise SystemExit(f'base file differs for {relative}: {actual_blob}')

          encoded = payload_path.read_text(encoding='ascii')
          if not encoded.endswith('\n'):
              raise SystemExit('service-sharding payload lacks canonical newline')
          compact = encoded[:-1]
          if len(compact) != manifest['payload_base64_size']:
              raise SystemExit('service-sharding base64 size differs')
          compressed = base64.b64decode(compact, validate=True)
          if len(compressed) != manifest['gzip_size']:
              raise SystemExit('service-sharding gzip size differs')
          if hashlib.sha256(compressed).hexdigest() != manifest['gzip_sha256']:
              raise SystemExit('service-sharding gzip digest differs')
          patch = gzip.decompress(compressed)
          if len(patch) != manifest['patch_size']:
              raise SystemExit('service-sharding patch size differs')
          if hashlib.sha256(patch).hexdigest() != manifest['patch_sha256']:
              raise SystemExit('service-sharding patch digest differs')
          Path('/tmp/sdlc-service-parallel.patch').write_bytes(patch)
          PY
          git apply --check /tmp/sdlc-service-parallel.patch
          git apply /tmp/sdlc-service-parallel.patch
          rm -f \
            .github/sdlc-service-parallel-manifest.json \
            .github/sdlc-service-parallel.patch.b64 \
            .github/workflows/materialize-sdlc-service-parallel.yml
          python -m compileall -q newsroom scripts
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python - <<'PY'
          import neo4j
          import pytest
          import sys

          assert sys.version_info[:2] == (3, 12), sys.version
          assert neo4j.__version__ == '6.2.0', neo4j.__version__
          assert pytest.__version__
          PY
          uv run --no-sync python -m compileall -q newsroom scripts

      - name: Run focused and complete local regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q newsroom/tests/test_sdlc_workflow_lane.py
          uv run --no-sync python -m pytest -q newsroom/tests/test_sdlc_*.py
          mkdir -p .sdlc-materializer
          uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
            --repo-root . \
            --report .sdlc-materializer/core.xml
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Generate masked credentials and start Neo4j
        shell: bash
        run: |
          set -euo pipefail
          NEO4J_ADMIN_PASSWORD="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          NEWSROOM_NEO4J_PROJECTOR_PASSWORD="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "::add-mask::${NEO4J_ADMIN_PASSWORD}"
          echo "::add-mask::${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}"
          admin_file="${RUNNER_TEMP}/newsroom-sdlc-parallel-admin.env"
          projector_file="${RUNNER_TEMP}/newsroom-sdlc-parallel-projector.env"
          umask 077
          printf 'NEO4J_ADMIN_PASSWORD=%s\n' "${NEO4J_ADMIN_PASSWORD}" > "${admin_file}"
          printf 'NEWSROOM_NEO4J_PROJECTOR_PASSWORD=%s\n' "${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}" > "${projector_file}"
          chmod 600 "${admin_file}" "${projector_file}"
          timeout --signal=TERM --kill-after=5s 55s docker pull "${NEO4J_B2_IMAGE}"
          timeout --signal=TERM --kill-after=2s 10s \
            docker run --detach --pull=never \
              --name newsroom-sdlc-parallel-neo4j \
              --publish 127.0.0.1:7687:7687 \
              --env "NEO4J_AUTH=neo4j/${NEO4J_ADMIN_PASSWORD}" \
              "${NEO4J_B2_IMAGE}"

      - name: Wait for authenticated Neo4j and create projector
        shell: bash
        run: |
          set -euo pipefail
          admin_file="${RUNNER_TEMP}/newsroom-sdlc-parallel-admin.env"
          projector_file="${RUNNER_TEMP}/newsroom-sdlc-parallel-projector.env"
          set -a
          source "${admin_file}"
          source "${projector_file}"
          set +a
          uv run --no-sync python - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          uri = os.environ['NEO4J_URI']
          admin_auth = (
              os.environ['NEO4J_ADMIN_USERNAME'],
              os.environ['NEO4J_ADMIN_PASSWORD'],
          )
          deadline = time.monotonic() + 25.0
          last_error = None
          driver = None
          while time.monotonic() < deadline:
              try:
                  driver = GraphDatabase.driver(
                      uri, auth=admin_auth, connection_timeout=1.0
                  )
                  driver.verify_connectivity()
                  break
              except Exception as exc:
                  last_error = exc
                  if driver is not None:
                      driver.close()
                  driver = None
                  time.sleep(0.25)
          else:
              raise RuntimeError('authenticated Neo4j readiness timed out') from last_error
          assert driver is not None
          try:
              with driver.session(database='system') as session:
                  session.run(
                      'CREATE USER newsroom_projector IF NOT EXISTS '
                      'SET PLAINTEXT PASSWORD $password CHANGE NOT REQUIRED',
                      password=os.environ['NEWSROOM_NEO4J_PROJECTOR_PASSWORD'],
                  ).consume()
          finally:
              driver.close()
          projector = GraphDatabase.driver(
              uri,
              auth=(
                  os.environ['NEWSROOM_NEO4J_PROJECTOR_USERNAME'],
                  os.environ['NEWSROOM_NEO4J_PROJECTOR_PASSWORD'],
              ),
              connection_timeout=1.0,
          )
          try:
              projector.verify_connectivity()
          finally:
              projector.close()
          PY
          rm -f "${admin_file}"

      - name: Prove exact parallel service topology and margin
        shell: bash
        env:
          NEWSROOM_NEO4J_COMPLETE_SERVICE_REQUIRED: '1'
          NEWSROOM_NEO4J_INCREMENT_2D_SERVICE_REQUIRED: '1'
          NEWSROOM_NEO4J_RETRIEVAL_SERVICE_REQUIRED: '1'
          NEWSROOM_NEO4J_SERVICE_REQUIRED: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          projector_file="${RUNNER_TEMP}/newsroom-sdlc-parallel-projector.env"
          set -a
          source "${projector_file}"
          set +a
          uv run --no-sync python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          report = Path('.sdlc-materializer/service.xml')
          tests = tuple(
              sorted(
                  path.as_posix()
                  for path in Path('newsroom/tests').glob(
                      'test_*_neo4j_service.py'
                  )
                  if path.is_file() and not path.is_symlink()
              )
          )
          started = time.monotonic_ns()
          completed = subprocess.run(
              (
                  sys.executable,
                  '-m',
                  'scripts.sdlc.workflow_lane',
                  'service-tests',
                  '--repo-root',
                  '.',
                  '--report',
                  report.as_posix(),
                  *tests,
              ),
              check=False,
          )
          elapsed_ms = (time.monotonic_ns() - started) // 1_000_000
          print(json.dumps({'elapsed_ms': elapsed_ms, 'returncode': completed.returncode}))
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)
          if elapsed_ms >= 45_000:
              raise SystemExit(
                  f'parallel service evidence lacks material margin: {elapsed_ms} ms'
              )
          root = ET.parse(report).getroot()
          cases = root.findall('.//testcase')
          identities = tuple(
              sorted(
                  (case.attrib.get('classname', ''), case.attrib.get('name', ''))
                  for case in cases
              )
          )
          if len(cases) != 32 or len(identities) != len(set(identities)):
              raise SystemExit(
                  f'exact service identity coverage differs: {len(cases)} cases'
              )
          if any(
              case.find('failure') is not None
              or case.find('error') is not None
              or case.find('skipped') is not None
              for case in cases
          ):
              raise SystemExit('parallel service evidence has failure, error or skip')
          expected_modules = {
              'newsroom.tests.test_complete_projection_2b_neo4j_service',
              'newsroom.tests.test_increment_2d_neo4j_service',
              'newsroom.tests.test_integrated_c1_neo4j_service',
              'newsroom.tests.test_projection_b2_neo4j_service',
              'newsroom.tests.test_projection_b3_neo4j_service',
              'newsroom.tests.test_retrieval_2c_neo4j_service',
          }
          actual_modules = {classname for classname, _name in identities}
          if actual_modules != expected_modules:
              raise SystemExit(
                  'parallel service module coverage differs: '
                  + repr(sorted(actual_modules))
              )
          Path('.sdlc-materializer/service-performance.json').write_text(
              json.dumps(
                  {
                      'schema_version': 'newsroom.sdlc.service-performance.v1',
                      'elapsed_ms': elapsed_ms,
                      'test_count': len(cases),
                  },
                  sort_keys=True,
              )
              + '\n',
              encoding='utf-8',
          )
          PY

      - name: Remove disposable Neo4j state
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/newsroom-sdlc-parallel-admin.env" \
            "${RUNNER_TEMP}/newsroom-sdlc-parallel-projector.env"
          timeout --signal=TERM --kill-after=2s 10s \
            docker rm --force newsroom-sdlc-parallel-neo4j || true

      - name: Commit verified clean service-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            docs/research/2026-07-28-sdlc-service-evidence-performance.md \
            newsroom/tests/test_sdlc_workflow_lane.py \
            scripts/sdlc/workflow_lane.py)"
          actual="$(git status --short | sed 's/^...//' | sort)"
          test "${actual}" = "${expected}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf(sdlc): parallelize authenticated service evidence'
          git push origin HEAD:agent/sdlc-parallel-service-evidence
