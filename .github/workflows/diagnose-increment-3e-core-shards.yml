name: Apply Increment 3E measured worker correction

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-corrective-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Apply measured five-worker correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"expected one exact replacement in {path}: {old!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              Path("scripts/sdlc/workflow_lane.py"),
              "_CORE_WORKER_COUNT = 4\n",
              "_CORE_WORKER_COUNT = 5\n",
          )
          replace_once(
              Path("newsroom/tests/test_sdlc_workflow_lane.py"),
              "    assert lane_module._CORE_WORKER_COUNT == 4\n",
              "    assert lane_module._CORE_WORKER_COUNT == 5\n",
          )
          PY
          uv run python -m pytest -q newsroom/tests/test_sdlc_workflow_lane.py
          git diff --check

      - name: Publish permanent code and remove diagnostic workflow
        run: |
          rm .github/workflows/diagnose-increment-3e-core-shards.yml
          git config user.name newsroom-ci
          git config user.email newsroom-ci@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "perf(sdlc): schedule core evidence across five workers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
