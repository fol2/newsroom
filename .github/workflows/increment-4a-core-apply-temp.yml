name: Temporary Increment 4A core apply

on:
  push:
    branches:
      - agent/increment-4a-extraction-authority

permissions:
  contents: write

jobs:
  apply-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-4a-extraction-authority
          fetch-depth: 0

      - name: Apply and publish exact local checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat .github/increment-4a-apply/part-* \
            | base64 --decode \
            | gzip -dc > /tmp/increment-4a-core.patch
          printf '%s  %s\n' \
            '48c30acc95f2284978e00d138a7cf04fe0e665237959d33f3332c5d6d96032db' \
            /tmp/increment-4a-core.patch | sha256sum --check -
          git apply --index --whitespace=error-all /tmp/increment-4a-core.patch
          git rm -r .github/increment-4a-apply
          git rm .github/workflows/increment-4a-core-apply-temp.yml
          python -m compileall -q newsroom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(extraction): add Increment 4A authority core'
          git push origin HEAD:agent/increment-4a-extraction-authority
