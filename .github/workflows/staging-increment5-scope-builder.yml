name: Increment 5A scope replacement builder

on:
  pull_request:
    branches:
      - agent/increment-5a-retrieval-contract

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: staging/increment-5a-scope-expand-20260803
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Pin reviewed source and negative regression allowance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/sdlc/_staging_increment5_expand_scope.py")
          text = path.read_text(encoding="utf-8")
          old_head = '    source_head = subprocess.check_output(\n        ["git", "rev-parse", "HEAD^"], cwd=ROOT, text=True\n    ).strip()\n'
          new_head = '    source_head = "40d387840ee6d2b41042b32191a962ae9baf9502"\n'
          old_check = '            if old in text:\n                hits.append(str(path.relative_to(ROOT)))\n'
          new_check = '            if (\n                old == OLD_SCOPE\n                and path.resolve() == PROFILE_TEST.resolve()\n                and text.count(old) == 1\n            ):\n                continue\n            if old in text:\n                hits.append(str(path.relative_to(ROOT)))\n'
          if text.count(old_head) != 1 or text.count(old_check) != 1:
              raise SystemExit("staging helper source differs")
          path.write_text(
              text.replace(old_head, new_head).replace(old_check, new_check),
              encoding="utf-8",
          )
          PY

      - name: Materialize exact scope and digest chain
        run: python scripts/sdlc/_staging_increment5_expand_scope.py

      - name: Verify locked environment
        run: |
          uv lock --check
          uv sync --dev --locked

      - name: Focused Increment 5A verification
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_increment5a_contract.py \
            newsroom/tests/test_increment5a_evaluation_plan.py \
            newsroom/tests/test_increment5a_package_neutrality.py \
            newsroom/tests/test_increment5a_profiles.py \
            newsroom/tests/test_increment5a_profile_semantic_envelope.py \
            newsroom/tests/test_increment5a_traceability.py

      - name: Full deterministic verification
        run: uv run python -m pytest -q

      - name: Source integrity
        run: |
          git diff --check
          cat increment5a-scope-digests.json

      - name: Commit verified staging materialization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "build(increment5): materialize complete qualification scope"
          git push origin HEAD:staging/increment-5a-scope-expand-20260803
