name: Fix Increment 5B4 temporal cutoff

on:
  push:
    branches:
      - support/fix-increment-5b4-temporal-cutoff-20260806
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-increment-5b4-temporal-cutoff
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: fol2/newsroom
      SOURCE_BRANCH: support/materialize-increment-5b4-20260806
      EXPECTED_SOURCE: 30eb9dd5e7d6c03018d30289ef3fa05f3b76d523
      FIXED_BRANCH: support/increment-5b4-temporal-cutoff-fixed-20260806
      CHECKPOINT_BRANCH: checkpoint/increment-5b4-temporal-cutoff-fixed-20260806
    steps:
      - name: Apply one closed-window correction and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"

          git init -q repo
          git -C repo remote add origin "https://github.com/$REPOSITORY.git"
          git -C repo fetch --no-tags --depth=1 origin \
            "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/source"
          git -C repo checkout -q --detach "$EXPECTED_SOURCE"

          python - <<'PY'
          from pathlib import Path

          root = Path("repo")

          reader = root / "newsroom/authority/neo4j_admitted_graph_reader.py"
          reader_text = reader.read_text(encoding="utf-8")
          old_cypher = """  AND relation.observed_at >= $temporal_lower_bound\nRETURN\n"""
          new_cypher = """  AND relation.observed_at >= $temporal_lower_bound\n  AND relation.observed_at <= $query_valid_time\nRETURN\n"""
          if old_cypher not in reader_text:
              raise SystemExit("fixed Cypher observation boundary was not found")
          reader.write_text(reader_text.replace(old_cypher, new_cypher, 1), encoding="utf-8")

          retriever = root / "newsroom/increment5/admitted_graph_retriever.py"
          retriever_text = retriever.read_text(encoding="utf-8")
          old_relation = '''        valid = _parse_utc(query_valid_time, field="graph_query_valid_time")\n        if not (\n            _parse_utc(relation.valid_from, field="relation_valid_from")\n            <= valid\n            < _parse_utc(relation.valid_to, field="relation_valid_to")\n        ):\n            return GraphExclusionReason.OUTSIDE_QUERY_VALID_TIME\n        if _parse_utc(relation.observed_at, field="relation_observed_at") < _parse_utc(\n            lower_bound,\n            field="graph_temporal_lower_bound",\n        ):\n            return GraphExclusionReason.OUTSIDE_TEMPORAL_WINDOW\n'''
          new_relation = '''        valid = _parse_utc(query_valid_time, field="graph_query_valid_time")\n        observed = _parse_utc(relation.observed_at, field="relation_observed_at")\n        if observed > valid:\n            return GraphExclusionReason.OUTSIDE_QUERY_VALID_TIME\n        if not (\n            _parse_utc(relation.valid_from, field="relation_valid_from")\n            <= valid\n            < _parse_utc(relation.valid_to, field="relation_valid_to")\n        ):\n            return GraphExclusionReason.OUTSIDE_QUERY_VALID_TIME\n        if observed < _parse_utc(\n            lower_bound,\n            field="graph_temporal_lower_bound",\n        ):\n            return GraphExclusionReason.OUTSIDE_TEMPORAL_WINDOW\n'''
          if old_relation not in retriever_text:
              raise SystemExit("retriever temporal boundary was not found")
          retriever.write_text(
              retriever_text.replace(old_relation, new_relation, 1),
              encoding="utf-8",
          )

          core_tests = root / "newsroom/tests/test_increment5b4_admitted_graph_retriever.py"
          core_text = core_tests.read_text(encoding="utf-8")
          core_test = '''\n\ndef test_future_observed_relation_cannot_leak_into_historical_query(tmp_path: Path) -> None:\n    root = make_node("source:root", "Source")\n    future = make_node("signal:future", "Signal")\n    relation = make_relation(\n        "relation:future-observation",\n        root.canonical_id,\n        future.canonical_id,\n        "ABOUT_EVENT",\n        observed_at="2026-08-07T00:00:00Z",\n    )\n    view = make_view(nodes=(root, future), relations=(relation,))\n    receipt = make_retriever(\n        tmp_path,\n        view,\n        journal_name="future-observation.sqlite",\n    )[0].retrieve(make_request())\n    assert receipt.outcome is BranchOutcome.COMPLETE\n    assert receipt.reason is GraphFailureReason.NO_MATCH\n    assert not receipt.hits\n    assert any(\n        item.subject_id == future.canonical_id\n        and item.relation_id == relation.relation_id\n        and item.reason is GraphExclusionReason.OUTSIDE_QUERY_VALID_TIME\n        for item in receipt.exclusions\n    )\n'''
          if "test_future_observed_relation_cannot_leak_into_historical_query" in core_text:
              raise SystemExit("core future-observation regression already exists")
          core_tests.write_text(core_text.rstrip() + core_test + "\n", encoding="utf-8")

          port_tests = root / "newsroom/tests/test_increment5b4_neo4j_authority_port.py"
          port_text = port_tests.read_text(encoding="utf-8")
          port_test = '''\n\ndef test_fixed_expand_query_closes_the_observation_window() -> None:\n    text = Neo4jAdmittedGraphReadPort.fixed_expand_cypher()\n    assert "relation.observed_at >= $temporal_lower_bound" in text\n    assert "relation.observed_at <= $query_valid_time" in text\n'''
          if "test_fixed_expand_query_closes_the_observation_window" in port_text:
              raise SystemExit("port future-observation regression already exists")
          port_tests.write_text(port_text.rstrip() + port_test + "\n", encoding="utf-8")

          service_tests = root / "newsroom/tests/test_increment5b4_neo4j_service.py"
          service_text = service_tests.read_text(encoding="utf-8")
          service_text = service_text.replace(
              """                    CREATE (foreign:Revision {\n                      generation_id: $other_generation,\n                      canonical_id: 'revision:foreign',\n                      identity_digest: $foreign_digest\n                    })\n""",
              """                    CREATE (foreign:Revision {\n                      generation_id: $other_generation,\n                      canonical_id: 'revision:foreign',\n                      identity_digest: $foreign_digest\n                    })\n                    CREATE (future:Signal {\n                      generation_id: $generation,\n                      canonical_id: 'signal:future',\n                      identity_digest: $future_digest\n                    })\n""",
              1,
          )
          service_text = service_text.replace(
              """                    CREATE (root)-[:DEVELOPMENT_OF {\n                      generation_id: $other_generation,\n                      relation_id: 'relation:cross-generation',\n                      valid_from: '2020-01-01T00:00:00Z',\n                      valid_to: '2035-01-01T00:00:00Z',\n                      observed_at: '2026-08-01T00:00:00Z'\n                    }]->(foreign)\n""",
              """                    CREATE (root)-[:DEVELOPMENT_OF {\n                      generation_id: $other_generation,\n                      relation_id: 'relation:cross-generation',\n                      valid_from: '2020-01-01T00:00:00Z',\n                      valid_to: '2035-01-01T00:00:00Z',\n                      observed_at: '2026-08-01T00:00:00Z'\n                    }]->(foreign)\n                    CREATE (root)-[:ABOUT_EVENT {\n                      generation_id: $generation,\n                      relation_id: 'relation:future-observation',\n                      valid_from: '2020-01-01T00:00:00Z',\n                      valid_to: '2035-01-01T00:00:00Z',\n                      observed_at: '2026-08-07T00:00:00Z'\n                    }]->(future)\n""",
              1,
          )
          service_text = service_text.replace(
              """                    foreign_digest=canonical_node_digest("revision:foreign"),\n""",
              """                    foreign_digest=canonical_node_digest("revision:foreign"),\n                    future_digest=canonical_node_digest("signal:future"),\n""",
              1,
          )
          service_text = service_text.replace(
              """            assert all(edge.relation_id != "relation:old" for edge in first + second)\n""",
              """            assert all(edge.relation_id != "relation:old" for edge in first + second)\n            assert all(\n                edge.relation_id != "relation:future-observation"\n                for edge in first + second\n            )\n""",
              1,
          )
          required = ("future:Signal", "relation:future-observation", "future_digest")
          if not all(token in service_text for token in required):
              raise SystemExit("actual-service future-observation regression was not applied")
          service_tests.write_text(service_text, encoding="utf-8")
          PY

          cd repo
          python -m compileall -q \
            newsroom/authority/neo4j_admitted_graph_reader.py \
            newsroom/increment5/admitted_graph_retriever.py \
            newsroom/tests/test_increment5b4_admitted_graph_retriever.py \
            newsroom/tests/test_increment5b4_neo4j_authority_port.py \
            newsroom/tests/test_increment5b4_neo4j_service.py
          python -m pip install --disable-pip-version-check -q pytest==9.0.2
          python -m pytest -q \
            newsroom/tests/test_increment5b4_admitted_graph_retriever.py \
            newsroom/tests/test_increment5b4_neo4j_authority_port.py \
            newsroom/tests/test_increment5b4_neo4j_service.py

          git config user.name "James To"
          git config user.email "105634418+fol2@users.noreply.github.com"
          git add \
            newsroom/authority/neo4j_admitted_graph_reader.py \
            newsroom/increment5/admitted_graph_retriever.py \
            newsroom/tests/test_increment5b4_admitted_graph_retriever.py \
            newsroom/tests/test_increment5b4_neo4j_authority_port.py \
            newsroom/tests/test_increment5b4_neo4j_service.py
          git diff --cached --check
          git commit -m "Increment 5B4: close future-observation temporal window"
          git push --force origin "HEAD:refs/heads/$FIXED_BRANCH"
          git push --force origin "HEAD:refs/heads/$CHECKPOINT_BRANCH"
          printf 'head=%s\ntree=%s\nparent=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')" \
            "$(git rev-parse HEAD^)"
