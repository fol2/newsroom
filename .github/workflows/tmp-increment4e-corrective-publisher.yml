name: Temporary Increment 4E corrective publisher

on:
  push:
    branches:
      - agent/increment-4e-corrective-hardening

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply corrective source and regression patch
        env:
          PATCH_GZIP_BASE64: ""
        run: |
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/increment4_patch.py
          python /tmp/increment4_patch.py

      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Compile and run focused corrective regressions
        run: |
          uv run python -m compileall -q newsroom
          uv run python -m pytest -q \
            newsroom/tests/test_increment4e_neo4j_controller.py \
            newsroom/tests/test_increment4e_corrective_hardening.py \
            newsroom/tests/test_increment4e_workflow_contract.py \
            newsroom/tests/test_sdlc_workflow_lane.py

      - name: Commit tested permanent correction and remove publisher
        run: |
          rm .github/workflows/tmp-increment4e-corrective-publisher.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(increment4): harden authoritative Neo4j rebuild"
          git push origin HEAD:agent/increment-4e-corrective-hardening
