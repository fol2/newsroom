name: Materialize Increment 3C migration chain

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Wire checked schema v11 and migration evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one reviewed replacement, found {count}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          migrations = 'newsroom/authority/migrations.py'
          replace_once(
              migrations,
              'from .canonical import digest_canonical\n',
              'from .canonical import digest_canonical\n'
              'from .check_migrations import (\n'
              '    CHECK_AUTHORITY_MIGRATION,\n'
              '    CHECK_AUTHORITY_MIGRATION_CHECKSUM,\n'
              '    CHECK_AUTHORITY_MIGRATION_NAME,\n'
              '    CHECK_AUTHORITY_MIGRATION_STATEMENTS,\n'
              '    CHECK_AUTHORITY_SCHEMA_VERSION,\n'
              ')\n',
          )
          replace_once(
              migrations,
              'SCHEMA_VERSION = SOURCE_REGISTRY_SCHEMA_VERSION\n',
              'SCHEMA_VERSION = CHECK_AUTHORITY_SCHEMA_VERSION\n',
          )
          replace_once(
              migrations,
              '    Fresh schema creation is all-or-nothing across the A2a and A2b migration\n'
              '    records.  Upgrading an A2a schema applies only v2.\n',
              '    Fresh schema creation is all-or-nothing across every retained authority\n'
              '    migration. Existing v10 source registries upgrade only through checked v11.\n',
          )
          replace_once(
              migrations,
              '''            current = SOURCE_REGISTRY_SCHEMA_VERSION
          conn.execute(f"PRAGMA user_version={current}")
          ''',
              '''            current = SOURCE_REGISTRY_SCHEMA_VERSION
          if current == SOURCE_REGISTRY_SCHEMA_VERSION:
              for statement in CHECK_AUTHORITY_MIGRATION_STATEMENTS:
                  conn.execute(statement)
              conn.execute(
                  "INSERT INTO authority_migrations("
                  "version,name,checksum,applied_at) "
                  "VALUES(?,?,?,?)",
                  (
                      CHECK_AUTHORITY_SCHEMA_VERSION,
                      CHECK_AUTHORITY_MIGRATION_NAME,
                      CHECK_AUTHORITY_MIGRATION_CHECKSUM,
                      applied_at,
                  ),
              )
              current = CHECK_AUTHORITY_SCHEMA_VERSION
          conn.execute(f"PRAGMA user_version={current}")
          ''',
          )
          replace_once(
              migrations,
              '''    DEVELOPMENT_CANDIDATE_MIGRATION,
              SOURCE_REGISTRY_MIGRATION,
          )
          ''',
              '''    DEVELOPMENT_CANDIDATE_MIGRATION,
              SOURCE_REGISTRY_MIGRATION,
              CHECK_AUTHORITY_MIGRATION,
          )
          ''',
          )
          replace_once(
              migrations,
              '''    (
              SOURCE_REGISTRY_SCHEMA_VERSION,
              SOURCE_REGISTRY_MIGRATION_NAME,
              SOURCE_REGISTRY_MIGRATION_CHECKSUM,
          ),
          )
          ''',
              '''    (
              SOURCE_REGISTRY_SCHEMA_VERSION,
              SOURCE_REGISTRY_MIGRATION_NAME,
              SOURCE_REGISTRY_MIGRATION_CHECKSUM,
          ),
              (
                  CHECK_AUTHORITY_SCHEMA_VERSION,
                  CHECK_AUTHORITY_MIGRATION_NAME,
                  CHECK_AUTHORITY_MIGRATION_CHECKSUM,
              ),
          )
          ''',
          )

          lifecycle = 'newsroom/tests/test_source_3a_lifecycle_integrity.py'
          replace_once(
              lifecycle,
              'from newsroom.authority.persistence import AuthorityPersistenceError\n',
              'from newsroom.authority.migrations import SCHEMA_VERSION\n'
              'from newsroom.authority.persistence import AuthorityPersistenceError\n',
          )
          replace_once(
              lifecycle,
              'def test_checked_source_registry_migration_is_v10_and_reopenable(\n',
              'def test_checked_source_registry_migration_is_retained_in_v11(\n',
          )
          replace_once(
              lifecycle,
              '''        assert conn.execute("PRAGMA user_version").fetchone()[0] == (
                  SOURCE_REGISTRY_SCHEMA_VERSION
              )
              ''',
              '''        assert conn.execute("PRAGMA user_version").fetchone()[0] == (
                  SCHEMA_VERSION
              )
              ''',
          )

          Path('newsroom/tests/test_check_3c_migrations.py').write_text(
              '''from __future__ import annotations

          import sqlite3

          import pytest

          from newsroom.authority.check_migrations import (
              CHECK_AUTHORITY_MIGRATION_CHECKSUM,
              CHECK_AUTHORITY_MIGRATION_NAME,
              CHECK_AUTHORITY_SCHEMA_VERSION,
          )
          from newsroom.authority.migrations import (
              EXPECTED_MIGRATION_HISTORY,
              SCHEMA_VERSION,
          )
          from newsroom.authority.persistence import AuthoritySchemaError

          from .source_3a_helpers import open_source_system


          CHECK_TABLES = frozenset(
              {
                  "check_requests",
                  "check_attempts",
                  "check_outcomes",
                  "baseline_decisions",
                  "baseline_manifest_entries",
                  "baseline_decision_heads",
                  "observable_transitions",
                  "operational_findings",
                  "operational_finding_occurrences",
                  "discovery_occurrence_check_links",
              }
          )
          REQUIRED_TRIGGERS = frozenset(
              {
                  "check_request_source_contract_guard",
                  "check_request_coverage_guard",
                  "check_attempt_exact_predecessor_guard",
                  "baseline_decision_chain_guard",
                  "baseline_head_update_guard",
                  "observable_transition_source_contract_guard",
                  "discovery_occurrence_check_link",
                  "immutable_check_outcomes_update",
                  "immutable_observable_transitions_delete",
              }
          )


          def test_checked_v11_migration_creates_and_reopens_exact_schema(
              tmp_path,
          ) -> None:
              database = tmp_path / "authority.sqlite3"
              open_source_system(database).close()

              conn = sqlite3.connect(database)
              try:
                  assert conn.execute("PRAGMA user_version").fetchone()[0] == (
                      CHECK_AUTHORITY_SCHEMA_VERSION
                  )
                  assert SCHEMA_VERSION == CHECK_AUTHORITY_SCHEMA_VERSION
                  row = conn.execute(
                      "SELECT name,checksum FROM authority_migrations WHERE version=?",
                      (CHECK_AUTHORITY_SCHEMA_VERSION,),
                  ).fetchone()
                  assert row == (
                      CHECK_AUTHORITY_MIGRATION_NAME,
                      CHECK_AUTHORITY_MIGRATION_CHECKSUM,
                  )
                  tables = {
                      str(row[0])
                      for row in conn.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      ).fetchall()
                  }
                  triggers = {
                      str(row[0])
                      for row in conn.execute(
                          "SELECT name FROM sqlite_master WHERE type='trigger'"
                      ).fetchall()
                  }
                  assert CHECK_TABLES <= tables
                  assert REQUIRED_TRIGGERS <= triggers
              finally:
                  conn.close()

              assert EXPECTED_MIGRATION_HISTORY[-1] == (
                  CHECK_AUTHORITY_SCHEMA_VERSION,
                  CHECK_AUTHORITY_MIGRATION_NAME,
                  CHECK_AUTHORITY_MIGRATION_CHECKSUM,
              )
              open_source_system(database).close()


          def test_startup_rejects_v11_migration_history_tampering(tmp_path) -> None:
              database = tmp_path / "authority.sqlite3"
              open_source_system(database).close()

              conn = sqlite3.connect(database)
              try:
                  trigger_sql = conn.execute(
                      "SELECT sql FROM sqlite_master WHERE type='trigger' AND name=?",
                      ("immutable_authority_migrations_update",),
                  ).fetchone()[0]
                  conn.execute("DROP TRIGGER immutable_authority_migrations_update")
                  conn.execute(
                      "UPDATE authority_migrations SET checksum=? WHERE version=?",
                      (
                          "sha256:" + "0" * 64,
                          CHECK_AUTHORITY_SCHEMA_VERSION,
                      ),
                  )
                  conn.execute(trigger_sql)
                  conn.commit()
              finally:
                  conn.close()

              with pytest.raises(AuthoritySchemaError, match="migration history"):
                  open_source_system(database)
          ''',
              encoding='utf-8',
          )
          PY
          python -m compileall -q newsroom/authority newsroom/tests
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run migration, source and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_source_3a_authority.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified clean migration chain
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-increment-3c-migration-chain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newsroom/authority/migrations.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_check_3c_migrations.py \
            .github/workflows/materialize-increment-3c-migration-chain.yml
          git diff --cached --check
          git commit -m 'feat(checks): activate checked schema v11 migration'
          git push origin HEAD:agent/increment-3c-check-transition-authority
