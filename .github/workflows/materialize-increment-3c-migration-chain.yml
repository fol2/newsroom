name: Materialize Increment 3C migration chain

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3c-check-transition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Increment 3C branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3c-check-transition-authority
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Wire checked schema v11 and migration evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_materialize_increment_3c_migration.py
          python scripts/_materialize_increment_3c_schema_assertions.py
          python -m compileall -q newsroom/authority newsroom/tests
          git diff --check

      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.8.0
          uv lock --check
          uv sync --dev --locked

      - name: Run migration, source and complete regressions
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          set +e
          : > /tmp/increment-3c-migration-verification.log
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_source_3a_authority.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_projection_b1_migrations.py \
            newsroom/tests/test_relation_2a_contracts.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            2>&1 | tee -a /tmp/increment-3c-migration-verification.log
          status="${PIPESTATUS[0]}"
          if [ "${status}" -eq 0 ]; then
            uv run --no-sync python -m pytest -q \
              2>&1 | tee -a /tmp/increment-3c-migration-verification.log
            status="${PIPESTATUS[0]}"
          fi
          if [ "${status}" -eq 0 ]; then
            uv run --no-sync python scripts/eval_clustering_metrics.py \
              --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
              --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
              --fail-on-regression \
              2>&1 | tee -a /tmp/increment-3c-migration-verification.log
            status="${PIPESTATUS[0]}"
          fi
          set -e
          printf 'status=%s\n' "${status}" >> /tmp/increment-3c-migration-verification.log
          exit "${status}"

      - name: Upload bounded migration verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: increment-3c-migration-verification-${{ github.event.pull_request.head.sha }}
          path: /tmp/increment-3c-migration-verification.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

      - name: Commit verified clean migration chain
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/materialize-increment-3c-migration-chain.yml \
            scripts/_materialize_increment_3c_migration.py \
            scripts/_materialize_increment_3c_schema_assertions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newsroom/authority/migrations.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_check_3c_migrations.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_projection_b1_migrations.py \
            newsroom/tests/test_relation_2a_contracts.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            .github/workflows/materialize-increment-3c-migration-chain.yml \
            scripts/_materialize_increment_3c_migration.py \
            scripts/_materialize_increment_3c_schema_assertions.py
          git diff --cached --check
          git commit -m 'feat(checks): activate checked schema v11 migration'
          git push origin HEAD:agent/increment-3c-check-transition-authority
