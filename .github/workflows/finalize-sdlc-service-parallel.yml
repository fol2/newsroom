name: Finalize parallel SDLC service evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/sdlc-parallel-service-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/sdlc-parallel-service-evidence
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Verify and apply exact proven patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          manifest_path = root / '.github/sdlc-service-parallel-manifest.json'
          payload_path = root / '.github/sdlc-service-parallel.patch.b64'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('schema_version') != 'newsroom.sdlc.service-parallel-materializer.v1':
              raise SystemExit('unexpected service-sharding manifest schema')
          expected_transport = (
              '.github/sdlc-service-parallel-manifest.json',
              '.github/sdlc-service-parallel.patch.b64',
              '.github/workflows/finalize-sdlc-service-parallel.yml',
          )
          changed = tuple(
              sorted(
                  subprocess.check_output(
                      ['git', 'diff', '--name-only', 'origin/main...HEAD', '--'],
                      text=True,
                  ).splitlines()
              )
          )
          if changed != expected_transport:
              raise SystemExit(
                  'finalizer branch contains unexpected pre-apply changes: '
                  + repr(changed)
              )
          for relative, expected_blob in manifest['base_file_blobs'].items():
              actual_blob = subprocess.check_output(
                  ['git', 'hash-object', '--', relative], text=True
              ).strip()
              if actual_blob != expected_blob:
                  raise SystemExit(f'base file differs for {relative}: {actual_blob}')
          if tuple(manifest['product_paths']) != (
              'docs/research/2026-07-28-sdlc-service-evidence-performance.md',
              'newsroom/tests/test_sdlc_workflow_lane.py',
              'scripts/sdlc/workflow_lane.py',
          ):
              raise SystemExit('service-sharding product inventory differs')

          encoded = payload_path.read_text(encoding='ascii')
          if not encoded.endswith('\n'):
              raise SystemExit('service-sharding payload lacks canonical newline')
          compact = encoded[:-1]
          if len(compact) != manifest['payload_base64_size']:
              raise SystemExit('service-sharding base64 size differs')
          compressed = base64.b64decode(compact, validate=True)
          if len(compressed) != manifest['gzip_size']:
              raise SystemExit('service-sharding gzip size differs')
          if hashlib.sha256(compressed).hexdigest() != manifest['gzip_sha256']:
              raise SystemExit('service-sharding gzip digest differs')
          patch = gzip.decompress(compressed)
          if len(patch) != manifest['patch_size']:
              raise SystemExit('service-sharding patch size differs')
          if hashlib.sha256(patch).hexdigest() != manifest['patch_sha256']:
              raise SystemExit('service-sharding patch digest differs')
          Path('/tmp/sdlc-service-parallel.patch').write_bytes(patch)
          PY
          git apply --check /tmp/sdlc-service-parallel.patch
          git apply /tmp/sdlc-service-parallel.patch
          rm -f \
            .github/sdlc-service-parallel-manifest.json \
            .github/sdlc-service-parallel.patch.b64 \
            .github/workflows/finalize-sdlc-service-parallel.yml
          python -m compileall -q newsroom scripts
          git diff --check

      - name: Run locked full regression evidence
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m pytest -q newsroom/tests/test_sdlc_workflow_lane.py
          mkdir -p .sdlc-finalizer
          uv run --no-sync python -m scripts.sdlc.workflow_lane core-tests \
            --repo-root . \
            --report .sdlc-finalizer/core.xml
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit exact clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sdlc-finalizer
          git add -A
          expected="$(printf '%s\n' \
            .github/sdlc-service-parallel-manifest.json \
            .github/sdlc-service-parallel.patch.b64 \
            .github/workflows/finalize-sdlc-service-parallel.yml \
            docs/research/2026-07-28-sdlc-service-evidence-performance.md \
            newsroom/tests/test_sdlc_workflow_lane.py \
            scripts/sdlc/workflow_lane.py | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "${actual}" = "${expected}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(sdlc): parallelize authenticated service evidence'
          git push origin HEAD:agent/sdlc-parallel-service-evidence
