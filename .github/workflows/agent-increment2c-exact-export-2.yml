name: agent-increment2c-exact-export-2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Increment 2C source tree
        uses: actions/upload-artifact@v4
        with:
          name: increment2c-exact-source-2
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
