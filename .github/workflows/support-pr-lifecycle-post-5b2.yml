name: Support PR lifecycle post-5B2 reconstruction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct-and-verify:
    if: github.head_ref == 'support/pr-lifecycle-post-5b2-import-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Retain exact support head
        run: echo "INITIAL_HEAD=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Apply lifecycle authorization-boundary correction
        run: |
          set -euo pipefail
          python scripts/support/apply_pr_lifecycle_post_5b2.py
          python -m py_compile \
            newsroom/checks/pr_lifecycle.py \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/pr-lifecycle.yml',
              'docs/operations/pr-lifecycle.md',
              'newsroom/checks/pr_lifecycle.py',
              'newsroom/tests/test_pr_lifecycle.py',
              'scripts/sdlc/pr_lifecycle.py',
          }
          lines = subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          actual = {line[3:] for line in lines}
          if actual != expected:
              raise SystemExit(
                  f'PR lifecycle correction inventory differs: '
                  f'expected={sorted(expected)!r} actual={sorted(actual)!r}'
              )
          PY

      - name: Commit exact product candidate for clean-checkout evidence
        run: |
          set -euo pipefail
          git add \
            .github/workflows/pr-lifecycle.yml \
            docs/operations/pr-lifecycle.md \
            newsroom/checks/pr_lifecycle.py \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden PR lifecycle authorization and apply boundaries'
          test -z "$(git status --porcelain)"

      - name: Sync locked development environment
        run: uv sync --dev --locked

      - name: Focused PR lifecycle evidence
        run: uv run python -m pytest -q newsroom/tests/test_pr_lifecycle.py

      - name: Complete deterministic repository evidence
        run: uv run python -m pytest -q

      - name: Existing clustering evaluation gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Publish verified non-workflow product files
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git restore \
            --source="${INITIAL_HEAD}" \
            --staged \
            --worktree \
            .github/workflows/pr-lifecycle.yml
          git diff --cached --check
          product_tree="$(git write-tree)"
          product_commit="$({
            printf '%s\n\n' 'fix: harden PR lifecycle authorization boundaries'
            printf '%s\n' 'Require labelled disposable PRs, dedicated checkpoints, exact apply confirmation, current-state revalidation and fork-safe branch retention.'
          } | git commit-tree "${product_tree}" -p "${INITIAL_HEAD}")"
          test "$(git rev-parse "${product_commit}^")" = "${INITIAL_HEAD}"
          git push origin "+${product_commit}:refs/heads/${HEAD_BRANCH}"
