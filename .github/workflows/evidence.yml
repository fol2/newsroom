name: Full Repository Health

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-health:
    name: full-deterministic-health
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact main head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv once
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: newsroom-full-health-py312
          save-cache: false

      - name: Prepare locked environment once
        run: |
          uv lock --check
          uv sync --dev --locked

      - name: Full source integrity
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q newsroom scripts
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          fi

      - name: Run complete deterministic product inventory
        run: |
          uv run --no-sync python -m scripts.sdlc.focus_gate_v2 \
            --repo-root . full-health \
            --junit full-health.xml

      - name: Upload full-health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-health-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: full-health.xml
          if-no-files-found: error
          retention-days: 180
          compression-level: 0
          overwrite: false
          include-hidden-files: false
