name: Repair Increment 5B Tier-M service reconciliation v3

on:
  push:
    branches: [support/repair-increment-5b-tierm-reconciliation-20260807]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-increment-5b-tierm-reconciliation-v3
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: fol2/newsroom
      EXPECTED_BASE: 88d1b14b41354f56f325d173d0021ad0fd20abc2
      PRODUCT_BRANCH: agent/increment-5b-tierm-service-reconciliation
      CHECKPOINT_BRANCH: checkpoint/increment-5b-tierm-service-reconciliation-20260807
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build and verify one reconciliation atom
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git init -q product
          git -C product remote add origin "https://github.com/$REPOSITORY.git"
          git -C product fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          git -C product checkout -q --detach "$EXPECTED_BASE"
          actual_main="$(git -C product ls-remote origin refs/heads/main | cut -f1)"
          [[ "$actual_main" == "$EXPECTED_BASE" ]] || { echo "main moved" >&2; exit 1; }

          python3 - <<'PY'
          from pathlib import Path

          root = Path("product")
          lane = root / "scripts/sdlc/workflow_lane.py"
          evidence = root / ".github/workflows/evidence.yml"
          regression = root / "newsroom/tests/test_increment5b_tierm_service_reconciliation.py"
          first = "newsroom.tests.test_increment5b4_neo4j_service::test_increment5b4_fixed_port_reads_only_exact_generation_and_allowed_state"
          second = "newsroom.tests.test_increment5b4_neo4j_service::test_increment5b4_fixed_port_excludes_future_observations"

          lane_text = lane.read_text(encoding="utf-8")
          if first in lane_text or second in lane_text:
              raise SystemExit("5B4 optional-core identities already exist")
          start = lane_text.index("_OPTIONAL_CORE_TEST_IDS = (")
          end = lane_text.index("\n)\n_SERVICE_CONFIGURATION", start)
          insertion = f'\n    {first!r},\n    {second!r},'
          lane.write_text(lane_text[:end] + insertion + lane_text[end:], encoding="utf-8")

          evidence_text = evidence.read_text(encoding="utf-8")
          anchor = '          set -a\n          source "${projector_file}"\n          set +a\n          uv run --no-sync python -m scripts.sdlc.workflow_lane execute \\\n'
          replacement = '          set -a\n          source "${projector_file}"\n          set +a\n          export NEWSROOM_NEO4J_USER="${NEWSROOM_NEO4J_PROJECTOR_USERNAME}"\n          export NEWSROOM_NEO4J_PASSWORD="${NEWSROOM_NEO4J_PROJECTOR_PASSWORD}"\n          uv run --no-sync python -m scripts.sdlc.workflow_lane execute \\\n'
          if evidence_text.count(anchor) != 1:
              raise SystemExit("service credential alias anchor drifted")
          evidence.write_text(evidence_text.replace(anchor, replacement, 1), encoding="utf-8")

          regression.write_text(
              f'''from pathlib import Path\n\nfrom scripts.sdlc.workflow_lane import _OPTIONAL_CORE_TEST_IDS\n\nEXPECTED = {{{first!r}, {second!r}}}\n\n\ndef test_increment5b4_authenticated_tests_are_core_optional() -> None:\n    assert EXPECTED <= set(_OPTIONAL_CORE_TEST_IDS)\n\n\ndef test_service_lane_aliases_projector_credentials() -> None:\n    workflow = (Path(__file__).resolve().parents[2] / ".github" / "workflows" / "evidence.yml").read_text(encoding="utf-8")\n    user_alias = 'export NEWSROOM_NEO4J_USER="${{NEWSROOM_NEO4J_PROJECTOR_USERNAME}}"'\n    password_alias = 'export NEWSROOM_NEO4J_PASSWORD="${{NEWSROOM_NEO4J_PROJECTOR_PASSWORD}}"'\n    service = workflow.index("  service:")\n    execute = workflow.index("--lane service", service)\n    assert service < workflow.index(user_alias, service) < execute\n    assert service < workflow.index(password_alias, service) < execute\n''',
              encoding="utf-8",
          )
          PY

          cd product
          git config user.name "James To"
          git config user.email "105634418+fol2@users.noreply.github.com"
          files=(
            .github/workflows/evidence.yml
            newsroom/tests/test_increment5b_tierm_service_reconciliation.py
            scripts/sdlc/workflow_lane.py
          )
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -q -m "SDLC: reconcile Increment 5B authenticated service tests"
          [[ "$(git rev-list --count "$EXPECTED_BASE..HEAD")" == "1" ]]
          mapfile -t actual < <(git diff --name-only "$EXPECTED_BASE..HEAD")
          printf '%s\n' "${files[@]}" | sort > /tmp/expected.txt
          printf '%s\n' "${actual[@]}" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          [[ -z "$(git diff --name-only)" ]]

          uv sync --frozen
          python -m compileall -q scripts/sdlc/workflow_lane.py newsroom/tests/test_increment5b_tierm_service_reconciliation.py
          uv run pytest -q \
            newsroom/tests/test_increment5b_tierm_service_reconciliation.py \
            newsroom/tests/test_sdlc_workflow_lane.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py \
            | tee /tmp/increment5b-tierm-reconciliation-focused.log
          uv run pytest -q | tee /tmp/increment5b-tierm-reconciliation-full.log
          [[ -z "$(git diff --name-only)" ]]

          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "parent=$EXPECTED_BASE"
            echo "focused=$(tail -n 1 /tmp/increment5b-tierm-reconciliation-focused.log)"
            echo "full=$(tail -n 1 /tmp/increment5b-tierm-reconciliation-full.log)"
          } > /tmp/increment5b-tierm-reconciliation-receipt.txt
          git push --force origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          git push --force origin "HEAD:refs/heads/$CHECKPOINT_BRANCH"
          cat /tmp/increment5b-tierm-reconciliation-receipt.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5b-tierm-service-reconciliation-v3-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5b-tierm-reconciliation-focused.log
            /tmp/increment5b-tierm-reconciliation-full.log
            /tmp/increment5b-tierm-reconciliation-receipt.txt
