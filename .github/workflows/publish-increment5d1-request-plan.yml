name: Publish exact Increment 5D1 request-plan correction

on:
  push:
    branches: [support/publish-increment5d1-request-plan-20260808]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-exact-increment5d1-request-plan
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/publish-increment5d1-request-plan-20260808
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          enable-cache: true
      - name: Reassemble, verify and publish exact correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/support/publish_increment5d1_request_plan.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment5d1-request-plan-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/increment5d1-request-plan.patch
            /tmp/increment5d1-request-plan-focused.log
            /tmp/increment5d1-request-plan-full.log
            /tmp/increment5d1-request-plan-clustering.log
            /tmp/increment5d1-request-plan-receipt.json
