name: Support PR lifecycle token and ref binding v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: github.head_ref == 'support/pr-lifecycle-token-ref-binding-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Retain exact support head
        run: echo "INITIAL_HEAD=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Apply token and ref-binding correction
        run: |
          set -euo pipefail
          python scripts/support/fix_pr_lifecycle_token_ref_materializer.py
          python scripts/support/apply_pr_lifecycle_token_ref_binding.py
          python -m py_compile \
            newsroom/checks/pr_lifecycle.py \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/pr-lifecycle.yml',
              'docs/operations/pr-lifecycle.md',
              'newsroom/checks/pr_lifecycle.py',
              'newsroom/tests/test_pr_lifecycle.py',
              'scripts/sdlc/pr_lifecycle.py',
              'scripts/support/apply_pr_lifecycle_token_ref_binding.py',
          }
          lines = subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          actual = {line[3:] for line in lines}
          if actual != expected:
              raise SystemExit(
                  f'lifecycle token/ref inventory differs: '
                  f'expected={sorted(expected)!r} actual={sorted(actual)!r}'
              )
          PY

      - name: Restore materializer and commit exact candidate
        run: |
          set -euo pipefail
          git restore scripts/support/apply_pr_lifecycle_token_ref_binding.py
          git add \
            .github/workflows/pr-lifecycle.yml \
            docs/operations/pr-lifecycle.md \
            newsroom/checks/pr_lifecycle.py \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind lifecycle API access and branch deletion to exact state'
          test -z "$(git status --porcelain)"

      - name: Sync locked development environment
        run: uv sync --dev --locked

      - name: Focused lifecycle authorization evidence
        run: uv run python -m pytest -q newsroom/tests/test_pr_lifecycle.py

      - name: Complete deterministic repository evidence
        run: uv run python -m pytest -q

      - name: Existing clustering evaluation gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Publish verified non-workflow product blobs
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git read-tree "${INITIAL_HEAD}^{tree}"
          for path in \
            docs/operations/pr-lifecycle.md \
            newsroom/checks/pr_lifecycle.py \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          do
            mode="$(git ls-tree "${candidate}" -- "${path}" | awk '{print $1}')"
            blob="$(git rev-parse "${candidate}:${path}")"
            git update-index --add --cacheinfo "${mode},${blob},${path}"
          done
          tree="$(git write-tree)"
          commit="$({
            printf '%s\n\n' 'support: retain verified lifecycle token and ref binding'
            printf '%s\n' 'Publish the exact non-workflow blobs verified with the candidate workflow in this run.'
          } | git commit-tree "${tree}" -p "${INITIAL_HEAD}")"
          git push origin "+${commit}:refs/heads/${HEAD_BRANCH}"
