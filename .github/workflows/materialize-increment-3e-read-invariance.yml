name: Materialize Increment 3E exact-read invariance correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-test-and-push:
    if: github.event.pull_request.head.ref == 'agent/increment-3e-discovery-projection-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Increment 3E branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/increment-3e-discovery-projection-health
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.8.0'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: uv.lock
          restore-cache: true
          save-cache: false
          cache-suffix: newsroom-py312
          prune-cache: false
          cache-python: false

      - name: Verify and apply exact read-invariance correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path

          parent = '349d1a8bb30330e8f5f42788778528fd978bae36'
          parent_tree = '67da00ce50b87d367f474115668c5b2ec2bac725'
          expected_tree = '4512ae29d78b532ce1fcdae7fb067659d592c95d'
          payload_path = Path('.github/increment-3e-read-invariance.patch.gz.b64')
          workflow = '.github/workflows/materialize-increment-3e-read-invariance.yml'

          if subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() != parent:
              raise SystemExit('Increment 3E invariance transport parent differs')
          if subprocess.check_output(['git', 'rev-parse', f'{parent}^{{tree}}'], text=True).strip() != parent_tree:
              raise SystemExit('Increment 3E invariance parent tree differs')
          changed = tuple(sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{parent}..HEAD', '--'], text=True
          ).splitlines()))
          expected_changes = tuple(sorted((str(payload_path), workflow)))
          if changed != expected_changes:
              raise SystemExit(f'Increment 3E invariance transport inventory differs: {changed!r}')

          encoded = payload_path.read_text(encoding='ascii').strip()
          if len(encoded) != 1676:
              raise SystemExit('Increment 3E invariance base64 size differs')
          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != 1257 or hashlib.sha256(compressed).hexdigest() != '4538b655f9c1a8e58ee3be6f3c5f52762107cf91fcabdaf30f1816c60b3e88d1':
              raise SystemExit('Increment 3E invariance compressed payload differs')
          patch = gzip.decompress(compressed)
          if len(patch) != 3018 or hashlib.sha256(patch).hexdigest() != '88c93482ea6d69e4ab77b656741cc618bfd028a00b82fec0f8abad48b24337e4':
              raise SystemExit('Increment 3E invariance patch differs')
          Path('/tmp/increment-3e-read-invariance.patch').write_bytes(patch)
          Path('/tmp/increment-3e-read-invariance-tree').write_text(expected_tree, encoding='ascii')
          PY
          git apply --check /tmp/increment-3e-read-invariance.patch
          git apply /tmp/increment-3e-read-invariance.patch
          rm -f .github/increment-3e-read-invariance.patch.gz.b64
          rm -f .github/workflows/materialize-increment-3e-read-invariance.yml
          python -m compileall -q newsroom scripts
          git diff --check

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked

      - name: Run focused and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_discovery_projection_3e_lifecycle.py \
            newsroom/tests/test_integrated_c1_workflow_contract.py \
            newsroom/tests/test_projection_b2_contracts.py \
            newsroom/tests/test_discovery_projection_3e_traceability.py
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Commit verified exact-read invariance correction
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$(cat /tmp/increment-3e-read-invariance-tree)"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(projection): bind graph-loss proof to one valid-time request'
          git push origin HEAD:agent/increment-3e-discovery-projection-health
