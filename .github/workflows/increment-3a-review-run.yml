name: Increment 3A substantive review runner

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-review-run.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-substantive-review-runner
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Extract and apply reviewed repair payload
        id: apply
        continue-on-error: true
        run: |
          set +e
          (
            set -euo pipefail
            python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/increment-3a-repair.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          marker = "          python - <<'PY'"
          start = lines.index(marker) + 1
          end = lines.index('          PY', start)
          prefix = ' ' * 10
          code_lines = [
              line[len(prefix):] if line.startswith(prefix) else line
              for line in lines[start:end]
          ]
          code = '\n'.join(code_lines) + '\n'
          ambiguous = r'''replace_once(
              "newsroom/authority/source_registry_migrations.py",
              "        UNIQUE(definition_id,semantic_digest),\n",
              "",
          )
          '''
          narrowed = r'''replace_once(
              "newsroom/authority/source_registry_migrations.py",
              "        UNIQUE(definition_id,version_number),\n"
              "        UNIQUE(definition_id,semantic_digest),\n"
              "        UNIQUE(version_id,definition_id),\n",
              "        UNIQUE(definition_id,version_number),\n"
              "        UNIQUE(version_id,definition_id),\n",
          )
          '''
          if code.count(ambiguous) != 1:
              raise RuntimeError(
                  "review payload does not contain one ambiguous version-uniqueness patch"
              )
          code = code.replace(ambiguous, narrowed, 1)
          target = Path('/tmp/increment-3a-substantive-repair.py')
          target.write_text(code, encoding='utf-8')
          compile(code, str(target), 'exec')
          print(f"extracted {len(code.splitlines())} reviewed repair lines")
          PY
            python /tmp/increment-3a-substantive-repair.py
            python -m compileall -q newsroom
            git diff --check
          ) > /tmp/increment-3a-review-run.log 2>&1
          status=$?
          cat /tmp/increment-3a-review-run.log
          exit "$status"

      - name: Persist fail-closed substantive repair diagnostic
        if: steps.apply.outcome != 'success'
        run: |
          git fetch origin agent/increment-3a-source-registry
          git reset --hard origin/agent/increment-3a-source-registry
          mkdir -p docs/research
          {
            echo "Increment 3A substantive repair runner failed on ${GITHUB_SHA}."
            echo
            cat /tmp/increment-3a-review-run.log
          } > docs/research/2026-07-27-increment-3a-review-runner-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/2026-07-27-increment-3a-review-runner-failure.log
          git diff --cached --check
          git commit -m "chore(ci): retain Increment 3A review runner failure"
          git push origin HEAD:agent/increment-3a-source-registry
          exit 1

      - name: Commit substantive source-authority corrections
        if: steps.apply.outcome == 'success'
        id: commit
        continue-on-error: true
        run: |
          set +e
          (
            set -euo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add newsroom
            git diff --cached --check
            git diff --cached --stat
            git commit -m "fix(sources): bind immutable lineage and redacted reads"
            git push origin HEAD:agent/increment-3a-source-registry
          ) > /tmp/increment-3a-review-commit.log 2>&1
          status=$?
          cat /tmp/increment-3a-review-commit.log
          exit "$status"

      - name: Persist fail-closed substantive commit diagnostic
        if: steps.apply.outcome == 'success' && steps.commit.outcome != 'success'
        run: |
          git fetch origin agent/increment-3a-source-registry
          git reset --hard origin/agent/increment-3a-source-registry
          mkdir -p docs/research
          {
            echo "Increment 3A substantive repair commit failed on ${GITHUB_SHA}."
            echo
            cat /tmp/increment-3a-review-commit.log
          } > docs/research/2026-07-27-increment-3a-review-commit-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/2026-07-27-increment-3a-review-commit-failure.log
          git diff --cached --check
          git commit -m "chore(ci): retain Increment 3A review commit failure"
          git push origin HEAD:agent/increment-3a-source-registry
          exit 1

      - name: Set up Python
        if: steps.apply.outcome == 'success' && steps.commit.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development environment
        if: steps.apply.outcome == 'success' && steps.commit.outcome == 'success'
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Run Increment 3A substantive and retained suites
        if: steps.apply.outcome == 'success' && steps.commit.outcome == 'success'
        id: focused
        continue-on-error: true
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_projection_b1_migrations.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_relation_2a_contracts.py \
            newsroom/tests/test_source_3a_contracts.py \
            newsroom/tests/test_source_3a_authority.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_source_3a_review_regressions.py \
            newsroom/tests/test_source_3a_traceability.py \
            --junitxml=increment-3a-focused-results.xml

      - name: Upload focused evidence
        if: steps.apply.outcome == 'success' && steps.commit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: increment-3a-focused-test-evidence
          path: increment-3a-focused-results.xml
          if-no-files-found: error

      - name: Enforce focused evidence
        if: steps.apply.outcome == 'success' && steps.commit.outcome == 'success' && steps.focused.outcome != 'success'
        run: exit 1
