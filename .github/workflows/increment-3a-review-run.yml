name: Increment 3A focused review repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-review-run.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-focused-review-repair
  cancel-in-progress: true

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Apply focused review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "newsroom/sources/types.py",
              "        parsed_time = UtcTimestamp.parse(self.value)\n"
              "        if parsed_time.to_text() != self.value:\n",
              "        try:\n"
              "            parsed_time = UtcTimestamp.parse(self.value)\n"
              "        except ValueError as exc:\n"
              "            raise SourceContractError(\"source time is invalid\") from exc\n"
              "        if parsed_time.to_text() != self.value:\n",
          )

          replace_once(
              "newsroom/authority/_source_registry_store_lineage.py",
              "            self._ensure_semantic_absent(\n"
              "                conn,\n"
              "                table=\"source_items\",\n"
              "                predicate=\"definition_id=? AND identity_digest=?\",\n"
              "                parameters=(\n"
              "                    str(request.definition_id),\n"
              "                    request.identity_digest,\n"
              "                ),\n"
              "                identity=\"source item semantics\",\n"
              "            )\n"
              "            if request.source_native_id is not None:\n"
              "                self._ensure_semantic_absent(\n"
              "                    conn,\n"
              "                    table=\"source_items\",\n"
              "                    predicate=\"definition_id=? AND source_native_id=?\",\n"
              "                    parameters=(\n"
              "                        str(request.definition_id),\n"
              "                        request.source_native_id,\n"
              "                    ),\n"
              "                    identity=\"source-native item identity\",\n"
              "                )\n",
              "            if request.source_native_id is not None:\n"
              "                self._ensure_semantic_absent(\n"
              "                    conn,\n"
              "                    table=\"source_items\",\n"
              "                    predicate=\"definition_id=? AND source_native_id=?\",\n"
              "                    parameters=(\n"
              "                        str(request.definition_id),\n"
              "                        request.source_native_id,\n"
              "                    ),\n"
              "                    identity=\"source-native item identity\",\n"
              "                )\n"
              "            self._ensure_semantic_absent(\n"
              "                conn,\n"
              "                table=\"source_items\",\n"
              "                predicate=\"definition_id=? AND identity_digest=?\",\n"
              "                parameters=(\n"
              "                    str(request.definition_id),\n"
              "                    request.identity_digest,\n"
              "                ),\n"
              "                identity=\"source item semantics\",\n"
              "            )\n",
          )

          replace_once(
              "newsroom/tests/test_source_3a_review_regressions.py",
              "    comparator_active = replace(\n"
              "        request,\n"
              "        coverage_mappings=(\n"
              "  replace(\n"
              "      request.coverage_mappings[0],\n"
              "      contribution=CoverageContribution.COMPARATOR,\n"
              "  ),\n"
              "        ),\n"
              "    )\n"
              "    with pytest.raises(SourceContractError, match=\"Active coverage\"):\n"
              "        comparator_active.__post_init__()\n",
              "    with pytest.raises(SourceContractError, match=\"Active coverage\"):\n"
              "        replace(\n"
              "            request,\n"
              "            coverage_mappings=(\n"
              "                replace(\n"
              "                    request.coverage_mappings[0],\n"
              "                    contribution=CoverageContribution.COMPARATOR,\n"
              "                ),\n"
              "            ),\n"
              "        )\n",
          )
          PY
          python -m compileall -q newsroom
          git diff --check

      - name: Commit focused review corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsroom
          git diff --cached --check
          git commit -m "fix(sources): close focused Increment 3A review findings"
          git push origin HEAD:agent/increment-3a-source-registry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Run Increment 3A focused and retained suites
        id: focused
        continue-on-error: true
        run: |
          uv run python -m pytest -q \
            newsroom/tests/test_projection_b1_migrations.py \
            newsroom/tests/test_complete_projection_2b_migrations.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_increment_2d_migrations.py \
            newsroom/tests/test_increment_2d_candidate_authority.py \
            newsroom/tests/test_relation_2a_contracts.py \
            newsroom/tests/test_source_3a_contracts.py \
            newsroom/tests/test_source_3a_authority.py \
            newsroom/tests/test_source_3a_lifecycle_integrity.py \
            newsroom/tests/test_source_3a_review_regressions.py \
            newsroom/tests/test_source_3a_traceability.py \
            --junitxml=increment-3a-focused-results.xml

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-3a-focused-test-evidence
          path: increment-3a-focused-results.xml
          if-no-files-found: error

      - name: Enforce focused evidence
        if: steps.focused.outcome != 'success'
        run: exit 1
