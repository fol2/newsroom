name: Increment 3A review transport cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/increment-3a-review-run.yml

permissions:
  contents: write

concurrency:
  group: increment-3a-review-transport-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact Increment 3A branch
        uses: actions/checkout@v4
        with:
          ref: agent/increment-3a-source-registry
          fetch-depth: 1
          show-progress: false

      - name: Verify reviewed source authority is materialised
        run: |
          test -f newsroom/authority/source_registry_migrations.py
          test -f newsroom/authority/_source_registry_system.py
          test -f newsroom/tests/test_source_3a_review_regressions.py
          python -m compileall -q newsroom
          python -c "from newsroom.authority.migrations import SCHEMA_VERSION; assert SCHEMA_VERSION == 10"

      - name: Remove temporary review transport and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/increment-3a-repair.yml
          rm -f .github/workflows/increment-3a-review-run.yml
          rm -f docs/research/2026-07-27-increment-3a-review-runner-failure.log
          rm -f docs/research/2026-07-27-increment-3a-review-commit-failure.log
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): remove Increment 3A review transport"
          git push origin HEAD:agent/increment-3a-source-registry
