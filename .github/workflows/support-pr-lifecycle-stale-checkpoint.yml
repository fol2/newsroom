name: Support PR lifecycle stale-checkpoint planning

on:
  push:
    branches:
      - support/pr-lifecycle-stale-checkpoint-plan-20260806
    paths:
      - .github/workflows/support-pr-lifecycle-stale-checkpoint.yml
      - scripts/support/apply_pr_lifecycle_stale_checkpoint_fix.py

permissions:
  contents: write

concurrency:
  group: support-pr-lifecycle-stale-checkpoint-plan-20260806
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and sync exact environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv lock --check
          uv sync --dev --locked

      - name: Apply stale-checkpoint planning correction
        run: python scripts/support/apply_pr_lifecycle_stale_checkpoint_fix.py

      - name: Verify bounded product diff
        run: |
          git status --short
          python - <<'PY'
          import subprocess

          allowed = {
              "docs/operations/pr-lifecycle.md",
              "newsroom/checks/pr_lifecycle.py",
              "newsroom/tests/test_pr_lifecycle.py",
              "scripts/sdlc/pr_lifecycle.py",
          }
          output = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          )
          changed = {
              line[3:]
              for line in output.splitlines()
              if line
          }
          if changed != allowed:
              raise SystemExit(
                  f"unexpected product diff: {sorted(changed)}"
              )
          PY

      - name: Commit product correction locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/operations/pr-lifecycle.md \
            newsroom/checks/pr_lifecycle.py \
            newsroom/tests/test_pr_lifecycle.py \
            scripts/sdlc/pr_lifecycle.py
          git commit -m "fix: bind lifecycle close plans to checkpoint heads"
          test -z "$(git status --porcelain=v1)"

      - name: Focused lifecycle verification
        run: uv run python -m pytest -q newsroom/tests/test_pr_lifecycle.py

      - name: Complete deterministic repository verification
        run: uv run python -m pytest -q

      - name: Clustering regression gate
        run: |
          uv run python scripts/eval_clustering_metrics.py \
            --dataset newsroom/evals/clustering_eval_dataset_v1.jsonl \
            --baseline newsroom/evals/clustering_eval_metrics_baseline_v1.json \
            --fail-on-regression

      - name: Push verified product correction
        run: git push origin HEAD:${GITHUB_REF_NAME}
