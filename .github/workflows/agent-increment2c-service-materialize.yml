name: agent-increment2c-service-materialize

on:
  push:
    branches:
      - agent/increment-2c-service-materialize
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      AUTHORISED_PARENT: a344fbb82f30fe56d76865acc9c19394b2c41b46
      TARGET_BRANCH: agent/increment-2c-bounded-hybrid-retrieval
      PATCH_SHA256: e0ea255c9efd9d34de774e8c37161bd1216d67d430047e46b83c0d066993342f
      EXPECTED_TREE: aab49e99c329093dd6ee34a8eaea309a6978bd32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.8.0'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reconstruct service-evidence patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/increment2c-service/fix.patch.gz.b64 \
            > /tmp/increment2c-service.patch.gz
          echo "$PATCH_SHA256  /tmp/increment2c-service.patch.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/increment2c-service.patch.gz \
            > /tmp/increment2c-service.patch

      - name: Apply exact service checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$AUTHORISED_PARENT"
          git checkout --detach "$AUTHORISED_PARENT"
          git apply --check /tmp/increment2c-service.patch
          git apply /tmp/increment2c-service.patch
          rm -rf .github/increment2c-service
          rm -f .github/workflows/agent-increment2c-service-materialize.yml
          git add -A
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/evidence.yml
          .github/workflows/projection-b2-neo4j.yml
          newsroom/authority/_retrieval_system.py
          newsroom/projection/neo4j/_retrieval_adapter.py
          newsroom/tests/test_integrated_c1_sdlc_contract.py
          newsroom/tests/test_retrieval_2c_adapter_unit.py
          newsroom/tests/test_retrieval_2c_contracts.py
          newsroom/tests/test_retrieval_2c_neo4j_service.py
          newsroom/tests/test_sdlc_evidence_workflow.py
          newsroom/tests/test_sdlc_workflow_lane.py
          scripts/sdlc/workflow_lane.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only "$AUTHORISED_PARENT" | sort \
            > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --cached --check
          python -m compileall -q newsroom scripts
          tree="$(git write-tree)"
          echo "TREE_SHA=$tree"
          test "$tree" = "$EXPECTED_TREE"

      - name: Run locked focused service-contract gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev --locked
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_retrieval_2c_contracts.py \
            newsroom/tests/test_retrieval_2c_fusion.py \
            newsroom/tests/test_retrieval_2c_adapter_unit.py \
            newsroom/tests/test_retrieval_2c_migrations.py \
            newsroom/tests/test_retrieval_2c_authority.py \
            newsroom/tests/test_retrieval_2c_neo4j_service.py \
            newsroom/tests/test_integrated_c1_sdlc_contract.py \
            newsroom/tests/test_sdlc_evidence_workflow.py \
            newsroom/tests/test_sdlc_workflow_lane.py

      - name: Create and push clean service checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Newsroom Increment 2C Agent"
          git config user.email "105634418+fol2@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'test(retrieval): add authenticated Neo4j proof' \
            'Add mandatory actual-Neo4j success and failure cases, permanent CI and SDLC routing, fixed transaction timeouts, and remove caller-substitutable policy contracts from the named public read boundary.' \
            | git commit-tree "$tree" -p "$AUTHORISED_PARENT")"
          echo "COMMIT_SHA=$commit"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
