name: Dispatch exact Increment 5B Tier-M evidence

on:
  push:
    branches:
      - support/dispatch-increment-5b-tier-m-20260807
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_MAIN: 88d1b14b41354f56f325d173d0021ad0fd20abc2
      INCREMENT5B_BASE: cce9312b9349eaa3e1ef15e984728581ffd30b67
    steps:
      - name: Verify exact main and dispatch permanent evidence workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual_main="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"
          if [[ "${actual_main}" != "${EXPECTED_MAIN}" ]]; then
            echo "main moved: expected=${EXPECTED_MAIN} actual=${actual_main}" >&2
            exit 1
          fi

          payload="$(python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "ref": "main",
              "inputs": {"base_sha": os.environ["INCREMENT5B_BASE"]},
          }, separators=(",", ":")))
          PY
          )"
          status="$(
            curl --silent --show-error \
              --output /tmp/dispatch-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "${payload}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/evidence.yml/dispatches"
          )"
          if [[ "${status}" != "204" ]]; then
            cat /tmp/dispatch-response.json >&2 || true
            echo "workflow dispatch failed with HTTP ${status}" >&2
            exit 1
          fi

          printf '%s\n' \
            "schema=newsroom.increment5b.tier-m-dispatch.v1" \
            "main=${actual_main}" \
            "base=${INCREMENT5B_BASE}" \
            "workflow=evidence.yml" \
            > /tmp/increment5b-tier-m-dispatch.txt

      - name: Upload dispatch receipt
        uses: actions/upload-artifact@v4
        with:
          name: increment5b-tier-m-dispatch-${{ github.run_id }}
          path: /tmp/increment5b-tier-m-dispatch.txt
          if-no-files-found: error
          retention-days: 14
