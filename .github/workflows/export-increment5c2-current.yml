name: Export exact current Increment 5C2 source

on:
  push:
    branches: [support/publish-increment5c2-authority-tools-20260807]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8a2532cf5255aeb18dd27e7333dc37c2f5f5c98a
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Verify and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "8a2532cf5255aeb18dd27e7333dc37c2f5f5c98a"
          git -C source archive --format=tar.gz --output=/tmp/newsroom-increment5c2-current.tar.gz HEAD
          sha256sum /tmp/newsroom-increment5c2-current.tar.gz | tee /tmp/newsroom-increment5c2-current.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: newsroom-increment5c2-current-8a2532cf5255aeb18dd27e7333dc37c2f5f5c98a
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/newsroom-increment5c2-current.tar.gz
            /tmp/newsroom-increment5c2-current.sha256
