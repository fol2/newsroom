                  '                "workflow attempt identity differs from permanent workflow"\n'
                  "            )\n"
                  '        for field_name in ("run_id", "run_attempt", "run_number"):\n'
              ),
              (
                  "        if expected != (self.workflow_id, self.workflow_name):\n"
                  "            raise Increment5ContractError(\n"
                  '                "workflow attempt identity differs from permanent workflow"\n'
                  "            )\n"
                  "        expected_event = MAIN_QUALIFICATION_WORKFLOW_EVENTS.get(self.key)\n"
                  "        if self.event != expected_event:\n"
                  "            raise Increment5ContractError(\n"
                  '                "workflow attempt event differs from permanent workflow"\n'
                  "            )\n"
                  '        for field_name in ("run_id", "run_attempt", "run_number"):\n'
              ),
              label="workflow evidence event validation",
          )
          main = replace_once(
              main,
              (
                  '    if value.get("event") != "push":\n'
                  "        raise Increment5ContractError(\n"
                  '            "workflow attempt is not a main push"\n'
                  "        )\n"
              ),
              (
                  "    expected_event = MAIN_QUALIFICATION_WORKFLOW_EVENTS[key]\n"
                  '    if value.get("event") != expected_event:\n'
                  "        raise Increment5ContractError(\n"
                  '            f"workflow attempt event differs for {key}"\n'
                  "        )\n"
              ),
              label="workflow parser event validation",
          )
          main = replace_once(
              main,
              (
                  '        workflow_name=str(value.get("workflow_name")),\n'
                  "        run_id=_require_positive_integer(\n"
              ),
              (
                  '        workflow_name=str(value.get("workflow_name")),\n'
                  '        event=str(value.get("event")),\n'
                  "        run_id=_require_positive_integer(\n"
              ),
              label="workflow evidence construction",
          )
          main = replace_between(
              main,
              "def _validate_decision_document(\n",
              "def _signed_decision_value(\n",
              VALIDATE_FUNCTION,
              label="canonical decision validation",
          )
          main = replace_between(
              main,
              "def _signed_decision_value(\n",
              "def main_qualification_record_value(\n",
              SIGNED_FUNCTION,
              label="canonical decision builder",
          )
          main = replace_once(
              main,
              (
                  "    (\n"
                  "        decision_document_digest,\n"
                  "        decision_identity,\n"
                  "        test_count,\n"
                  "        skip_count,\n"
                  "    ) = _validate_decision_document(\n"
              ),
              (
                  "    (\n"
                  "        _canonical_document,\n"
                  "        decision_document_digest,\n"
                  "        decision_identity,\n"
                  "        test_count,\n"
                  "        skip_count,\n"
                  "    ) = _validate_decision_document(\n"
              ),
              label="canonical loader result",
          )
          write_text(main_path, main)

          schema_path = Path(
              "newsroom/increment5/data/"
              "increment5a_main_qualification_record_v2.schema.json"
          )
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          workflow_properties = schema["properties"]["workflow_attempts"]["properties"]
          for key in workflow_properties:
              workflow_properties[key]["properties"]["event"] = {
                  "const": (
                      "workflow_dispatch"
                      if key == "SDLC_EVIDENCE_SHADOW"
                      else "push"
                  )
              }
          schema_path.write_bytes(canonical_json_bytes(schema))

          write_text(
              Path("newsroom/tests/test_increment5a_main_qualification.py"),
              TEST_CONTENT,
          )

          approval_doc_path = Path(
              "docs/decisions/"
              "2026-08-01-increment-5a-owner-approval-attestation.md"
          )
          approval_doc = approval_doc_path.read_text(encoding="utf-8")
          approval_doc = replace_once(
              approval_doc,
              (
                  "An admitted record authorizes only:\n\n"
                  "- implementation of issues #251–#254 under the exact bound contracts; and\n"
                  "- production-equivalent qualification under the pre-registered Evaluation\n"
                  "  Plan.\n"
              ),
              (
                  "An admitted owner record authorizes only production-equivalent\n"
                  "qualification under the pre-registered Evaluation Plan. It does not\n"
                  "authorize implementation of #251–#254. That authority can exist only in\n"
                  "the separately pinned post-merge main-admission record.\n"
              ),
              label="qualification-only approval documentation",
          )
          write_text(approval_doc_path, approval_doc)

          trace_path = Path("newsroom/increment5/traceability.py")
          trace = trace_path.read_text(encoding="utf-8")
          trace = replace_between(
              trace,
              "def _anchor_for(requirement_id: str) -> str:\n",
              "def _row(requirement_id: str) -> Increment5TraceabilityRow:\n",
              TRACE_BLOCK,
              label="DOPS traceability anchors",
          )
          write_text(trace_path, trace)

          trace_test_path = Path("newsroom/tests/test_increment5a_traceability.py")
          trace_test = trace_test_path.read_text(encoding="utf-8")
          trace_test = replace_once(
              trace_test,
              '        assert row.decision_anchor.startswith("newsroom/increment5/data/")\n',
              (
                  "        assert (\n"
                  '            row.decision_anchor.startswith("newsroom/increment5/data/")\n'
                  '            or row.decision_anchor.startswith("issue:#254:deferred:")\n'
                  "        )\n"
              ),
              label="deferred trace anchor acceptance",
          )
          insert_marker = "def test_increment5a_documents_are_present() -> None:\n"
          trace_test = replace_once(
              trace_test,
              insert_marker,
              TRACE_TEST_ADD + "\n\n" + insert_marker,
              label="DOPS anchor regression",
          )
          write_text(trace_test_path, trace_test)

          trace_doc_path = Path(
              "docs/traceability/increment-5-production-retrieval.md"
          )
          trace_doc = trace_doc_path.read_text(encoding="utf-8")
          trace_doc = replace_once(
              trace_doc,
              (
                  "Every row names the canonical decision JSON pointer, implementation symbol, "
                  "verification node and exact issue boundary. Tests reject duplicate "
                  "requirements, unknown issue boundaries, missing families, false graph-free "
                  "or fake-production language, and changes to the expected delivery "
                  "distribution.\n"
              ),
              (
                  "Every row names either a real canonical decision JSON pointer or an explicit "
                  "#254 deferred-evidence anchor, plus its implementation symbol, verification "
                  "node and exact issue boundary. Tests reject duplicate requirements, unknown "
                  "issue boundaries, missing families, invented budget pointers, false "
                  "graph-free or fake-production language, and changes to the expected delivery "
                  "distribution.\n"
              ),
              label="traceability reading guidance",
          )
          write_text(trace_doc_path, trace_doc)

          attempt_doc_path = Path(
              "docs/decisions/"
              "2026-08-01-increment-5a-attempt-bound-main-admission.md"
          )
          attempt_doc = attempt_doc_path.read_text(encoding="utf-8")
          attempt_doc = replace_once(
              attempt_doc,
              (
                  "main-qualification record. Each of the six permanent workflows is represented\n"
                  "by one exact attempt with immutable workflow ID/name, run ID and attempt,\n"
                  "repository ID, push event, `refs/heads/main`, head commit/tree, workflow SHA/ref,\n"
                  "successful conclusion, exact API/HTML URLs and canonical timestamps. All\n"
                  "attempts must be distinct and must bind the declared merged-main commit/tree.\n"
              ),
              (
                  "main-qualification record. CI, Authority A2a, Authority A2b, Projection B1\n"
                  "and Projection B2/B3/C1 Neo4j each require one truthful `push` attempt on\n"
                  "`refs/heads/main`; SDLC Evidence Shadow requires one truthful\n"
                  "`workflow_dispatch` attempt. Every attempt retains immutable workflow\n"
                  "ID/name, run ID and attempt, repository ID, head commit/tree, workflow\n"
                  "SHA/ref, successful conclusion, exact API/HTML URLs and canonical timestamps.\n"
                  "All attempts must be distinct and bind the same declared merged-main\n"
                  "commit/tree.\n"
              ),
              label="truthful workflow attempt documentation",
          )
          attempt_doc = replace_once(
              attempt_doc,
              (
                  "The signed SDLC evidence is embedded as its exact canonical decision document.\n"
                  "The loader recomputes its document digest and requires `result=PASS`,\n"
              ),
              (
                  "The signed SDLC evidence is embedded as its exact canonical decision document.\n"
                  "The loader first validates it through\n"
                  "`scripts.sdlc.shadow_decision.validate_shadow_decision` under the\n"
                  "repository SDLC contract, then recomputes its document digest and requires\n"
                  "`result=PASS`,\n"
              ),
              label="canonical validator documentation",
          )
          write_text(attempt_doc_path, attempt_doc)

          postmerge_doc_path = Path(
              "docs/decisions/"
              "2026-08-01-increment-5a-post-merge-qualification-gate.md"
          )
          postmerge_doc = postmerge_doc_path.read_text(encoding="utf-8")
          postmerge_doc = replace_once(
              postmerge_doc,
              (
                  "- distinct CI, Authority A2a, Authority A2b, Projection B1, authenticated\n"
                  "  Projection B2/B3/C1 Neo4j and signed SDLC workflow run IDs;\n"
                  "- the signed SDLC decision digest and zero-failure, zero-error,\n"
                  "  zero-required-skip totals; and\n"
              ),
              (
                  "- distinct successful CI, Authority A2a, Authority A2b, Projection B1 and\n"
                  "  authenticated Projection B2/B3/C1 Neo4j `push` attempts on exact main;\n"
                  "- one distinct successful SDLC Evidence Shadow `workflow_dispatch` attempt\n"
                  "  on the same exact main commit and tree;\n"
                  "- the complete signed SDLC decision validated through the canonical\n"
                  "  repository parser, with zero-failure, zero-error and zero-required-skip\n"
                  "  totals; and\n"
              ),
              label="post-merge attempt documentation",
          )
          write_text(postmerge_doc_path, postmerge_doc)

          from newsroom.increment5 import main_qualification as qualification

          if schema_path.read_bytes() != canonical_json_bytes(
              qualification.MAIN_QUALIFICATION_RECORD_SCHEMA
          ):
              raise RuntimeError("main qualification schema artifact is not canonical")
          new_schema_digest = qualification.MAIN_QUALIFICATION_RECORD_SCHEMA_DIGEST
          if new_schema_digest == OLD_SCHEMA_DIGEST:
              raise RuntimeError("main qualification schema digest did not change")

          for path in Path("docs").rglob("*.md"):
              value = path.read_text(encoding="utf-8")
              if OLD_SCHEMA_DIGEST in value:
                  write_text(path, value.replace(OLD_SCHEMA_DIGEST, new_schema_digest))

          for path in Path(".").rglob("*"):
              if (
                  path.is_file()
                  and ".git" not in path.parts
                  and path.suffix in {".py", ".md", ".json", ".yml", ".yaml"}
                  and path.as_posix()
                  != ".github/workflows/temp-increment5a-fresh-findings.yml"
              ):
                  value = path.read_text(encoding="utf-8")
                  if OLD_SCHEMA_DIGEST in value:
                      raise RuntimeError(f"stale main schema digest remains in {path}")

          print(new_schema_digest)
          PY

      - name: Verify focused contract and adversarial regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m compileall -q \
            newsroom/increment5 \
            newsroom/tests/test_increment5a_main_qualification.py \
            newsroom/tests/test_increment5a_traceability.py
          uv run --no-sync python -m pytest -q \
            newsroom/tests/test_increment5a_main_qualification.py \
            newsroom/tests/test_increment5a_traceability.py \
            newsroom/tests/test_increment5a_approval.py \
            newsroom/tests/test_increment5a_contracts.py \
            newsroom/tests/test_increment5a_zero_budget_schema.py \
            newsroom/tests/test_sdlc_shadow_decision.py
          test ! -e newsroom/increment5/data/increment5a_owner_approval_record_v1.json
          test ! -e newsroom/increment5/data/increment5a_main_qualification_record_v2.json
          git diff --check

      - name: Commit tested correction and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-increment5a-fresh-findings.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f \
            newsroom/increment5/data/increment5a_main_qualification_record_v2.schema.json
          git commit -m "fix(increment5): close exact-main admission review gaps"
          git push origin HEAD:agent/increment-5a-retrieval-contract
