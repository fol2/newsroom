name: PR Lifecycle

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - converted_to_draft
      - ready_for_review
      - synchronize
      - labeled
      - unlabeled
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Generate a plan or apply one exact reviewed plan
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      reviewed_revision:
        description: Exact 40-character revision from the reviewed plan
        required: false
        type: string
        default: ""
      reviewed_evaluation_time:
        description: Exact RFC3339 evaluation time from the reviewed plan
        required: false
        type: string
        default: ""
      reviewed_plan_digest:
        description: Exact sha256 digest from the reviewed plan
        required: false
        type: string
        default: ""
      confirmation:
        description: Type CLOSE_ELIGIBLE_DISPOSABLE_PRS to authorize apply
        required: false
        type: string
        default: ""

jobs:
  validate:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate lifecycle metadata
        run: python -m scripts.sdlc.pr_lifecycle validate-event

  inventory-plan:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'plan')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LIFECYCLE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build immutable reviewable lifecycle plan
        run: >-
          python -m scripts.sdlc.pr_lifecycle inventory
          --revision "${LIFECYCLE_REVISION}"
          --plan-output pr-lifecycle-plan.json

      - name: Preserve exact plan for review
        uses: actions/upload-artifact@v4
        with:
          name: pr-lifecycle-plan-${{ github.run_id }}
          path: pr-lifecycle-plan.json
          if-no-files-found: error
          retention-days: 14

  inventory-apply:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'apply' &&
      inputs.reviewed_revision != '' &&
      inputs.reviewed_evaluation_time != '' &&
      inputs.reviewed_plan_digest != '' &&
      inputs.confirmation == 'CLOSE_ELIGIBLE_DISPOSABLE_PRS'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_HOUSEKEEPING_APPLY: CLOSE_ELIGIBLE_DISPOSABLE_PRS
      LIFECYCLE_REVISION: ${{ github.sha }}
      REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
      REVIEWED_EVALUATION_TIME: ${{ inputs.reviewed_evaluation_time }}
      REVIEWED_PLAN_DIGEST: ${{ inputs.reviewed_plan_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact reviewed execution revision
        run: test "${LIFECYCLE_REVISION}" = "${REVIEWED_REVISION}"

      - name: Recompute and apply only the exact reviewed lifecycle plan
        run: >-
          python -m scripts.sdlc.pr_lifecycle inventory --apply
          --revision "${LIFECYCLE_REVISION}"
          --evaluation-time "${REVIEWED_EVALUATION_TIME}"
          --reviewed-revision "${REVIEWED_REVISION}"
          --reviewed-plan-digest "${REVIEWED_PLAN_DIGEST}"
