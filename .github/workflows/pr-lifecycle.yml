name: PR Lifecycle

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - converted_to_draft
      - ready_for_review
      - synchronize
      - labeled
      - unlabeled
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Close eligible disposable PRs after reviewing the dry run
        required: true
        type: boolean
        default: false
      confirmation:
        description: Type CLOSE_ELIGIBLE_DISPOSABLE_PRS to authorize apply
        required: false
        type: string
        default: ""

jobs:
  validate:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate lifecycle metadata
        run: python -m scripts.sdlc.pr_lifecycle validate-event

  inventory-dry-run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build read-only lifecycle inventory
        run: python -m scripts.sdlc.pr_lifecycle inventory

  inventory-apply:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.apply == true &&
      inputs.confirmation == 'CLOSE_ELIGIBLE_DISPOSABLE_PRS'
    needs: inventory-dry-run
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_HOUSEKEEPING_APPLY: CLOSE_ELIGIBLE_DISPOSABLE_PRS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revalidate and apply eligible lifecycle closures
        run: python -m scripts.sdlc.pr_lifecycle inventory --apply
